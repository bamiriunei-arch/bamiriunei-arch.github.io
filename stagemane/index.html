  function backupNag() {
    try {
      const s = store.get(SLUG + '.v1'); if (!s || s.sample) return;
      const today = ymd(); if (pref('bkNagDay', '') === today) return;
      const last = +pref('lastBackup', 0), days = last ? Math.floor((Date.now() - last) / 86400000) : null, lim = isSchool() ? 7 : 30;
      if (days != null && days < lim) return;
      setPref('bkNagDay', today);
      toast(days == null ? 'まだバックアップを保存していません。楽屋の「バックアップ」でファイルに保存しておくと安心です' : `最後のバックアップから${days}日たちました。楽屋の「バックアップ」で保存しておくと安心です`, '楽屋を開く', () => { location.href = linkTo('gakuya') + '#backup'; }, 9000);

  /* ---------- 一般の団体・地域クラブの呼び方 ----------
     ツールの画面は学校の言葉（部員・休部・退部・顧問）で書いてあるので、一般の団体・地域クラブでは、画面に出た文字を

  function adultWords() {
    const t = orgType(); if (t !== 'ippan' && t !== 'chiiki') return;
    const w = words(t), SKIP = 'textarea,script,style,[contenteditable],[data-keep-words]';
    const has = s => /部員|休部|退部|顧問/.test(s);
    const fix = s => s.replace(/部員/g, w.member).replace(/休部/g, w.leave).replace(/退部/g, '退団').replace(/顧問/g, w.staff);
    const text = n => { if (has(n.data) && !(n.parentElement && n.parentElement.closest(SKIP))) n.data = fix(n.data); };

  /* ---------- ホーム画面に追加したとき・ネットがないときに開けるようにする ---------- */

    CONCERT_KINDS, normConcert, normDay, concerts, concertOf, concertLabel, concertFor, saveConcert, ensureConcert, concertFromUrl, watchConcertUrl, concertUrl, openForConcert, recForConcert, concertField, wireConcertField, readConcertField, concertChip,

})();

function templateProgram(info) {
  const st = parseHM(info.start) ?? 1110, op = parseHM(info.open), en = parseHM(info.end);
  const T = (it, min) => { if (min != null) it.time = hm(min); return it; };
  const piece = () => newItem('piece');
  return [
    T(preset('mark-open'), op), T(preset('anno-1bell'), st - 5), preset('part-1'), T(preset('anno-honbell'), st), preset('cue-open'),
    piece(), preset('cue-after'), newItem('mc'), preset('cue-before'), piece(), preset('cue-end-part'),
    preset('anno-break'), preset('brk-15'), preset('part-2'), preset('anno-1bell-2'), preset('anno-honbell-2'),
    piece(), preset('cue-after'), newItem('mc'), preset('cue-before'), piece(), preset('cue-final'), T(preset('anno-end'), en), preset('mark-end'),
  ];
}
function templateTT(info) {
  const st = parseHM(info.start) ?? 1110, op = parseHM(info.open) ?? st - 30, en = parseHM(info.end) ?? st + 90;
  const cols = [{ id: uid('k'), name: '舞台', w: 1 }, { id: uid('k'), name: '生徒', w: 3 }, { id: uid('k'), name: '手伝い', w: 2 }, { id: uid('k'), name: 'その他', w: 2 }];
  const R = (min, cells) => ({ id: uid('r'), time: hm(min), cells: Object.fromEntries(cols.map((c, i) => [c.id, { t: cells[i] || '', m: false }])) });
  return {
    cols, end: hm(en + 60), rows: [
      R(st - 450, ['仕込み', 'ホール集合\n音出し']), R(st - 390, ['', '舞台準備・立ち位置確認']), R(st - 360, ['', '基礎合奏']),
      R(st - 330, ['', '第1部リハーサル']), R(st - 240, ['', '第2部リハーサル']), R(st - 120, ['', '休憩・準備']),
      R(op, ['', '開場', 'ロビー・舞台裏']), R(st, ['本番', '開演\n\n本番\n\n終演', '本番']), R(en, ['', '片付け', '片付け']), R(en + 30, ['', '解散予定']),
    ],
  };
}
function blankConcert() {

/* 読み込んだデータを整える（欠けている所を補い、部首の字を直す）。直した字数を返す */
function normalizeConcert(c) {
  if (!c || typeof c !== 'object') throw new Error('演奏会のデータではありません');
  if (typeof c.id !== 'string' || !/^[A-Za-z0-9_-]{3,60}$/.test(c.id)) c.id = uid('c');
  c.v = 1;
  c.createdAt = +c.createdAt || Date.now();
  c.updatedAt = +c.updatedAt || Date.now();
  c.info = Object.assign({ org: '', title: '', date: '', venue: '', open: '', start: '', end: '', edition: '', logo: '', concert: '' }, c.info || {});
  for (const k of Object.keys(c.info)) if (c.info[k] == null) c.info[k] = '';
  const ds = defaultSettings();
  c.settings = Object.assign(ds, c.settings || {});
  if (!Array.isArray(c.settings.ignored)) c.settings.ignored = [];
  c.settings.rsLabels = Object.assign(defaultSettings().rsLabels, (c.settings && c.settings.rsLabels) || {});
  const seen = new Set();
  const fresh = (id, p) => { if (typeof id !== 'string' || !id || seen.has(id)) id = uid(p); seen.add(id); return id; };
  c.program = (Array.isArray(c.program) ? c.program : []).filter(x => x && TYPES[x.type]).map(x => {
    const it = newItem(x.type, x);
    it.id = fresh(x.id, 'i');
    it.rs = (x.rs && typeof x.rs === 'object' && !Array.isArray(x.rs)) ? x.rs : {};
    it.extra = (Array.isArray(x.extra) ? x.extra : []).map(e => Object.assign(newExtra(), e, { id: fresh(e && e.id, 'e') }));
    if (it.type === 'piece') {
      it.parts = (Array.isArray(x.parts) ? x.parts : []).map(p => Object.assign(newPart(), p, { id: fresh(p && p.id, 'p') }));
      if (it.dur != null && !isFinite(+it.dur)) it.dur = null; else if (it.dur != null) it.dur = +it.dur;
      it.parts.forEach(p => { if (p.dur != null && !isFinite(+p.dur)) p.dur = null; else if (p.dur != null) p.dur = +p.dur; });
    }
    if (it.type === 'cue' && !Array.isArray(it.steps)) it.steps = splitSteps(String(it.steps || ''));
    return it;
  });
  const ids = new Set(c.program.map(x => x.id));
  c.program.forEach(it => { if (it.type === 'piece' && it.contOf && !ids.has(it.contOf)) it.contOf = ''; });
  const T = c.timetable && typeof c.timetable === 'object' ? c.timetable : templateTT(c.info);
  T.cols = (Array.isArray(T.cols) && T.cols.length ? T.cols : [{ id: 'k1', name: '内容', w: 3 }]).map(k => ({ id: fresh(k.id, 'k'), name: String(k.name ?? ''), w: [1, 2, 3, 4].includes(+k.w) ? +k.w : 2 }));
  T.rows = (Array.isArray(T.rows) ? T.rows : []).map(r => {
    const row = { id: fresh(r.id, 'r'), time: String(r.time || ''), cells: {} };
    T.cols.forEach(k => { const cl = (r.cells || {})[k.id] || {}; row.cells[k.id] = { t: String(cl.t || ''), m: !!cl.m }; });
    return row;
  });
  T.end = String(T.end || '');
  c.timetable = T;
  c.runs = (Array.isArray(c.runs) ? c.runs : []).filter(r => r && typeof r === 'object' && r.marks && typeof r.marks === 'object').slice(-5);
  return deepFix(c);
}

/* ───────── 4. 保存 ───────── */
const LS = 'stagemane.v1';
const S = { order: [], concerts: {}, current: null, tomb: {}, intro: true, ok: true, fresh: false };
let C = null;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { return false; } try { GKY.store.touch(k); } catch (e) { /* 数えなくても動く */ } return true; }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* なし */ } try { GKY.store.touch(k, -Date.now()); } catch (e) { /* 数えなくても動く */ } }
function saveIndex() { lsSet(LS, JSON.stringify({ order: S.order, current: S.current, tomb: S.tomb, intro: S.intro, sample: S.order.length > 0 && S.order.every(id => id === SAMPLE_ID) })); }
function saveConcertLocal(c) { const ok = lsSet(LS + '.c.' + c.id, JSON.stringify(c)); S.ok = ok; return ok; }
function loadLocal() {
  const raw = lsGet(LS);
  if (!raw) return false;
  try {
    const idx = JSON.parse(raw);
    S.tomb = idx.tomb || {};
    S.intro = idx.intro !== false;
    for (const id of (idx.order || [])) {
      const r = lsGet(LS + '.c.' + id);
      if (!r) continue;
      try { const c = JSON.parse(r); normalizeConcert(c); if (!S.concerts[c.id]) { S.concerts[c.id] = c; S.order.push(c.id); } } catch (e) { /* 壊れた1件は飛ばす */ }
    }
    S.current = S.concerts[idx.current] ? idx.current : (S.order[0] || null);
    return S.order.length > 0;
  } catch (e) { return false; }
}

/* Claudeのアカウントへの保存（アーティファクトとして開いた時だけ） */
const cloud = { db: null, col: null, state: 'off', pending: new Map(), busy: false, again: false, t: null };
async function withRetry(fn) {
  try { return await fn(); } catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 700)); return fn(); }
    throw e;
  }
}
async function cloudInit() {
  if (!HAS_CLAUDE) return;
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  try { id = await user.id(); } catch (e) { id = null; }
  if (!id) return;
  try { cloud.col = db.collection('data/users/' + id); } catch (e) { return; }
  cloud.db = db;
  setCloud('syncing');
  try {
    const snap = await withRetry(() => cloud.col.get());
    const remote = new Map();
    snap.docs.forEach(d => { if (d.exists) remote.set(d.id, d.data()); });
    let curChanged = false;
    for (const [rid, body] of remote) {
      const local = S.concerts[rid];
      const rt = +body.updatedAt || 0;
      if (body.deleted) {
        if (local && (local.updatedAt || 0) <= rt) { dropLocal(rid); if (C && C.id === rid) curChanged = true; }
        continue;
      }
      if (S.tomb[rid] && S.tomb[rid] >= rt) continue;
      if (!local || rt > (local.updatedAt || 0)) {
        try {
          const c = JSON.parse(body.json);
          normalizeConcert(c);
          c.id = rid;
          S.concerts[rid] = c;
          if (!S.order.includes(rid)) S.order.push(rid);
          saveConcertLocal(c);
          if (C && C.id === rid) curChanged = true;
        } catch (e) { /* 壊れた1件は飛ばす */ }
      }
    }
    for (const id2 of S.order) {
      const lc = S.concerts[id2], rb = remote.get(id2);
      if (!rb || (!rb.deleted && (lc.updatedAt || 0) > (+rb.updatedAt || 0))) cloud.pending.set(id2, lc);
    }
    for (const tid of Object.keys(S.tomb)) {
      const rb = remote.get(tid);
      if (rb && !rb.deleted && (+rb.updatedAt || 0) <= S.tomb[tid]) cloud.pending.set(tid, { id: tid, __deleted: true, updatedAt: S.tomb[tid] });
    }
    if (S.fresh) {
      const latest = S.order.map(i => S.concerts[i]).filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      if (latest && latest.id !== S.current) { S.current = latest.id; curChanged = true; }
    }
    saveIndex();
    if (curChanged || !S.concerts[S.current]) { S.current = S.concerts[S.current] ? S.current : S.order[0]; if (S.current) switchTo(S.current, true); }
    else renderSelector();
    setCloud('ok');
    if (cloud.pending.size) cloudFlush();
  } catch (e) { setCloud('error'); }
}
function cloudQueue(c) {
  if (!cloud.db) return;
  cloud.pending.set(c.id, c);
  clearTimeout(cloud.t);
  cloud.t = setTimeout(cloudFlush, 1500);
}
async function cloudFlush() {
  if (!cloud.db) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true;
  setCloud('syncing');
  let failed = false;
  try {
    while (cloud.pending.size) {
      const [id, c] = cloud.pending.entries().next().value;
      cloud.pending.delete(id);
      const body = c.__deleted
        ? { v: 1, updatedAt: c.updatedAt, deleted: true, json: '' }
        : { v: 1, updatedAt: c.updatedAt, deleted: false, title: (c.info && c.info.title) || '', json: JSON.stringify(c) };
      if (new Blob([body.json]).size > 240000) { failed = true; toast('データが大きすぎてアカウントに保存できません。ロゴ画像を小さくしてください（この端末には保存されています）'); continue; }
      try { await withRetry(() => cloud.col.doc(id).set(body)); } catch (e) { failed = true; }
    }
  } finally {
    cloud.busy = false;
    setCloud(failed ? 'error' : 'ok');
    if (cloud.again) { cloud.again = false; cloudFlush(); }
  }
}
function setCloud(s) { cloud.state = s; updatePill(); }
function updatePill() {
  const p = $('#syncPill');
  if (!p) return;
  let s, t, title;
  if (!S.ok) { s = 'none'; t = '自動保存できません'; title = 'このブラウザでは自動保存ができません。「データを書き出す」でファイルに残してください。'; }
  else if (cloud.db) {
    s = cloud.state === 'syncing' ? 'syncing' : cloud.state === 'error' ? 'error' : 'ok';
    t = { ok: '自動保存済み', syncing: '保存中…', error: '保存に失敗' }[s];
    title = s === 'error' ? 'アカウントへの保存に失敗しました。この端末には保存されています。' : 'この端末と、Claudeのアカウントに自動保存しています。別の端末で開いても続きから使えます。';
  } else { s = 'local'; t = 'この端末に自動保存'; title = 'このブラウザに自動保存しています。別の端末へ移すときは「データを書き出す」でファイルにしてください。'; }

  return `<label class="fld${wide ? ' wide' : ''}"><span>${label}</span><input type="text" ${attr(o, f, '', re ? 'data-re="1"' : '')} value="${esc(val)}" placeholder="${esc(ph)}"${list ? ` list="${list}"` : ''} autocomplete="off">${hint ? `<span class="hint">${hint}</span>` : ''}</label>`;
}
function fTime(o, f, label, val) {
  return `<label class="fld"><span>${label}</span><input type="text" class="tin" inputmode="numeric" maxlength="5" placeholder="--:--" ${attr(o, f, 'time')} value="${esc(dispTime(val))}" autocomplete="off"></label>`;
}
function fArea(o, f, label, val, { ph = '', rows = 3, tokens = false, hint = '' } = {}) {
  const id = fid(o, f);
  const tk = tokens ? `<div class="tokens">差し込み：${['{団体名}', '{演奏会名}', '{日付}', '{会場}'].map(t => `<button type="button" class="tok" data-act="tok" data-target="${id}" data-v="${t}">${t}</button>`).join('')}<button type="button" class="tok" data-act="tok" data-target="${id}" data-v="【　　　】">【　　　】空欄</button><button type="button" class="tok" data-act="ruby" data-target="${id}" title="字を選んでから押すと ｜字《》 の形になります">ふりがな</button></div>` : '';
  return `<label class="fld wide"><span>${label}</span><textarea ${attr(o, f, '')} rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>${hint ? `<span class="hint">${hint}</span>` : ''}</label>${tk}`;
}
function fNum(o, f, label, val, { ph = '', min = 0, max = 99999, step = 1, hint = '' } = {}) {
  return `<label class="fld"><span>${label}</span><input type="number" ${attr(o, f, 'num')} value="${val == null ? '' : esc(val)}" placeholder="${esc(ph)}" min="${min}" max="${max}" step="${step}" inputmode="numeric">${hint ? `<span class="hint">${hint}</span>` : ''}</label>`;
}
function fDur(o, f, label, val, { ph = "例：8'43\"" } = {}) {
  return `<label class="fld"><span>${label}</span><input type="text" ${attr(o, f, 'dur')} value="${esc(fmtDur(val))}" placeholder="${esc(ph)}" autocomplete="off"><span class="durhint"></span></label>`;
}
function fSel(o, f, label, val, opts, { re = false, num = false } = {}) {
  const has = opts.some(([v]) => String(v) === String(val));
  const all = has || val == null || val === '' ? opts : [...opts, [val, val]];
  return `<label class="fld"><span>${label}</span><select ${attr(o, f, num ? 'num' : 'sel', re ? 'data-re="1"' : '')}>${all.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function fChk(o, f, label, val, { re = false } = {}) {
  return `<label class="chk"><input type="checkbox" ${attr(o, f, 'bool', re ? 'data-re="1"' : '')}${val ? ' checked' : ''}>${label}</label>`;
}

function introHTML() {
  if (!S.intro || !C || C.id !== SAMPLE_ID) return '';
  return `<div class="intro"><p>例の演奏会が入っています（団体・指揮者の名前は架空のものです）。ここで直すと「仕上がり」の書類がその場で変わります。新しい演奏会は上の「新規」から、来年の分は「複製」から作れます。</p><button class="ibtn" data-act="intro-close" aria-label="この案内を閉じる" title="閉じる">${IC.del}</button></div>`;

function renderEditor() {
  const body = $('#editBody');
  if (!body || !C) return;
  const prevTab = body.dataset.tab;
  if (prevTab) UI.scroll[prevTab] = body.scrollTop;
  $$('[data-etab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.etab === UI.etab)));
  REG = new Map(); PARENT = new Map();
  reg(C.info, 'info'); reg(C.settings, 'settings'); reg(C.settings.rsLabels, 'labels'); reg(C.timetable, 'tt');
  let html;
  if (UI.etab === 'info') html = viewInfo();
  else if (UI.etab === 'tt') html = viewTT();
  else if (UI.etab === 'check') html = viewCheck();
  else html = viewProgram();
  body.innerHTML = html;
  body.dataset.tab = UI.etab;
  body.scrollTop = UI.scroll[UI.etab] || 0;
  if (UI.etab === 'program') refreshCalc();
  autoGrowAll(body);
  updateCheckCount();
}

function sumbarHTML() {
  const sch = getSched();
  const music = C.program.filter(x => x.type === 'piece').reduce((a, x) => a + ((x.contOf ? partsSum(x) : pieceDur(x)) || 0), 0);
  const pieces = C.program.filter(x => x.type === 'piece' && !x.contOf).length;
  const endPlan = parseHM(C.info.end);
  const late = (endPlan != null && sch.end != null) ? sch.end - endPlan * 60 : null;
  const chip = (lab, val, cls = '') => `<span class="sumchip ${cls}">${lab}<b>${esc(val || '—')}</b></span>`;
  return chip('開演', dispTime(C.info.start)) + chip('終演の目安', clock(sch.end), late != null && late >= 60 ? 'warn' : '') + chip('予定', dispTime(C.info.end)) + chip('曲数', String(pieces)) + chip('演奏時間の計', fmtDur(music));
}

function cardBody(it) {
  const o = it.id;
  switch (it.type) {

      return `<div class="grid2">
          ${fText(o, 'who', '話す人', it.who, { list: 'dl-who', ph: '司会' })}
          ${fText(o, 'where', '話す場所', it.where, { list: 'dl-where', ph: '舞台下手' })}

      return `<div class="grid2">${fText(o, 'label', '名前', it.label, { list: 'dl-mark', ph: '例：開場' })}</div>`;
  }
  return '';

function pieceBody(it) {
  const o = it.id;
  const P = C.program, idx = P.indexOf(it);
  const parents = P.slice(0, idx).filter(x => x.type === 'piece' && !x.contOf);
  const contSel = fSel(o, 'contOf', 'メドレーのつづき（途中にMCなどが入る時）', it.contOf, [['', 'ちがう（ふつうの曲）'], ...parents.map(x => [x.id, `${x.title || '曲名未入力'}のつづき`])], { re: true });
  let h = '';
  if (it.contOf) {
    h = `<div class="grid2">${contSel}</div>
      <div class="grid2">${fArea(o, 'note', 'メモ', it.note, { rows: 1 })}</div>`;
  } else {
    h = `<div class="grid2">
        ${fText(o, 'title', '曲名', it.title, { wide: true, ph: '例：付喪神' })}
        ${fText(o, 'composer', '作曲', it.composer)}
        ${fText(o, 'arranger', '編曲', it.arranger)}
        ${fText(o, 'conductor', '指揮', it.conductor, { list: 'dl-cond', ph: '例：山田 一郎', hint: '進行表には姓（最初の空白の前）だけが入ります' })}
        ${fDur(o, 'dur', '演奏時間', it.dur)}
        ${fText(o, 'encore', 'アンコール', it.encore, { list: 'dl-enc', ph: 'なし（例：EC1）' })}
        ${contSel}
      </div>
      <div class="grid2">${fArea(o, 'note', 'メモ（ソロ・スタンドプレーなど）', it.note, { rows: 1 })}</div>`;
  }
  const off = partOffset(it), ps = partsSum(it);
  const bulkOn = UI.bulkOpen.has(o);
  h += `<div class="parts">
    <div class="parts-h">曲目リスト<span class="muted mono" style="font-weight:400">${ps != null ? '合計 ' + fmtDur(ps) : ''}</span><span class="spacer"></span>
      ${it.contOf ? '' : fChk(o, 'partsInRun', '進行表にも載せる', it.partsInRun)}
      <button type="button" class="btn sm" data-act="bulk" data-id="${o}">まとめて入力</button>
      <button type="button" class="btn sm" data-act="add-part" data-id="${o}">＋1曲</button>
    </div>
    ${it.parts.length ? `<div class="part-list" data-sortable="parts" data-id="${o}">${it.parts.map((p, k) => partRow(it, p, k, off)).join('')}</div>` : `<div class="parts-empty">${it.contOf ? 'つづきの曲を入れてください。' : 'メドレーの時は、中の曲を入れると司会原稿に番号つきで並びます。'}</div>`}
    <div class="bulk${bulkOn ? ' on' : ''}">
      <textarea id="bulk-${o}" rows="5" placeholder="1行に1曲。番号や時間は自動で読み取ります。&#10;例：&#10;1. 勇気100% (2'30&quot;)&#10;2. 東京ブギウギ (2'30&quot;)"></textarea>
      <div class="row-inline"><button type="button" class="btn sm primary" data-act="bulk-add" data-id="${o}">リストの最後に足す</button><button type="button" class="btn sm ghost" data-act="bulk" data-id="${o}">閉じる</button></div>
    </div>
  </div>`;
  return h;
}
function partRow(it, p, k, off) {

    <span class="pn"><button type="button" class="grip sm" data-grip data-id="${it.id}" data-p="${p.id}" aria-label="つまんで並べ替え" title="つまんで並べ替え">${IC.grip}</button>${off + k + 1}.</span>

    <div><input type="text" ${attr(p.id, 'dur', 'dur')} value="${esc(fmtDur(p.dur))}" placeholder="2'30&quot;" aria-label="時間" autocomplete="off"><div class="durhint"></div></div>
    <div class="pnote-wrap"><textarea ${attr(p.id, 'note', '')} rows="1" placeholder="メモ（Solo・スタンドなど）" aria-label="メモ">${esc(p.note)}</textarea></div>
    <div class="part-tools">
      <button type="button" class="ibtn" data-act="part-up" data-id="${it.id}" data-p="${p.id}" title="上へ" aria-label="上へ"${k === 0 ? ' disabled' : ''}>${IC.up}</button>
      <button type="button" class="ibtn" data-act="part-down" data-id="${it.id}" data-p="${p.id}" title="下へ" aria-label="下へ"${k === it.parts.length - 1 ? ' disabled' : ''}>${IC.down}</button>

    </div>
  </div>`;
}
function rsBox(it) {
  if (it.type === 'part') return `<div class="flags">${fChk(it.id, 'hideScript', '司会原稿に載せない', it.hideScript, { re: true })}</div>`;
  const a = rsAuto(it), L = C.settings.rsLabels, open = UI.rsOpen.has(it.id);
  const extras = it.extra.map((e, i) => {

    return `<div class="rowlab">足した行 ${i + 1}</div>` + RS_KEYS.map(k => `<input type="text" ${attr(e.id, k, '')} value="${esc(e[k] || '')}" aria-label="${esc(L[k])}（足した行${i + 1}）">`).join('') +

function autoGrow(el) { if (!NO_FIELD_SIZING || el.tagName !== 'TEXTAREA') return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function autoGrowAll(root) { if (NO_FIELD_SIZING) $$('textarea', root).forEach(autoGrow); }

/* 入力 → データ */
function setPath(obj, path, v) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
  o[path[path.length - 1]] = v;
}
function setVal(el, v) { const a = el.selectionStart, b = el.selectionEnd; el.value = v; try { el.setSelectionRange(a, b); } catch (e) { /* なし */ } }
let radCount = 0;
const radToast = debounce(() => { if (radCount) toast(`見た目が同じ別の字（部首の字）を、ふつうの漢字に${radCount}字直しました`); radCount = 0; }, 900);
function applyInput(el, commit) {
  const key = el.dataset.o, obj = REG.get(key);
  if (!obj) return;
  const path = el.dataset.f.split('.');
  const t = el.dataset.t || 'text';
  let v;
  if (t === 'bool') v = el.checked;
  else if (t === 'num') { if (el.value === '') v = null; else { v = Number(el.value); if (!isFinite(v)) return; } }
  else if (t === 'dur') {
    const d = parseDur(el.value);
    const hint = el.parentElement.querySelector('.durhint');
    if (Number.isNaN(d)) { el.classList.add('bad'); if (hint) hint.textContent = `例：2'30" ／ 2:30 ／ 2分30秒`; return; }
    el.classList.remove('bad');
    v = d;
    if (commit) { el.value = fmtDur(d); if (hint) hint.textContent = ''; }
    else if (hint) hint.textContent = d == null ? '' : '= ' + fmtDur(d);
  } else if (t === 'time') {
    const raw = el.value.trim();
    const p = parseHM(raw);
    if (raw === '') { v = ''; el.classList.remove('bad'); }
    else if (p == null) { if (commit) { el.classList.add('bad'); toast('時刻は「18:30」や「1830」の形で入れてください'); } return; }
    else { v = hm(p); el.classList.remove('bad'); if (commit) el.value = v; }
  } else if (t === 'steps') {
    const [s, n] = fixRad(el.value);
    if (n) { setVal(el, s); radCount += n; radToast(); }
    v = splitSteps(s);
  } else {
    const [s, n] = fixRad(el.value);
    if (n) { setVal(el, s); radCount += n; radToast(); }
    v = (t === 'sel' || t === 'date') ? el.value : s;
  }
  const before = JSON.stringify(path.reduce((o, k) => (o == null ? undefined : o[k]), obj));
  if (before === JSON.stringify(v)) { if (commit && el.dataset.re) postCommit(el, key, obj); return; }
  setPath(obj, path, v);
  changed();
  const owner = obj.type ? obj : findItem(PARENT.get(key));
  if (owner) updateCardSummary(owner);
  if (key === 'info' && (path[0] === 'title' || path[0] === 'date')) renderSelector();
  if (key === 'info' && path[0] === 'org' || key === 'info' && path[0] === 'title') { /* 差し込みの表示を更新 */ $$('[data-sum]').forEach(s => { const it = findItem(s.dataset.sum); if (it) updateCardSummary(it); }); }
  if (commit || el.type === 'checkbox' || el.tagName === 'SELECT') postCommit(el, key, obj);
  if (commit && key === 'tt' && path[0] === 'end' && !el.dataset.re) renderEditor();
}
function postCommit(el, key, obj) {
  if (!el.dataset.re) return;
  if (key && REG.get(key) && C.timetable.rows.includes(obj) && el.dataset.f === 'time') sortTT();
  renderEditor();
}
function sortTT() {
  const rows = C.timetable.rows;
  const keyed = rows.map((r, i) => ({ r, i, t: parseHM(r.time) }));
  keyed.sort((a, b) => (a.t ?? 1e9) - (b.t ?? 1e9) || a.i - b.i);
  C.timetable.rows = keyed.map(x => x.r);
  if (C.timetable.rows.length) C.timetable.rows.forEach((r, i) => { if (i === 0) Object.values(r.cells).forEach(c => { c.m = false; }); });
}

/* クリックの操作 */
function addItem(it) {
  snap();
  const P = C.program;
  let idx = P.findIndex(x => x.id === UI.insertAfter);
  idx = idx < 0 ? P.length : idx + 1;
  if (it.type === 'piece' && !it.conductor) { const prev = P.slice(0, idx).reverse().find(x => x.type === 'piece' && x.conductor); if (prev) it.conductor = prev.conductor; }
  P.splice(idx, 0, it);
  UI.open.add(it.id);
  UI.insertAfter = it.id;
  changed();
  renderEditor();
  scrollToCard(it.id, true);
}
function scrollToCard(id, flash) {
  const el = document.getElementById('card-' + id) || document.getElementById('ttrow-' + id);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function renewIds(it) {
  it.id = uid('i');
  if (it.parts) it.parts.forEach(p => { p.id = uid('p'); });
  if (it.extra) it.extra.forEach(e => { e.id = uid('e'); });
  return it;
}
const ACT = {
  'toggle': d => { if (UI.open.has(d.id)) UI.open.delete(d.id); else UI.open.add(d.id); UI.insertAfter = d.id; renderEditor(); },
  'add': d => addItem(newItem(d.type, d.type === 'brk' ? { line: true } : {})),
  'up': d => moveItem(d.id, -1),
  'down': d => moveItem(d.id, 1),
  'dup': d => {
    const P = C.program, i = P.findIndex(x => x.id === d.id);
    if (i < 0) return;
    snap();
    const cp = renewIds(clone(P[i]));
    P.splice(i + 1, 0, cp);
    UI.open.add(cp.id); UI.insertAfter = cp.id;
    changed(); renderEditor(); scrollToCard(cp.id, true);
  },
  'del': d => {
    const P = C.program, i = P.findIndex(x => x.id === d.id);

  },

  'from-setlist': () => importSetlist(),

  'add-part': d => { const it = findItem(d.id); if (!it) return; snap(); const p = newPart(); it.parts.push(p); changed(); renderEditor(); const el = document.getElementById(fid(p.id, 'title')); if (el) el.focus(); },
  'del-part': d => { const it = findItem(d.id); if (!it) return; const k = it.parts.findIndex(p => p.id === d.p); if (k < 0) return; snap(); const [p] = it.parts.splice(k, 1); changed(); renderEditor(); toast(`「${clip(p.title || '曲名なし', 14)}」を消しました`, '元に戻す', undo); },

  'del-extra': d => { const it = findItem(d.id); if (!it) return; snap(); it.extra = it.extra.filter(e => e.id !== d.e); changed(); renderEditor(); },
  'qstep': d => {

    const ta = document.getElementById(d.target);

/* つまんで並べ替え（マウス・指・ペン）。↑↓ボタンと矢印キーでも動かせる */
let dragging = null;
function startDrag(e, handle) {
  const list = handle.closest('[data-sortable]');
  const item = handle.closest('[data-sort-item]');
  if (!list || !item || dragging) return;
  e.preventDefault();
  const items = $$(':scope > [data-sort-item]', list);
  const from = items.indexOf(item);
  const rect = item.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'drag-ph';
  ph.style.height = rect.height + 'px';
  list.insertBefore(ph, item);
  item.classList.add('dragging');
  Object.assign(item.style, { position: 'fixed', left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', zIndex: '30' });
  const offY = e.clientY - rect.top;
  const scroller = list.closest('.edit-body');
  let lastY = e.clientY, raf = 0;
  const place = () => {
    item.style.top = (lastY - offY) + 'px';
    const sibs = $$(':scope > [data-sort-item]:not(.dragging)', list);
    let before = null;
    for (const sb of sibs) { const r = sb.getBoundingClientRect(); if (lastY < r.top + r.height / 2) { before = sb; break; } }
    if (before) { if (ph.nextElementSibling !== before) list.insertBefore(ph, before); }
    else if (sibs.length && sibs[sibs.length - 1].nextElementSibling !== ph) sibs[sibs.length - 1].after(ph);
  };
  const tick = () => {
    if (scroller) {
      const r = scroller.getBoundingClientRect(), edge = 60;
      let dy = 0;
      if (lastY < r.top + edge) dy = -Math.ceil((r.top + edge - lastY) / 5);
      else if (lastY > r.bottom - edge) dy = Math.ceil((lastY - (r.bottom - edge)) / 5);
      if (dy) { scroller.scrollTop += dy; place(); }
    }
    raf = requestAnimationFrame(tick);
  };
  const move = ev => { lastY = ev.clientY; place(); };
  const finish = cancel => {
    cancelAnimationFrame(raf);
    handle.removeEventListener('pointermove', move);
    handle.removeEventListener('pointerup', up);
    handle.removeEventListener('pointercancel', cancelIt);
    document.removeEventListener('keydown', esc1, true);
    const to = $$(':scope > [data-sort-item], :scope > .drag-ph', list).filter(x => x !== item).indexOf(ph);
    item.removeAttribute('style');
    item.classList.remove('dragging');
    ph.remove();
    dragging = null;
    if (cancel || to < 0 || to === from) return;
    const arr = list.dataset.sortable === 'parts' ? (findItem(list.dataset.id) || {}).parts : C.program;
    if (!arr) return;
    snap();
    const [x] = arr.splice(from, 1);
    arr.splice(to, 0, x);
    if (list.dataset.sortable === 'program') UI.insertAfter = x.id;
    changed();
    renderEditor();
  };
  const up = () => finish(false);
  const cancelIt = () => finish(true);
  const esc1 = ev => { if (ev.key === 'Escape') { ev.preventDefault(); finish(true); } };
  try { handle.setPointerCapture(e.pointerId); } catch (err) { /* なし */ }
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', cancelIt);
  document.addEventListener('keydown', esc1, true);
  dragging = { item };
  raf = requestAnimationFrame(tick);
}
function moveItem(id, dir) {
  const P = C.program, i = P.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= P.length) return;
  snap();
  [P[i], P[j]] = [P[j], P[i]];
  UI.insertAfter = id;
  changed(); renderEditor();
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function moveIn(arr, id, dir) {
  if (!arr) return;
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  snap();
  [arr[i], arr[j]] = [arr[j], arr[i]];

}
function parseBulk(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    let s = fixRad(z2h(l))[0].replace(/^(?:[(（]\d{1,2}[)）]|\d{1,2}\s*[.．,，、:：)）])\s*/, '').replace(/^[①-⑳]\s*/, '').trim();
    let dur = null;
    const m = s.match(/(?:^|[\s(（])[(（]?\s*(\d{1,2}\s*(?:'|’|′|:|：)\s*\d{2}\s*(?:"|”|″)?)\s*[)）]?\s*$/);
    if (m) { const d = parseDur(m[1]); if (d != null && !Number.isNaN(d)) { dur = d; s = s.slice(0, m.index).trim(); } }
    return newPart({ title: s, dur });

}

/* 司会原稿 */
function scriptBlocks() {
  const B = [];
  const blk = (g, m, o = {}) => {
    const el = document.createElement('div');
    el.className = 'sb' + (o.cls ? ' ' + o.cls : '');
    el.innerHTML = `<div class="g">${g || ''}</div><div class="m">${m || ''}</div>`;
    B.push({ el, keep: !!o.keep, start: !!o.start, spacer: !!o.spacer });
  };
  const gut = it => {
    let h = '';
    if (it.time) h += `<span class="tm">${esc(dispTime(it.time))}</span>`;
    if (it.type === 'anno' && it.bell) h += `<span class="bell">${esc(it.bell)}</span>`;
    if (it.type === 'brk') h += `<span>${esc(it.minutes || 0)}分間</span>`;
    return h;
  };
  const textBlocks = (g, lab, text) => {
    const lines = String(text || '').replace(/\r/g, '').split('\n');
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    const first = lines.shift();
    blk(g, lab + (first != null ? `<div class="para">${blankify(first)}</div>` : ''), { start: true, cls: 'item-start' });
    let blank = false;
    for (const ln of lines) {
      if (!ln.trim()) { if (!blank) blk('', '', { spacer: true, cls: 'spacer' }); blank = true; continue; }
      blank = false;
      blk('', `<div class="para">${blankify(ln)}</div>`);
    }
  };
  const showComp = C.settings.showComposer;
  C.program.forEach(it => {
    if (it.hideScript) return;
    const n0 = B.length;
    switch (it.type) {
      case 'part': blk('', `<div class="part-h">${esc(it.name)}</div>`, { start: true, keep: true, cls: 'part-start' }); break;
      case 'anno': textBlocks(gut(it), '<div class="lab">【カゲアナ】</div>', fill(it.text)); break;
      case 'mc': textBlocks(gut(it), `<div class="lab">〈${esc(mcLabel(it))}〉</div>`, fill(it.text)); break;
      case 'cue': blk(gut(it), it.steps.length ? `<div class="cue">${it.steps.map(esc).join('<span class="ar">⇒</span>')}</div>` : '', { start: true, cls: 'item-start' }); break;
      case 'brk': blk(gut(it), '<div class="brk">休憩</div>', { start: true, cls: 'item-start' }); break;
      case 'mark': blk(gut(it), `<div class="mark">${esc(it.label)}</div>`, { start: true, cls: 'item-start' }); break;
      case 'piece': {
        let head;
        if (it.contOf) {
          const par = findItem(it.contOf);
          head = `<div class="pc-cont">（${esc(par ? rubyStrip(par.title) : '')}のつづき）</div>` + (it.note ? `<div class="pc-note">${blankify(it.note)}</div>` : '');
        } else {
          const d = pieceDur(it);
          const sub = showComp ? [it.composer && '作曲　' + it.composer, it.arranger && '編曲　' + it.arranger].filter(Boolean).join('　／　') : '';
          head = `<div class="pc-h">${it.encore ? `<span class="pc-enc">${esc(it.encore)}</span>` : ''}<span class="pc-t">${rt(it.title || '（曲名未入力）')}</span>${d != null ? `<span class="pc-d">(${fmtDur(d)})</span>` : ''}${it.conductor ? `<span class="pc-c">指揮　${esc(it.conductor)}</span>` : ''}</div>` +
            (sub ? `<div class="pc-sub">${esc(sub)}</div>` : '') + (it.note ? `<div class="pc-note">${blankify(it.note)}</div>` : '');
        }
        blk(gut(it), head, { start: true, cls: 'item-start', keep: it.parts.length > 0 });
        const off = partOffset(it);
        it.parts.forEach((p, k) => blk('', `<div class="pt"><span class="pn">${off + k + 1}.</span><span class="ptt">${rt(p.title)}</span><span class="pd">${p.dur != null ? fmtDur(p.dur) : ''}</span>${p.note ? `<span class="pnote">${blankify(p.note)}</span>` : ''}</div>`));
        break;
      }
    }
    if (B.length > n0) B[B.length - 1].el.classList.add('item-end');
  });
  return B;
}
function buildScript(tmp) {
  const size = SIZE_PT[C.settings.scriptSize] || '10pt';
  const blocks = scriptBlocks();
  const mk = () => { const p = pageShell('script'); p.page.style.setProperty('--sfs', size); tmp.appendChild(p.sheet); return p; };
  let pg = mk(), on = [];
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (!on.length && b.spacer) continue;
    b.el.classList.toggle('cont', !on.length && !b.start);
    pg.body.appendChild(b.el);
    on.push(b);
    if (on.length > 1 && overflows(pg.body)) {
      pg.body.removeChild(b.el);
      on.pop();
      let back = 1;
      while (on.length > 1 && on[on.length - 1].keep) { pg.body.removeChild(on.pop().el); back++; }
      while (on.length > 1 && on[on.length - 1].spacer) { pg.body.removeChild(on.pop().el); }
      pg = mk(); on = [];
      i -= back;
    }
  }
  if (!blocks.length) pg.body.innerHTML = '<p style="color:#777">プログラムに項目を入れると、ここに司会原稿ができます。</p>';
}

/* 進行表 */
function buildRun(tmp) {

  const rowEl = r => {

    el._w = r.weight || 0;
    return el;
  };
  const mk = () => { const p = pageShell('run'); p.page.style.setProperty('--rcols', cols); p.body.appendChild(rowEl({ hd: true })); tmp.appendChild(p.sheet); return p; };
  const pages = [mk()];
  let pg = pages[0], on = [];
  for (let i = 0; i < rows.length; i++) {
    const el = rowEl(rows[i]);
    if (on.length) on[on.length - 1].classList.remove('last');
    el.classList.add('last');
    pg.body.appendChild(el);
    on.push(el);
    if (on.length > 1 && overflows(pg.body)) {
      pg.body.removeChild(el); on.pop();
      on[on.length - 1].classList.add('last');
      pg = mk(); pages.push(pg); on = [];
      i--;

  }
  if (!rows.length) pg.body.insertAdjacentHTML('beforeend', '<p style="color:#777;padding:4mm">プログラムに項目を入れると、ここに進行表ができます。</p>');
  if (pages.length === 1 && C.settings.rsFill) {
    $$('.rr:not(.hd)', pg.body).forEach(el => { if (el._w > 0) el.style.flexGrow = String(el._w / 60); });
  }
}

/* タイスケ */
function buildTT(tmp) {
  const T = C.timetable, cols = T.cols, st = C.settings;
  const rows = T.rows.map((r, i) => ({ r, i, t: parseHM(r.time) })).sort((a, b) => (a.t ?? 1e9) - (b.t ?? 1e9) || a.i - b.i).map(x => x.r);
  const p = pageShell('tt');
  tmp.appendChild(p.sheet);
  const endMin = parseHM(T.end);
  const starts = rows.map(r => parseHM(r.time));
  const durs = rows.map((r, i) => { const s = starts[i], e = i + 1 < rows.length ? starts[i + 1] : endMin; return (s != null && e != null && e > s) ? e - s : 0; });
  const g = document.createElement('div');
  g.className = 'ttg';
  g.style.gridTemplateColumns = `15mm ${cols.map(k => (k.w || 2) + 'fr').join(' ')}`;
  g.style.gridTemplateRows = `auto ${rows.map((r, i) => durs[i] > 0 ? `minmax(auto, ${durs[i]}fr)` : 'auto').join(' ')}`;
  let h = `<div class="hd tcol" style="grid-row:1;grid-column:1">${esc(dateShort(C.info.date))}</div>`;
  cols.forEach((k, ci) => { h += `<div class="hd" style="grid-row:1;grid-column:${ci + 2}">${esc(k.name)}</div>`; });
  const cellHTML = t => {
    const segs = String(t || '').split(/\n[ \t　]*\n/);
    return segs.length > 1 ? `<div class="spread">${segs.map(s => `<div>${esc(s)}</div>`).join('')}</div>` : esc(t);
  };
  rows.forEach((r, ri) => {
    const s = starts[ri], d = durs[ri];
    let ticks = '';
    if (st.ttTicks && s != null && d > 0) {
      for (let t = Math.floor(s / 30) * 30 + 30; t < s + d; t += 30) {
        const f = (t - s) / d;
        if (f < 0.3 || f > 0.92) continue;
        ticks += `<span class="tick" style="top:${(f * 100).toFixed(2)}%">${hm(t)}</span>`;
      }
    }
    h += `<div class="tcol" style="grid-row:${ri + 2};grid-column:1"><span class="tlab">${esc(dispTime(r.time))}</span>${st.ttDur && d > 0 ? `<span class="tdur">${d}分</span>` : ''}${ticks}</div>`;
  });
  cols.forEach((k, ci) => {
    let r = 0;
    while (r < rows.length) {
      let span = 1;
      while (r + span < rows.length && rows[r + span].cells[k.id] && rows[r + span].cells[k.id].m) span++;
      const cell = rows[r].cells[k.id] || { t: '' };
      h += `<div style="grid-row:${r + 2} / span ${span};grid-column:${ci + 2}">${cellHTML(cell.t)}</div>`;
      r += span;
    }
  });
  g.innerHTML = h;
  p.body.appendChild(g);
  let fs = 9.5;
  while (overflows(p.body) && fs > 6) { fs -= 0.5; p.page.style.setProperty('--tfs', fs + 'pt'); }
  /* 目盛りが時刻・長さの文字と重なる時や、行の下端に近すぎる時は消す */
  $$('.tcol', g).forEach(cell => {
    const lab = cell.querySelector('.tdur') || cell.querySelector('.tlab');
    if (!lab) return;
    const cb = cell.getBoundingClientRect(), lb = lab.getBoundingClientRect().bottom;
    $$('.tick', cell).forEach(t => { const r = t.getBoundingClientRect(); if (r.top < lb + 2 || r.bottom > cb.bottom - 2) t.remove(); });
  });
}

const fileBase = () => (C.info.title || '演奏会').replace(/[\\/:*?"<>|]/g, '_');
async function saveFile(name, data, mime) {
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  if (HAS_CLAUDE) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast('この画面ではファイルを保存できません'); return false; }
    try {
      const r = await dl.save({ filename: name, data });

      return true;
    } catch (e) {

      else if (c === 'rate_limited') toast('保存の確認がもう開いています。先にそちらを済ませてください');
      else toast('保存できませんでした（' + (c || '不明なエラー') + '）');
      return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);

}

/* 記録の表と、目安への反映 */
function runRowsOf(run) {
  const stops = C.program.filter(it => it.type !== 'part');
  const rows = [];
  stops.forEach((it, k) => {
    const t = run.marks[it.id];
    if (!t) return;
    const nx = stops[k + 1], tn = nx ? run.marks[nx.id] : run.end;
    const len = tn && tn > t ? Math.round((tn - t) / 1000) : null;
    rows.push({ it, t, len, est: it.type === 'piece' && it.contOf ? (partsSum(it) || 0) : itemEst(it), p: plannedOf(it), dl: deltaFor(run, it, t) });
  });
  return rows;
}
/* 押し間違い（3秒未満）や、2時間を超える長さは目安に使わない */
const fixableRow = r => r.len != null && r.len >= 3 && r.len <= 7200 && ['mc', 'anno', 'cue'].includes(r.it.type) && r.len !== r.est;
function recordsHTML() {
  const runs = (C.runs || []).filter(r => Object.keys(r.marks || {}).length);
  if (!runs.length) return '';
  const run = runs[runs.length - 1];
  const rows = runRowsOf(run);
  const fixable = rows.filter(fixableRow).length;
  const d = new Date(run.at);
  const when = `${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${pad2(d.getMinutes())}`;
  return `<section class="sec"><h3>本番モードの記録 <small>${esc(when)} から・${run.cmp === 'clock' ? '時刻で比較' : '経過時間で比較'}・${rows.length}項目</small></h3>
    <div class="tsum-wrap"><table class="rec"><thead><tr><th>項目</th><th>予定</th><th>実際</th><th>差</th><th>かかった長さ</th><th>目安</th></tr></thead><tbody>
    ${rows.map(r => { const [txt, cls] = deltaText(r.dl); return `<tr><td>${esc(TYPES[r.it.type].label)}　${esc(clip(itemSummary(r.it), 22))}</td><td>${r.p != null ? clock(r.p) : '—'}</td><td>${hms(r.t)}</td><td class="${cls}">${r.dl == null ? '—' : esc(txt)}</td><td>${r.len != null ? fmtMS(r.len) : '—'}</td><td>${r.est ? fmtMS(r.est) : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="row-inline" style="margin-top:10px">
      ${fixable ? `<button type="button" class="btn sm primary" data-act="apply-run">話す・影アナ・ト書きの目安を記録に合わせる（${fixable}項目）</button>` : ''}
      <button type="button" class="btn sm ghost" data-act="clear-runs">記録を消す</button>
    </div>
    <p class="note">「かかった長さ」は、その項目から次の項目へ進むまでの時間です。曲の演奏時間は書き換えません（拍手などが入るため）。3秒未満の押し間違いは目安に使いません。</p>
  </section>`;
}

/* ---------- 楽譜ライブラリの曲目一覧から曲を入れる ----------

function gakufuData() { const g = GKY.IN_VIEWER ? null : GKY.store.get('gakufu.v1'); return g && !g.sample && Array.isArray(g.setlists) && Array.isArray(g.songs) ? g : null; }

function gakufuLists(c = C) {
  const g = gakufuData(); if (!g) return { g: null, lists: [] };
  const cid = c.info.concert || '', lc = cid && GKY.concertOf(cid), date = (lc && lc.date) || c.info.date || '';
  const mine = l => (cid && l.concert === cid) || (!!date && !l.concert && l.date === date) || (!cid && !!date && l.date === date);
  const lists = g.setlists.filter(l => l && Array.isArray(l.ids) && l.ids.length).map(l => Object.assign({}, l, { mine: mine(l) })).sort((a, b) => b.mine - a.mine || (b.date || '').localeCompare(a.date || ''));
  return { g, lists };
}
/* 曲目一覧の曲 → プログラムの「曲」。戻り値：入れた曲の数 */
function fillPieces(songs) {
  const P = C.program, have = new Set(P.filter(x => x.type === 'piece' && x.title).map(x => GKY.key(x.title)));
  const add = songs.filter(sg => sg && sg.title && !have.has(GKY.key(sg.title)));
  if (!add.length) return 0;
  snap();
  const fields = sg => ({ title: sg.title, composer: sg.composer || '', arranger: sg.arranger || '', dur: sg.dur != null && isFinite(+sg.dur) ? Math.round(+sg.dur) : null,
    parts: (Array.isArray(sg.medley) ? sg.medley : []).filter(m => m && m.title).map(m => newPart({ title: m.title })) });
  const empty = P.filter(x => x.type === 'piece' && !String(x.title || '').trim() && !x.contOf);
  let k = 0;
  add.forEach(sg => {
    const f = fields(sg);
    if (k < empty.length) { const it = empty[k++]; Object.assign(it, f, { composer: f.composer || it.composer, arranger: f.arranger || it.arranger }); return; }
    // 札が足りないとき：最後の曲のあと（曲がなければ最後）に足す
    let at = -1; P.forEach((x, i) => { if (x.type === 'piece') at = i; });
    const it = newItem('piece', f);
    P.splice(at < 0 ? P.length : at + 1, 0, it);
  });
  changed(); renderEditor();
  return add.length;
}
