<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="演奏会の司会原稿・進行表・タイムスケジュールを、1つの入力から作る。点検・本番モード・PDF。楽屋シリーズ">
<meta name="theme-color" content="#E7EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="楽屋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191C'/%3E%3Crect x='6' y='13' width='20' height='7' rx='1' fill='%23A3192B' transform='rotate(-10 16 16)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../gakuya/apple-touch-icon.png">
<title>ステマネ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* ==== 楽屋シリーズ 共通部品（見た目） ここから ==== */
/* 全ツールで同じ内容です。楽屋（gakuya/index.html）で直してから、リポジトリのいちばん上で node sync-common.js を動かすと全ツールにそろえて写せます。
   レイアウト：舞台床のような落ち着いた灰緑の作業面に、ツールごとの色のバミリテープを1色だけ使う */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface-2:#F4F6F4; --surface-3:#E6EAE7;
  --ink:#1B211F; --muted:#5C6662; --line:#D4D9D6; --line-strong:#B5BDB8;
  --ok:#2B7A4B; --ok-soft:#E2F3E8; --warn:#9A5B00; --warn-soft:#FFF1D0; --bad:#B3261E; --bad-soft:#FBE3E0;
  --focus:#2F6FD0; --shadow:0 1px 2px rgba(18,24,22,.07),0 8px 22px rgba(18,24,22,.09);
  --tape:#D73A44; --tape-ink:#FFFFFF;
  --tape-soft:color-mix(in srgb,var(--tape) 13%,var(--surface));
  --tape-line:color-mix(in srgb,var(--tape) 45%,var(--line));
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-rule:#9A9A9A; --paper-mute:#5E5E5E; --paper-head:#EFEFEF; --paper-mark:#FFE58A;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-doc:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
    --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
    --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
    --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
  --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
  --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
  --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
a{color:inherit}
h1,h2,h3,h4{text-wrap:balance; margin:0}
.mono,.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---- 骨組み ---- */
.gky-app{min-height:100%; display:flex; flex-direction:column}
.gky-top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  padding-block:10px; padding-inline:16px; background:var(--surface); border-bottom:1px solid var(--line)}
.gky-brand{display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none}
.gky-tape{flex:none; display:inline-block; width:26px; height:10px; background:var(--tape); transform:rotate(-8deg); border-radius:1px;
  clip-path:polygon(2px 0,100% 0,calc(100% - 2px) 50%,100% 100%,0 100%,2px 50%,0 0)}
.gky-brand b{font-size:19px; font-weight:700; letter-spacing:.06em; white-space:nowrap}
.gky-brand small{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gky-top-actions{margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
@media (max-width:600px){ .gky-top-actions{width:100%; margin-left:0} .gky-top-actions>select{flex:1 1 150px; min-width:0} }
.gky-home{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 8px; white-space:nowrap}
.gky-home:hover{color:var(--ink); border-color:var(--line-strong)}
.gky-home i{display:inline-block; width:12px; height:5px; background:var(--muted); transform:rotate(-8deg)}
.gky-tabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--top-h,57px)); z-index:20; display:flex; gap:2px; padding-inline:12px; background:var(--surface); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.gky-tabs::-webkit-scrollbar{display:none}
.gky-tabs button{position:relative; border:0; background:transparent; padding:11px 12px 10px; cursor:pointer; white-space:nowrap; color:var(--muted); font-weight:500; font-size:14px}
.gky-tabs button[aria-selected="true"]{color:var(--ink); font-weight:700}
.gky-tabs button[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; background:var(--tape); border-radius:2px 2px 0 0}
.gky-tabs .count{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; margin-left:5px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:11px; font-weight:700; font-family:var(--f-mono)}
.gky-tabs .count:empty{display:none}
.gky-tabs .count.ok{background:var(--ok-soft); color:var(--ok)}
.gky-main{flex:1; width:100%; max-width:1180px; margin:0 auto; padding-block:16px 64px; padding-inline:16px}
.gky-main.wide{max-width:none}
.gky-cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
@media (max-width:860px){.gky-cols{grid-template-columns:minmax(0,1fr)}}

/* ---- 部品 ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; padding:0 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; white-space:nowrap; text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--tape); border-color:var(--tape); color:var(--tape-ink); font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2); border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.sm{min-height:28px; padding:0 9px; font-size:12px}
.btn.lg{min-height:44px; padding:0 16px; font-size:15px}
.btn:disabled{opacity:.45; cursor:default}
.btn svg,.ibtn svg{width:16px; height:16px; flex:none}
.ibtn{width:32px; height:32px; display:inline-grid; place-items:center; border-radius:6px; cursor:pointer; border:1px solid transparent; background:transparent; color:var(--muted); padding:0}
.ibtn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
.ibtn.del:hover{color:var(--bad)}
.btnrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
input[type="text"],input[type="search"],input[type="number"],input[type="date"],input[type="time"],input[type="url"],input[type="tel"],select,textarea{
  border:1px solid var(--line-strong); border-radius:6px; background:var(--surface); padding:6px 9px; min-height:34px; width:100%; min-width:0}
select{width:auto; max-width:100%}
textarea{resize:vertical; line-height:1.65; min-height:64px}
input[type="number"]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}
input.bad,select.bad{border-color:var(--bad); background:var(--bad-soft)}
label.chk{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:13px}
label.chk input{width:16px; height:16px; accent-color:var(--tape); flex:none}
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld>span{font-size:12px; color:var(--muted); font-weight:500}
.fld .hint{font-size:11.5px; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px 12px}
.grid .wide{grid-column:1/-1}

.sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 16px; margin-bottom:14px; min-width:0}
.sec>h2,.sec>h3{font-size:15px; font-weight:700; margin:0 0 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec>h2 small,.sec>h3 small{font-weight:400; color:var(--muted); font-size:12px}
.sec .note{font-size:12px; color:var(--muted); margin:8px 0 0}
.lead{font-size:13px; color:var(--muted); margin:0 0 12px; max-width:68ch}
.intro{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; margin-bottom:14px; border-radius:var(--r); background:var(--surface); border:1px dashed var(--line-strong); font-size:13px}
.intro p{margin:0; flex:1; min-width:0}
.sample-flag{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:12px; font-weight:700; white-space:nowrap}

/* テープ形のラベル */
.tape{--tc:var(--tape); --ti:var(--tape-ink); display:inline-flex; align-items:center; height:22px; padding:0 10px; flex:none;
  background:var(--tc); color:var(--ti); font-size:12px; font-weight:700; letter-spacing:.06em; line-height:1; white-space:nowrap;
  clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 22%,calc(100% - 2px) 45%,100% 70%,calc(100% - 3px) 100%,3px 100%,0 78%,2px 52%,0 26%)}
.chip{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px; font-size:12px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.chip.tp{background:var(--tape-soft); color:var(--ink); border-color:var(--tape-line)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* 集計の小さな札 */
.sums{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.sum{display:inline-flex; align-items:baseline; gap:6px; padding:6px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:12px; color:var(--muted)}
.sum b{font-family:var(--f-mono); font-size:15px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.sum.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); background:var(--warn-soft)} .sum.warn b{color:var(--warn)}
.sum.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line)); background:var(--bad-soft)} .sum.bad b{color:var(--bad)}
.sum.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); background:var(--ok-soft)} .sum.ok b{color:var(--ok)}

/* 表 */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.tbl{border-collapse:collapse; width:100%; font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle}
.tbl thead th{position:sticky; top:0; z-index:1; background:var(--surface-2); font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--tape-soft)}
.tbl input,.tbl select{min-height:30px; padding:3px 6px}
/* スマホ：表の列が細くなりすぎて1文字ずつ折り返さないように（入りきらないときは、表の中だけ横に動く） */
@media (max-width:600px){ .tbl td{min-width:3.6em} .tbl td.num,.tbl td:empty{min-width:0} .tbl td.mono{white-space:nowrap} }

/* 一覧 */
.list{display:flex; flex-direction:column; gap:8px}
.item{display:flex; align-items:center; gap:10px; padding:9px 10px 9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); min-width:0}
.item.on{border-color:var(--tape); box-shadow:0 0 0 1px var(--tape)}
.item .main{flex:1; min-width:0}
.item .t1{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .t2{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
button.item{width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit}
button.item:hover{border-color:var(--line-strong)}
.empty{padding:28px 16px; text-align:center; color:var(--muted); font-size:13px; border:1px dashed var(--line-strong); border-radius:var(--r); background:var(--surface)}
.empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px}

/* 確認の一覧 */
.issues{display:flex; flex-direction:column; gap:6px}
.issue{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:13px}
.issue .dot{margin-top:7px}
.issue.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.issue.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.issue .main{flex:1; min-width:0}
.issue .sub{font-size:12px; color:var(--muted)}

/* シート（重ねて出す画面） */
.gky-veil{position:fixed; inset:0; z-index:80; background:rgba(10,14,12,.45); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.gky-veil{align-items:center}}
.gky-sheet{width:min(640px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--line)}
.gky-sheet.wide{width:min(980px,100%)}
.gky-sheet>header{display:flex; align-items:center; gap:10px; padding:12px 12px 10px 16px; border-bottom:1px solid var(--line)}
.gky-sheet>header h2{flex:1; font-size:16px}
.gky-sheet>.body{padding:14px 16px; overflow:auto; min-height:0}
.gky-sheet>footer{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding:10px 16px 14px; border-top:1px solid var(--line)}
.gky-sheet>footer .left{margin-right:auto}

.gky-toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); z-index:100; max-width:min(560px,calc(100% - 32px));
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s}
.gky-toast.on{opacity:1; transform:translateX(-50%); pointer-events:auto}
.gky-toast button{border:0; background:transparent; color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0}
@media (prefers-reduced-motion:reduce){.gky-toast{transition:none}}

/* 印刷・PDFのプレビュー */
.gky-pv{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; background:var(--surface-3)}
.gky-pv>header{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding-block:10px; padding-inline:16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--line)}
.gky-pv>header h2{font-size:15px; flex:1; min-width:10em}
.gky-pv .stage{flex:1; overflow:auto; padding:18px 16px 60px}
.gky-pv .scaler{transform-origin:top left; display:flex; flex-direction:column; gap:18px}
.gky-pv .scaler>.gky-page{flex:none}   /* 縮めて見せるときに、紙の高さがつぶれないように */
.gky-pv .msg{font-size:12px; color:var(--muted)}

/* 紙（印刷物）はテーマに関係なく白い紙に黒い字 */
.gky-page{position:relative; width:794px; height:1123px; background:var(--paper); color:var(--paper-ink); box-shadow:0 2px 10px rgba(0,0,0,.18);
  font-family:var(--f-doc); font-size:10pt; line-height:1.5; display:flex; flex-direction:column; padding:42px 44px 30px; overflow:hidden}
.gky-page.landscape{width:1123px; height:794px}
.gky-page .pg-head{flex:none; display:flex; align-items:flex-end; gap:12px; border-bottom:1.5px solid var(--paper-line); padding-bottom:6px; margin-bottom:10px}
.gky-page .pg-title{font-size:15pt; font-weight:700; letter-spacing:.04em}
.gky-page .pg-sub{font-size:9.5pt; color:var(--paper-mute); flex:1; text-align:right}
.gky-page .pg-body{flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:8px}
.gky-page .pg-foot{display:flex; justify-content:space-between; gap:12px; font-size:8pt; line-height:1.5; min-height:1.5em; color:var(--paper-mute); margin-top:8px; flex:none}
.gky-page h3{font-size:11.5pt; margin:4px 0 0; padding-left:7px; border-left:3px solid var(--paper-line)}
.gky-page h4{font-size:10pt; margin:2px 0 0}
.gky-page p{margin:0}
.gky-page .muted{color:var(--paper-mute)}
.gky-page table{border-collapse:collapse; width:100%; font-size:9pt; table-layout:fixed}
.gky-page th,.gky-page td{border:0.75px solid var(--paper-line); padding:3px 5px; vertical-align:top; overflow-wrap:anywhere}
.gky-page th{background:var(--paper-head); font-weight:700; text-align:left}
.gky-page td.num,.gky-page th.num{text-align:right; font-variant-numeric:tabular-nums}
.gky-page td.c,.gky-page th.c{text-align:center}
.gky-page .mark{background:var(--paper-mark)}
.gky-page .box{border:0.75px solid var(--paper-line); padding:6px 8px}
#gky-print-root{display:none}
@media print{
  body.gky-printing>*:not(#gky-print-root){display:none!important}
  body.gky-printing{background:#fff!important}
  body.gky-printing #gky-print-root{display:block}
  #gky-print-root .gky-page{box-shadow:none; margin:0; break-after:page; page-break-after:always}
  #gky-print-root .gky-page:last-child{break-after:auto; page-break-after:auto}
}
/* ---- 上の帯：ご意見・楽屋へのリンク ---- */
.gky-fb{display:inline-flex; align-items:center; font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap}
.gky-fb:hover{color:var(--ink); border-color:var(--line-strong)}
/* タブが画面の端で切れるとき、続きがあることを影で見せる */
.gky-tabs.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.gky-tabs.more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent)}
.gky-tabs.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent)}

/* ---- 文字を大きく（この端末の全部のツール） ---- */
:root[data-size="lg"] .gky-app,:root[data-size="lg"] .gky-veil,:root[data-size="lg"] .gky-toast,:root[data-size="lg"] .gky-pv>header{zoom:1.18}

/* ---- 表を、スマホでは1行ずつの札にする（table に cards をつける。td の data-l が見出し） ---- */
@media (max-width:640px){
  table.tbl.cards thead{display:none}
  table.tbl.cards,table.tbl.cards tbody,table.tbl.cards tfoot{display:block; width:100%}
  table.tbl.cards tr{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 10px; padding:10px 12px; border-bottom:1px solid var(--line)}
  table.tbl.cards tbody tr:last-child{border-bottom:0}
  table.tbl.cards td{display:block; border:0; padding:0; min-width:0}
  table.tbl.cards td[data-l]::before{content:attr(data-l); display:block; font-size:11px; color:var(--muted); margin-bottom:1px}
  table.tbl.cards td.wide{grid-column:1/-1}
  table.tbl.cards td.end{grid-column:1/-1; display:flex; justify-content:flex-end; gap:6px}
}

/* ---- 読み込む前に確かめる表 ---- */
.gky-pvt td,.gky-pvt th{vertical-align:top}
.gky-pvt tr.skip td{opacity:.5}
.gky-pvt .unk{display:inline-flex; align-items:center; height:20px; padding:0 7px; margin:1px 3px 1px 0; border-radius:4px; background:var(--bad-soft); color:var(--bad); font-size:11.5px; font-weight:700}
.gky-pvt .guess{display:inline-flex; align-items:center; height:20px; padding:0 7px; margin:1px 3px 1px 0; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:11.5px; font-weight:700}
.gky-pvt input[type=text]{min-width:7em}
.gky-pvt select{max-width:9em}

/* ---- 共有（見るだけのリンク・QRコード） ---- */
.gky-share{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.gky-share .qr svg{width:180px; height:180px; display:block; background:#fff; border-radius:8px; padding:6px; border:1px solid var(--line)}
.gky-share .url{flex:1 1 240px; min-width:0}
.gky-share textarea{font-family:var(--f-mono); font-size:11.5px; min-height:90px; word-break:break-all}
.gky-viewer{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 14px; margin-bottom:14px; border-radius:var(--r); background:var(--tape-soft); border:1px solid var(--tape-line); font-size:13px}
.gky-viewer b{font-size:14px}
.gky-viewer .sp{flex:1}

/* ---- ほかのタブとぶつかったとき・容量の目盛り ---- */
.gky-meter{height:10px; border-radius:5px; background:var(--surface-3); overflow:hidden; margin:6px 0}
.gky-meter i{display:block; height:100%; background:var(--ok); border-radius:5px}
.gky-meter.warn i{background:var(--warn)} .gky-meter.bad i{background:var(--bad)}

/* ---- 印刷のプレビューの上の帯（用紙） ---- */
.gky-pv>header select{min-height:32px; padding:2px 8px}
.gky-pdfopt{display:flex; flex-direction:column; gap:8px}

/* 代表者・顧問用／部員用：data-staff は代表者・顧問用の端末だけ、data-member は部員用の端末だけに出す */
:root[data-role="member"] [data-staff]{display:none!important}
:root:not([data-role="member"]) [data-member]{display:none!important}
.gky-gate{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px; background:color-mix(in srgb,var(--bg) 94%,transparent)}
.gky-gate .in{max-width:460px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:var(--shadow)}
.gky-gate h2{font-size:17px; margin:10px 0 6px; line-height:1.45}
.gky-gate p{margin:0 0 10px; font-size:13.5px}
/* 楽屋の本番の欄と札 */
.gky-cf>span small{font-weight:400; margin-left:4px}
a.gky-cchip{text-decoration:none; color:var(--ink); background:var(--tape-soft); border-color:var(--tape-line)}
a.gky-cchip:hover{border-color:var(--tape)}
/* 足す前に確かめる表：チェックした行をまとめてそろえる */
.gky-bulk{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 8px; padding:8px 10px; border-radius:var(--r); background:var(--surface-2); font-size:12.5px}
.gky-bulk select{width:auto; min-height:32px; padding:3px 6px; font-size:12.5px}
/* ==== 楽屋シリーズ 共通部品（見た目） ここまで ==== */

/* ==== ステマネだけの見た目 ==== */
/* Layout: 舞台袖の作業机。左に入力（キューカード）、右にA4の紙。スマホでは「入力／仕上がり」を切り替える1列表示 */
:root {
  --bg: #E7EAEE;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --ink: #1B1F25;
  --muted: #5D6570;
  --line: #D2D7DD;
  --line-strong: #B4BCC6;
  --accent: #A3192B;          /* 緞帳の赤 */
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E4E6;
  --desk: #D5DAE0;
  --warn: #9A5B00;
  --warn-soft: #FFF2D2;
  --ok: #2B7A4B;
  --ok-soft: #E2F3E8;
  --danger: #B3261E;
  --focus: #2F6FD0;
  /* バミリテープの色 */
  --tape-red: #D73A44;
  --tape-blue: #2E6BCB;
  --tape-green: #2C9558;
  --tape-yellow: #F1C232;
  --tape-white: #E9E7E1;
  --tape-black: #2B2F36;
  --tape-orange: #E7843A;
  --tape-ink-dark: #1B1F25;
  --tape-ink-light: #FFFFFF;
  /* 紙（印刷物）はテーマに関係なく白い紙 */
  --paper: #FFFFFF;
  --paper-ink: #111111;
  --paper-line: #1E1E1E;
  --paper-rule: #8E8E8E;
  --paper-mute: #5E5E5E;
  --paper-cue: #EBEBEB;
  --paper-blank: #FFE58A;
  --paper-head: #F0F0F0;
  --paper-dot: #B8B8B8;
  --shadow: 0 1px 2px rgba(18, 22, 28, .07), 0 6px 18px rgba(18, 22, 28, .08);
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-doc: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-docmono: "BIZ UDGothic", "BIZ UDPGothic", "Osaka-Mono", "MS Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171B; --surface: #1C2026; --surface-2: #242930; --ink: #E6E9ED; --muted: #9BA4AF;
    --line: #30363E; --line-strong: #46505B; --accent: #E35A6D; --accent-ink: #1A0B0E; --accent-soft: #3B1E25;
    --desk: #0E1114; --warn: #F0B649; --warn-soft: #362A12; --ok: #6CCB93; --ok-soft: #173225; --danger: #F2867E; --focus: #78A6F0;
    --tape-red: #D9505A; --tape-blue: #4B82DA; --tape-green: #3BA86A; --tape-yellow: #E9BC35; --tape-white: #C9C7C0;
    --tape-black: #5B626D; --tape-orange: #E28B48;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171B; --surface: #1C2026; --surface-2: #242930; --ink: #E6E9ED; --muted: #9BA4AF;
  --line: #30363E; --line-strong: #46505B; --accent: #E35A6D; --accent-ink: #1A0B0E; --accent-soft: #3B1E25;
  --desk: #0E1114; --warn: #F0B649; --warn-soft: #362A12; --ok: #6CCB93; --ok-soft: #173225; --danger: #F2867E; --focus: #78A6F0;
  --tape-red: #D9505A; --tape-blue: #4B82DA; --tape-green: #3BA86A; --tape-yellow: #E9BC35; --tape-white: #C9C7C0;
  --tape-black: #5B626D; --tape-orange: #E28B48;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.6; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ───────── 骨組み ───────── */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; background: var(--bg); }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.wordmark { font-family: var(--f-display); font-weight: 900; font-size: 22px; letter-spacing: .08em; line-height: 1; }
.wordmark i { font-style: normal; color: var(--accent); }
.tagline { font-size: 12px; color: var(--muted); white-space: nowrap; }
.concert-bar, .file-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.concert-bar select { max-width: min(46vw, 320px); }
.file-bar { margin-left: auto; }

.panes { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.08fr); min-height: 0; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.edit-pane { border-right: 1px solid var(--line); background: var(--bg); }
.prev-pane { background: var(--desk); }
.edit-body { flex: 1; overflow: auto; padding: 16px 16px 40px; -webkit-overflow-scrolling: touch; }
.switcher { display: none; }

/* ───────── 部品 ───────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 0 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.ibtn {
  width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; background: transparent; color: var(--muted); padding: 0;
}
.ibtn:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.ibtn.del:hover { color: var(--danger); }
.ibtn svg { width: 16px; height: 16px; }
select, input[type="text"], input[type="date"], input[type="number"], textarea {
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 6px 9px; min-height: 34px; width: 100%;
}
select { width: auto; padding-right: 28px; }
textarea { resize: vertical; line-height: 1.65; field-sizing: content; min-height: 34px; }
input.tin { font-family: var(--f-mono); font-variant-numeric: tabular-nums; width: 5.4em; padding: 4px 6px; text-align: center; }
input.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
label.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
label.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.pill[data-s="ok"]::before, .pill[data-s="local"]::before { background: var(--ok); }
.pill[data-s="syncing"]::before { background: var(--tape-yellow); }
.pill[data-s="error"]::before, .pill[data-s="none"]::before { background: var(--danger); }
.pill[data-s="error"], .pill[data-s="none"] { color: var(--danger); }

.tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button {
  position: relative; border: 0; background: transparent; padding: 11px 12px 10px; cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 500; font-size: 14px;
}
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--accent); border-radius: 2px 2px 0 0; }
.tabs .count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; margin-left: 4px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 700; font-family: var(--f-mono); }
.tabs .count:empty { display: none; }
.tabs .count.zero { background: var(--ok-soft); color: var(--ok); }

/* ───────── バミリテープ（種類ラベル） ───────── */
.tape {
  --tc: var(--tape-white); --ti: var(--tape-ink-dark);
  display: inline-flex; align-items: center; height: 22px; padding: 0 11px; flex: none;
  background: var(--tc); color: var(--ti); font-size: 12px; font-weight: 700; letter-spacing: .08em; line-height: 1;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 22%, calc(100% - 2px) 45%, 100% 70%, calc(100% - 3px) 100%, 3px 100%, 0 78%, 2px 52%, 0 26%);
  transform: rotate(-1.2deg);
}
.tape.t-anno { --tc: var(--tape-blue); --ti: var(--tape-ink-light); }
.tape.t-mc { --tc: var(--tape-green); --ti: var(--tape-ink-light); }
.tape.t-piece { --tc: var(--tape-red); --ti: var(--tape-ink-light); }
.tape.t-cue { --tc: var(--tape-white); --ti: var(--tape-ink-dark); }
.tape.t-brk { --tc: var(--tape-yellow); --ti: var(--tape-ink-dark); }
.tape.t-part { --tc: var(--tape-black); --ti: var(--tape-ink-light); }
.tape.t-mark { --tc: var(--tape-orange); --ti: var(--tape-ink-dark); }

/* ───────── 入力パネル共通 ───────── */
.intro {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin-bottom: 14px; border-radius: 8px;
  background: var(--surface); border: 1px dashed var(--line-strong); font-size: 13px;
}
.intro p { margin: 0; flex: 1; min-width: 0; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; margin-bottom: 14px; }
.sec > h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.sec > h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.sec .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.fld.wide { grid-column: 1 / -1; }
.fld .hint { font-size: 11.5px; color: var(--muted); }
.row-inline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.times3 { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.times3 .fld { flex: none; }
.logo-box { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.logo-prev { height: 54px; min-width: 120px; display: grid; place-items: center; padding: 6px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; color: #6b6b6b; font-size: 12px; }
.logo-prev img { max-height: 42px; display: block; }

/* ───────── プログラム ───────── */
.sumbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sumchip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.sumchip b { font-family: var(--f-mono); font-size: 14px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sumchip.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: var(--warn-soft); }
.sumchip.warn b { color: var(--warn); }
.addbar {
  position: sticky; top: -16px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin: -16px -16px 12px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.addbar .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.addbar .tape { cursor: pointer; border: 0; transform: none; height: 28px; padding: 0 12px; }
.addbar .tape:hover { filter: brightness(1.08); transform: rotate(-1.5deg); }
.addbar select { min-height: 30px; font-size: 13px; padding-top: 2px; padding-bottom: 2px; }
.addbar .spacer { flex: 1; }
.addbar .where { font-size: 11.5px; color: var(--muted); width: 100%; }

.items { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--tape-yellow); } 100% { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; box-shadow: 0 0 0 3px var(--tape-yellow); } }
.card.is-part { background: var(--surface-2); }
.card.hidden-both { opacity: .6; }
.c-head { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; min-width: 0; }
.c-head .tape { cursor: pointer; }
.grip {
  flex: none; width: 22px; height: 30px; margin-left: -4px; display: inline-grid; place-items: center; padding: 0;
  border: 0; border-radius: 4px; background: transparent; color: var(--line-strong); cursor: grab; touch-action: none;
}
.grip:hover { color: var(--ink); background: var(--surface-2); }
.grip svg { width: 14px; height: 14px; }
.grip.sm { width: 18px; height: 24px; margin: 0 2px 0 0; vertical-align: middle; }
.dragging { box-shadow: var(--shadow); opacity: .96; cursor: grabbing; }
.dragging .grip { cursor: grabbing; }
.drag-ph { border: 2px dashed var(--accent); border-radius: 6px; background: var(--accent-soft); }
.part-list .drag-ph { border-radius: 0; }
.part-row.dragging { background: var(--surface); }
.c-head input.tin { min-height: 30px; flex: none; }
.c-sum { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 0; padding: 2px 0; }
.c-sum .s1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.c-sum .s2 { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-ui); }
.c-sum .s2 .mono { font-size: 11.5px; }
.late { color: var(--warn); font-weight: 700; }
.c-tools { display: flex; align-items: center; gap: 0; flex: none; }
.c-tools .chev svg { transition: transform .15s ease; }
.card.open .c-tools .chev svg { transform: rotate(180deg); }
.c-body { display: none; padding: 4px 14px 14px; border-top: 1px dashed var(--line); }
.card.open .c-body { display: block; }
.c-body .grid2 { margin-top: 10px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
.tokens { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.tok { border: 1px dashed var(--line-strong); background: var(--surface-2); border-radius: 4px; padding: 1px 7px; font-size: 12px; cursor: pointer; }
.tok:hover { border-color: var(--ink); color: var(--ink); }
.quick { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.quick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.quick button:hover { border-color: var(--ink); }
.steps-prev { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.steps-prev .st { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.steps-prev .ar { color: var(--muted); }

.parts { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.parts-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.parts-h .spacer { flex: 1; }
.part-row { display: grid; grid-template-columns: 3.6em minmax(0, 1fr) 6.6em minmax(0, 1fr) auto; gap: 6px; align-items: start; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.part-row:last-child { border-bottom: 0; }
.part-row .pn { font-family: var(--f-mono); color: var(--muted); padding-top: 5px; text-align: right; font-size: 12.5px; white-space: nowrap; }
.part-row textarea { min-height: 34px; }
.part-tools { display: flex; }
.parts-empty { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }
.bulk { padding: 10px; border-top: 1px dashed var(--line); display: none; gap: 8px; flex-direction: column; }
.bulk.on { display: flex; }
.durhint { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); min-height: 1em; }

details.rsbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
details.rsbox > summary { cursor: pointer; padding: 8px 10px; font-size: 13px; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
details.rsbox > summary::-webkit-details-marker { display: none; }
details.rsbox > summary::before { content: "▸"; color: var(--muted); font-weight: 400; }
details.rsbox[open] > summary::before { content: "▾"; }
.rsprev { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rs-in { padding: 0 10px 12px; }
.rs-scroll { overflow-x: auto; }
.rs-table { display: grid; grid-template-columns: repeat(6, minmax(84px, 1fr)) 32px; gap: 4px; min-width: 560px; }
.rs-table .h { font-size: 11px; color: var(--muted); font-weight: 700; padding: 0 2px; }
.rs-table input { min-height: 30px; padding: 4px 6px; font-size: 12.5px; }
.rs-table .rowlab { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: 4px; }
.rs-in .note { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }

.empty-items { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 8px; }
.list-tools { display: flex; justify-content: flex-end; gap: 6px; margin: 0 0 8px; }

/* ───────── タイスケ入力 ───────── */
.tt-cols { display: flex; flex-wrap: wrap; gap: 8px; }
.tt-col { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.tt-col input { width: 7.5em; min-height: 30px; padding: 3px 7px; }
.tt-col select { min-height: 30px; padding: 2px 24px 2px 6px; font-size: 12px; }
.tt-wrap { overflow-x: auto; margin-top: 4px; }
.tt-edit { display: grid; gap: 0; min-width: 100%; }
.tt-edit .h { position: sticky; top: 0; z-index: 1; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 6px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tt-edit .cell { padding: 6px; border-bottom: 1px solid var(--line); min-width: 0; }
.tt-edit .cell.tcell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.tt-edit textarea { min-height: 32px; padding: 4px 7px; font-size: 13px; }
.tt-edit textarea:disabled { background: var(--surface-2); color: var(--muted); }
.mg { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 3px; cursor: pointer; opacity: .75; }
.mg:hover, .mg:focus-within, .mg:has(input:checked) { opacity: 1; }
.mg input { width: 13px; height: 13px; accent-color: var(--accent); }
.durlab { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* ───────── 点検 ───────── */
.chk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.chk-list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.chk-list li.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.chk-list li .lv { flex: none; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-top: 2px; }
.chk-list li.warn .lv { background: var(--warn-soft); color: var(--warn); }
.chk-list li.info .lv { background: var(--surface-2); color: var(--muted); }
.chk-list li .msg { flex: 1; min-width: 0; }
.chk-list li .go { flex: none; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
ruby rt { font-size: .5em; font-weight: 400; letter-spacing: 0; }
.allgood { padding: 14px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.tsum-wrap { overflow-x: auto; }
table.tsum { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tsum th, table.tsum td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.tsum th:first-child, table.tsum td:first-child { text-align: left; }
table.tsum th { font-size: 11.5px; color: var(--muted); font-weight: 700; }
table.tsum td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.tsum td:first-child { font-family: var(--f-ui); font-weight: 700; }
table.tsum tr.total td { font-weight: 700; border-top: 2px solid var(--line-strong); }

/* ───────── 仕上がり（プレビュー） ───────── */
.prev-bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.prev-bar .tabs { border-bottom: 0; }
.prev-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--line); }
.prev-actions .spacer { flex: 1; }
.pages { flex: 1; overflow: auto; padding: 20px 16px 60px; -webkit-overflow-scrolling: touch; }
.sheets { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sheet { position: relative; flex: none; box-shadow: var(--shadow); background: var(--paper); }
.sheet .page { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.pages.zoomed .sheets { align-items: flex-start; }
.sheet-lab { font-size: 11px; color: var(--muted); font-family: var(--f-mono); margin-bottom: -12px; align-self: center; }

#outHost { position: fixed; left: -12000px; top: 0; width: 210mm; pointer-events: none; }
#outHost .sheet .page { position: static; transform: none; }

/* ───────── 紙（A4） ───────── */
.page {
  width: 210mm; height: 297mm; padding: 11mm 12mm 9mm; background: var(--paper); color: var(--paper-ink);
  font-family: var(--f-doc); font-size: 9.5pt; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 6mm; padding-bottom: 2.2mm; border-bottom: .5mm solid var(--paper-line); margin-bottom: 3mm; flex: none; }
.pg-brand { min-width: 0; display: flex; align-items: flex-end; gap: 4mm; }
.pg-brand img { height: 11mm; width: auto; display: block; }
.pg-org { font-size: 8pt; color: var(--paper-mute); line-height: 1.3; }
.pg-title { font-size: 13pt; font-weight: 700; line-height: 1.25; letter-spacing: .02em; }
.pg-meta { display: flex; flex-direction: column; align-items: flex-end; gap: .4mm; font-size: 8pt; color: var(--paper-mute); line-height: 1.3; text-align: right; flex: none; }
.pg-doc { font-size: 15pt; font-weight: 700; color: var(--paper-ink); letter-spacing: .18em; line-height: 1.15; }
.pg-ed { border: .3mm solid var(--paper-ink); color: var(--paper-ink); padding: 0 1.6mm; font-weight: 700; }
.pg-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.pg-foot { flex: none; display: flex; justify-content: space-between; gap: 6mm; padding-top: 2mm; font-size: 7.5pt; color: var(--paper-mute); }
.pg-no { font-family: var(--f-docmono); }
.blank { background: var(--paper-blank); border-radius: .6mm; }
.exporting .blank { background: none; }

/* 司会原稿 */
.doc-script .pg-body { font-size: var(--sfs, 10pt); line-height: 1.62; }
.sb { display: grid; grid-template-columns: 15mm minmax(0, 1fr); }
.sb > .g { padding: .6mm 2mm 0 0; display: flex; flex-direction: column; align-items: flex-end; gap: .4mm; text-align: right; font-size: .85em; line-height: 1.25; }
.sb > .m { padding: 0 0 0 3mm; border-left: .25mm solid var(--paper-rule); min-width: 0; }
.sb.item-start > .g, .sb.item-start > .m { border-top: .25mm solid var(--paper-rule); padding-top: 1.6mm; }
.sb.item-end > .m, .sb.item-end > .g { padding-bottom: 1.6mm; }
.sb .tm { font-family: var(--f-docmono); font-weight: 700; font-size: 1.12em; color: var(--paper-ink); letter-spacing: -.02em; }
.sb .bell { font-weight: 700; border: .25mm solid var(--paper-ink); padding: 0 1mm; border-radius: .6mm; white-space: nowrap; }
.sb .contlab { color: var(--paper-mute); font-size: .9em; }
.sb .lab { font-weight: 700; }
.sb .para { white-space: pre-wrap; overflow-wrap: anywhere; }
.sb.spacer > .m { height: .55em; }
.sb.part-start > .g, .sb.part-start > .m { border-top: .6mm solid var(--paper-line); padding-top: 2mm; }
.part-h { font-weight: 700; font-size: 1.25em; letter-spacing: .2em; }
.pc-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1mm 3mm; }
.pc-t { font-weight: 700; font-size: 1.16em; }
.pc-d { font-weight: 700; font-variant-numeric: tabular-nums; }
.pc-enc { font-weight: 700; background: var(--paper-ink); color: var(--paper); padding: 0 1.3mm; font-size: .9em; }
.pc-c { font-size: .88em; color: var(--paper-mute); }
.pc-sub { font-size: .88em; color: var(--paper-mute); }
.pc-note { white-space: pre-wrap; }
.pc-cont { color: var(--paper-mute); font-size: .9em; }
.pt { display: grid; grid-template-columns: 2.4em auto minmax(0, 1fr); column-gap: 1.5mm; align-items: baseline; }
.pt .pn { font-family: var(--f-docmono); text-align: right; }
.pt .ptt { font-weight: 700; }
.pt .pd { color: var(--paper-mute); font-size: .9em; font-variant-numeric: tabular-nums; padding-left: 1mm; }
.pt .pnote { grid-column: 2 / 4; white-space: pre-wrap; font-size: .92em; }
.pg-body > .sb:first-child > .g, .pg-body > .sb:first-child > .m { border-top: 0; }
.cue { background: var(--paper-cue); padding: .5mm 2mm; border-radius: .6mm; font-size: .92em; line-height: 1.55; overflow-wrap: anywhere; }
.cue .ar { font-weight: 700; padding: 0 .6mm; }
.brk { font-weight: 700; letter-spacing: .1em; }
.mark { font-weight: 700; letter-spacing: .15em; color: var(--paper-mute); }

/* 進行表 */
.doc-run .pg-body { display: flex; flex-direction: column; font-size: 8.2pt; line-height: 1.34; }
.rr { display: grid; grid-template-columns: var(--rcols); flex: 0 0 auto; }
.rr > .c { padding: .7mm 1.2mm; border-left: .25mm solid var(--paper-line); min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; text-align: center; }
.rr > .c:first-child { border-left: 0; text-align: right; padding-right: 2mm; font-family: var(--f-docmono); font-weight: 700; }
.rr > .c.mc { text-align: left; }
.rr.hd > .c { border-bottom: .45mm solid var(--paper-line); font-weight: 700; padding-top: 1.2mm; padding-bottom: 1.2mm; }
.rr.hd > .c:first-child { font-family: var(--f-doc); text-align: left; white-space: nowrap; font-size: .9em; padding-left: .8mm; padding-right: .8mm; letter-spacing: -.02em; }
.rr.ln > .c:not(:first-child) { border-top: .45mm solid var(--paper-line); }
.rr.last > .c:not(:first-child) { border-bottom: .45mm solid var(--paper-line); }
.rr > .c.ti { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 2mm; align-content: start; align-items: start; text-align: left; }
.rr > .c.ti.ctr .tm1 { text-align: center; }
.rr > .c.ti .tm1 { min-width: 0; }
.rr > .c.ti .td { align-self: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rr .ttl { font-weight: 700; }
.rr .plist { margin-top: .6mm; font-size: .95em; }
.rr .plist div { display: flex; gap: 1.2mm; }
.rr .plist .pd { color: var(--paper-mute); font-variant-numeric: tabular-nums; }
.rr .tmk { font-variant-numeric: tabular-nums; min-width: 1.4em; }

/* タイスケ */
.doc-tt .pg-body { font-size: var(--tfs, 9.5pt); line-height: 1.35; }
.ttg { display: grid; height: 100%; border: .35mm solid var(--paper-line); border-top: 0; }
.ttg > div { border-top: .25mm solid var(--paper-line); border-left: .25mm solid var(--paper-line); padding: .8mm 1.2mm; min-width: 0; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
.ttg > .tcol { border-left: 0; text-align: right; padding-right: 1.6mm; }
.ttg > .hd { border-top: .35mm solid var(--paper-line); border-bottom: .35mm solid var(--paper-line); font-weight: 700; padding: 1mm 1.2mm; background: var(--paper-head); }
.ttg > .hd.tcol { text-align: left; padding-left: .8mm; padding-right: .5mm; white-space: nowrap; font-size: .9em; letter-spacing: -.02em; }
.ttg .tlab { font-family: var(--f-docmono); font-weight: 700; display: block; line-height: 1.2; }
.ttg .tdur { display: block; font-size: .78em; color: var(--paper-mute); line-height: 1.2; }
.ttg .tick { position: absolute; right: 1.6mm; font-family: var(--f-docmono); font-size: .78em; color: var(--paper-mute); transform: translateY(-50%); line-height: 1; }
.ttg .tick::after { content: ""; position: absolute; right: -1.6mm; top: 50%; width: 1.1mm; border-top: .25mm solid var(--paper-rule); }
.ttg .tickln { position: absolute; left: 0; right: 0; border-top: .2mm dotted var(--paper-dot); }
.ttg .spread { display: flex; flex-direction: column; justify-content: space-between; height: 100%; gap: 1mm; }
.sb.cont > .g::before { content: "つづき"; color: var(--paper-mute); font-size: .9em; }

/* ───────── 本番モード（舞台袖で光が漏れにくい暗い画面に固定） ───────── */
.btn.live-btn { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.btn.live-btn::before { content: ""; width: 0; height: 0; border-left: 7px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
body.live-on { overflow: hidden; }
.live {
  --lv-bg: #0A0C0F; --lv-panel: #11151A; --lv-raise: #1A1F26; --lv-line: #262C34; --lv-ink: #EDF0F3; --lv-mute: #8D97A3;
  --lv-accent: #E35A6D; --lv-late: #F5B544; --lv-late-bg: #3A2B0D; --lv-early: #6FD49B; --lv-early-bg: #10301F;
  --lvfs: 24px;
  position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column;
  background: var(--lv-bg); color: var(--lv-ink); color-scheme: dark; font-family: var(--f-ui);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
.live[hidden] { display: none !important; }
.lv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--lv-line); }
.lv-clock { font: 600 26px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; min-width: 5.2em; }
.lv-delta { font: 600 15px/1 var(--f-mono); padding: 8px 12px; border-radius: 999px; background: var(--lv-raise); color: var(--lv-mute); white-space: nowrap; }
.lv-delta.late { background: var(--lv-late-bg); color: var(--lv-late); }
.lv-delta.early { background: var(--lv-early-bg); color: var(--lv-early); }
.lv-delta.ok { color: var(--lv-ink); }
.lv-cmp { border: 1px dashed var(--lv-line); background: transparent; color: var(--lv-mute); border-radius: 999px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
.lv-cmp:hover { color: var(--lv-ink); border-color: var(--lv-mute); }
.lv-part { color: var(--lv-mute); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
.lv-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.lv-tools button, .lv-tools select, .lv-nav select {
  min-height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--lv-line); background: var(--lv-raise); color: var(--lv-ink); font-size: 14px; cursor: pointer;
}
.lv-tools button:hover { border-color: var(--lv-mute); }
.lv-tools .lv-exit { background: transparent; }
.lv-progress { height: 4px; background: var(--lv-raise); flex: none; }
.lv-progress span { display: block; height: 100%; width: 0; background: var(--lv-accent); transition: width .25s ease; }
.lv-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); }
.lv-now { overflow: auto; padding: 20px 24px 28px; min-width: 0; }
.lv-next { overflow: auto; padding: 18px 18px 24px; border-left: 1px solid var(--lv-line); background: var(--lv-panel); min-width: 0; }
.lv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; font-size: 14px; color: var(--lv-mute); }
.lv-meta b { color: var(--lv-ink); font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.lv-crew { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.lv-crew span { border: 1px solid var(--lv-line); background: var(--lv-raise); border-radius: 6px; padding: 4px 10px; font-size: 15px; }
.lv-crew span i { font-style: normal; color: var(--lv-mute); font-size: 12px; margin-right: 6px; }
.lv-lab { font-size: calc(var(--lvfs) * .8); font-weight: 700; color: var(--lv-mute); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
.lv-bell { border: 2px solid var(--lv-ink); color: var(--lv-ink); border-radius: 6px; padding: 0 8px; font-size: calc(var(--lvfs) * .7); }
.lv-text, .lv-title, .lv-parts, .lv-steps, .lv-nx .b, .lv-nx .st { font-family: var(--f-doc); }
.lv-text { font-size: var(--lvfs); line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
.lv-text .blank, .lv-parts .blank { background: #5B4A10; color: #FFE58A; border-radius: 3px; }
.lv-text ruby rt, .lv-title ruby rt, .lv-parts ruby rt { color: var(--lv-mute); }
.lv-title { font-size: calc(var(--lvfs) * 1.45); font-weight: 700; line-height: 1.3; }
.lv-sub { font-size: calc(var(--lvfs) * .75); color: var(--lv-mute); margin-top: 6px; }
.lv-count { display: flex; align-items: baseline; gap: 12px; margin: 16px 0 8px; font-size: 14px; color: var(--lv-mute); }
.lv-count b { font: 600 calc(var(--lvfs) * 1.7)/1 var(--f-mono); color: var(--lv-ink); font-variant-numeric: tabular-nums; }
.lv-count b.over { color: var(--lv-late); }
.lv-meter { height: 8px; border-radius: 4px; background: var(--lv-raise); overflow: hidden; margin-bottom: 16px; }
.lv-meter span { display: block; height: 100%; width: 0; background: var(--tape-blue); }
.lv-meter span.over { background: var(--lv-late); }
.lv-parts { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: calc(var(--lvfs) * .8); }
.lv-parts li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 2px 8px; }
.lv-parts .n { color: var(--lv-mute); font-family: var(--f-mono); text-align: right; }
.lv-parts .t { font-weight: 700; }
.lv-parts .d { color: var(--lv-mute); font-family: var(--f-mono); font-size: .85em; }
.lv-parts .nt { grid-column: 2 / 4; color: var(--lv-mute); white-space: pre-wrap; font-size: .9em; }
.lv-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; font-size: var(--lvfs); }
.lv-steps span.s { background: var(--lv-raise); border: 1px solid var(--lv-line); border-radius: 8px; padding: 6px 12px; }
.lv-steps span.a { color: var(--lv-mute); }
.lv-idle { max-width: 40em; font-size: 16px; line-height: 1.8; color: var(--lv-mute); }
.lv-idle h2 { font-size: 26px; color: var(--lv-ink); margin: 0 0 10px; font-family: var(--f-display); letter-spacing: .06em; }
.lv-idle .keys { font-size: 13px; margin-top: 14px; }
.lv-idle kbd { font-family: var(--f-mono); border: 1px solid var(--lv-line); border-radius: 4px; padding: 1px 6px; background: var(--lv-raise); color: var(--lv-ink); }
.lv-next h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; color: var(--lv-mute); }
.lv-nx { padding: 12px 0 14px; border-bottom: 1px solid var(--lv-line); }
.lv-nx:last-child { border-bottom: 0; }
.lv-nx .h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--lv-mute); margin-bottom: 6px; }
.lv-nx .h b { font-family: var(--f-mono); color: var(--lv-ink); font-weight: 600; }
.lv-nx .b { font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
.lv-nx .st { margin-top: 6px; font-size: 15px; color: var(--lv-ink); line-height: 1.6; }
.lv-nx .st .a { color: var(--lv-mute); padding: 0 4px; }
.lv-nx .crew { margin-top: 6px; font-size: 13px; color: var(--lv-mute); }
.lv-nav { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 2fr); gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--lv-line); flex: none; }
.lv-nav button { min-height: 64px; border-radius: 12px; border: 1px solid var(--lv-line); background: var(--lv-raise); color: var(--lv-ink); font-size: 20px; font-weight: 700; cursor: pointer; }
.lv-nav #lvGo { background: var(--lv-accent); border-color: var(--lv-accent); color: #170609; }
.lv-nav button:disabled { opacity: .35; cursor: default; }
.lv-nav select { min-height: 64px; font-size: 15px; width: 100%; }
.lv-done table { border-collapse: collapse; font-size: 14px; margin-top: 12px; }
.lv-done td { padding: 6px 12px 6px 0; }
.lv-done td:last-child { font-family: var(--f-mono); color: var(--lv-ink); }
.live :focus-visible { outline: 2px solid #9CC0FF; outline-offset: 2px; }
@media (max-width: 760px) {
  .lv-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .lv-next { border-left: 0; border-top: 1px solid var(--lv-line); max-height: 32vh; padding: 12px 16px; }
  .lv-now { padding: 16px 16px 20px; }
  .lv-top { padding: 8px 12px; }
  .lv-clock { font-size: 22px; }
  .lv-tools { margin-left: 0; width: 100%; flex-wrap: nowrap; gap: 5px; }
  .lv-tools button, .lv-tools select { min-height: 34px; padding: 0 8px; font-size: 13px; flex: none; }
  .lv-tools select { flex: 1 1 auto; min-width: 0; }
  .lv-part { display: none; }
  .lv-delta { padding: 7px 10px; font-size: 14px; }
  .lv-cmp { padding: 5px 8px; font-size: 11px; }
  .lv-nav { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); padding-left: 12px; padding-right: 12px; }
  .lv-nav select { display: none; }
  .lv-nav button { min-height: 58px; font-size: 18px; }
}

/* 記録の表（点検タブ） */
table.rec { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.rec th, table.rec td { padding: 6px 7px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.rec th:first-child, table.rec td:first-child { text-align: left; white-space: normal; min-width: 10em; }
table.rec th { font-size: 11.5px; color: var(--muted); font-weight: 700; }
table.rec td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.rec td:first-child { font-family: var(--f-ui); }
table.rec .late { color: var(--warn); }
table.rec .early { color: var(--ok); }

/* ───────── 通知・処理中 ───────── */
#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px);
  padding: 10px 12px 10px 16px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 50;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#toast button { border: 1px solid color-mix(in srgb, var(--bg) 50%, transparent); background: transparent; color: var(--bg); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-weight: 700; }
#busy { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(2px); }
#busy .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; font-weight: 500; }
#busy .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #busy .spin { animation-duration: 2.4s; } }

/* ───────── 狭い画面 ───────── */
@media (max-width: 900px) {
  .app { grid-template-rows: auto 1fr auto; }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .app[data-view="edit"] .prev-pane, .app[data-view="preview"] .edit-pane { display: none; }
  .edit-pane { border-right: 0; }
  .switcher {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .switcher button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 700; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tagline { display: none; }
  .file-bar { margin-left: 0; }
  #toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
.m-only { display: none; }
@media (max-width: 560px) {
  .top { padding: 8px 12px; gap: 6px 8px; }
  .top .m-only { display: inline-flex; margin-left: auto; }
  .file-bar #syncPill { display: none; }
  .lg { display: none; }
  .concert-bar, .file-bar { display: contents; }
  .top .btn.sm { padding: 0 8px; }
  .addbar { position: static; }
  .edit-body { padding: 12px 12px 40px; }
  .addbar { margin: -12px -12px 12px; padding: 8px 12px; top: -12px; }
  .concert-bar select { max-width: 100%; flex: 1 1 100%; }
  .part-row { grid-template-columns: 3.2em minmax(0, 1fr) 5.8em auto; }
  .part-row > .pnote-wrap { grid-column: 2 / 4; }
  .part-row > .part-tools { grid-column: 4; grid-row: 1; }
  .c-head { flex-wrap: wrap; }
  .c-head .c-sum { order: 3; flex-basis: 100%; }
  .pages { padding: 14px 12px 40px; }
}

/* ───────── 印刷（単体で開いたとき） ───────── */
@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { height: auto; background: #fff; }
  body > *:not(#outHost) { display: none !important; }
  #outHost { position: static; left: auto; width: auto; }
  #outHost .sheet { box-shadow: none; width: auto !important; height: auto !important; position: static; }
  #outHost .page { position: static; transform: none !important; break-after: page; page-break-after: always; }
  #outHost .sheet:last-child .page { break-after: auto; page-break-after: auto; }
  .blank { background: none; }
}

/* ==== 楽屋シリーズとそろえる所 ==== */
:root{ --tape:#A3192B; --tape-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --tape:#E35A6D; --tape-ink:#1A0B0E; } }
:root[data-theme="dark"]{ --tape:#E35A6D; --tape-ink:#1A0B0E; }
a.brand { text-decoration: none; color: inherit; cursor: pointer; border-radius: 6px; }
a.brand:hover .wordmark { color: var(--accent); }
.home-btn i { width: 12px; height: 6px; background: var(--tape-black); display: inline-block; transform: rotate(-4deg); }
.grid2 .gky-cf { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app" class="app" data-view="edit" data-keep-words>
  <header class="top">
    <a class="brand" href="#" id="brand" title="ステマネについて（更新内容・ご意見）">
      <span class="wordmark">ステ<i>マネ</i></span>
      <span class="tagline">演奏会の司会原稿・進行表・タイスケを一度に</span>
    </a>
    <span id="syncPillM" class="pill m-only" data-s="local" aria-hidden="true"></span>
    <div class="concert-bar">
      <label class="sr" for="concertSel">演奏会を選ぶ</label>
      <select id="concertSel"></select>
      <button class="btn sm" id="btnNew" type="button">新規</button>
      <button class="btn sm" id="btnDup" type="button">複製</button>
      <button class="btn sm danger" id="btnDel" type="button">削除</button>
    </div>
    <div class="file-bar">
      <button class="btn sm live-btn" id="btnLive" type="button" title="本番やリハーサルで、今の項目と次のきっかけを大きく表示します">本番モード</button>
      <button class="btn sm" id="btnUndo" type="button" title="直前の操作を元に戻す（Ctrl+Z）">元に戻す</button>
      <button class="btn sm" id="btnExport" type="button" title="この演奏会のデータをファイルに書き出す"><span><span class="lg">データを</span>書き出す</span></button>
      <label class="btn sm" for="fileImport" title="書き出したデータのファイルを読み込む"><span><span class="lg">データを</span>読み込む</span></label>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
      <span id="syncPill" class="pill" data-s="local">この端末に保存</span>
      <a class="btn sm home-btn" id="homeLink" href="../gakuya/" rel="noopener" title="楽屋（楽屋シリーズの入口）へ"><i></i>楽屋</a>
    </div>
  </header>

  <div class="panes">
    <section class="pane edit-pane" aria-label="入力">
      <nav class="tabs" role="tablist" aria-label="入力する内容">
        <button type="button" role="tab" id="et-info" data-etab="info">基本情報</button>
        <button type="button" role="tab" id="et-program" data-etab="program">プログラム</button>
        <button type="button" role="tab" id="et-tt" data-etab="tt">タイスケ</button>
        <button type="button" role="tab" id="et-check" data-etab="check">点検<span class="count" id="checkCount"></span></button>
      </nav>
      <div id="editBody" class="edit-body"></div>
    </section>

    <section class="pane prev-pane" aria-label="仕上がり">
      <div class="prev-bar">
        <nav class="tabs" role="tablist" aria-label="書類">
          <button type="button" role="tab" id="pt-script" data-ptab="script">司会原稿</button>
          <button type="button" role="tab" id="pt-run" data-ptab="run">進行表</button>
          <button type="button" role="tab" id="pt-tt" data-ptab="tt">タイスケ</button>
        </nav>
        <div class="prev-actions">
          <span id="pageInfo" class="muted mono"></span>
          <button class="btn sm ghost" id="btnZoom" type="button">原寸</button>
          <span class="spacer"></span>
          <button class="btn sm" id="btnPrint" type="button" hidden>印刷</button>
          <button class="btn sm" id="btnPdfOne" type="button">この書類をPDFに</button>
          <button class="btn sm primary" id="btnPdfAll" type="button">3点まとめてPDF</button>
        </div>
      </div>
      <div id="pages" class="pages"></div>
    </section>
  </div>

  <nav class="switcher" aria-label="表示の切り替え">
    <button type="button" data-view="edit" aria-pressed="true">入力</button>
    <button type="button" data-view="preview" aria-pressed="false">仕上がり</button>
  </nav>
</div>

<div id="live" class="live" hidden role="dialog" aria-modal="true" aria-label="本番モード" data-keep-words>
  <header class="lv-top">
    <span class="lv-clock" id="lvClock">--:--:--</span>
    <span class="lv-delta" id="lvDelta">記録前</span>
    <button type="button" class="lv-cmp" id="lvCmp" title="押し・巻きを、本番の時刻で比べるか、始めてからの経過時間で比べるか（リハーサル向け）">比べ方：時刻</button>
    <span class="lv-part" id="lvPart"></span>
    <div class="lv-tools">
      <label class="sr" for="lvMode">表示する項目</label>
      <select id="lvMode" title="表示する項目"><option value="all">すべて表示</option><option value="mc">司会者用</option></select>
      <button type="button" id="lvSmaller" aria-label="文字を小さく" title="文字を小さく">A−</button>
      <button type="button" id="lvBigger" aria-label="文字を大きく" title="文字を大きく">A＋</button>
      <button type="button" id="lvFull" hidden>全画面</button>
      <button type="button" id="lvRestart" title="記録を新しく始め直します">最初から</button>
      <button type="button" id="lvExit" class="lv-exit">閉じる</button>
    </div>
  </header>
  <div class="lv-progress" aria-hidden="true"><span id="lvBar"></span></div>
  <div class="lv-main">
    <section class="lv-now" id="lvNow" aria-live="polite"></section>
    <aside class="lv-next" id="lvNext" aria-label="次の項目"></aside>
  </div>
  <footer class="lv-nav">
    <button type="button" id="lvPrev">◀ 戻る</button>
    <label class="sr" for="lvJump">項目へ移動</label>
    <select id="lvJump"></select>
    <button type="button" id="lvGo">始める ▶</button>
  </footer>
</div>

<div id="outHost" aria-hidden="true" data-keep-words></div>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
<div id="busy" hidden><div class="box"><span class="spin" aria-hidden="true"></span><span id="busyMsg">処理しています…</span></div></div>

        const colg = '<colgroup>' + cols.map(c => `<col${c.w ? ` style="width:${c.w}"` : ''}>`).join('') + '</colgroup>';
        const head = '<thead><tr>' + cols.map(c => `<th class="${c.cls || ''}">${c.h}</th>`).join('') + '</tr></thead>';

        let tb = mk();
        // 見出しの行と最初の1行が入らなければ、表ごと次のページへ
        const probe = document.createElement('tr'); probe.innerHTML = '<td>&nbsp;</td>'; tb.appendChild(probe);
        if (over() && body.childElementCount > 1) carry(tb.closest('div'));
        probe.remove();
        rows.forEach(r => {
          const tr = document.createElement('tr');
          if (r && r.cls) tr.className = r.cls;
          const cells = Array.isArray(r) ? r : r.cells;
          tr.innerHTML = cells.map((c, i) => `<td class="${(cols[i] && cols[i].cls) || ''}"${c && c.span ? ` colspan="${c.span}"` : ''}>${c && typeof c === 'object' ? c.html : (c ?? '')}</td>`).join('');
          tb.appendChild(tr);
          if (over() && tb.children.length > 1) { tr.remove(); newPage(); tb = mk(); tb.appendChild(tr); }
        });
      });
      if (pages.length > 1 && !body.childElementCount) { pages.pop().remove(); }
      // ページ番号は最後に書く（下の欄は高さが決まっているので、書いても本文の高さは変わらない）
      pages.forEach((p, i) => { $('.pg-no', p).textContent = pages.length > 1 ? (i + 1) + ' / ' + pages.length : ' '; });
    }
    const api = {
      page() { ops.push({ t: 'page' }); return api; },
      block(html, { keep = false } = {}) { ops.push({ t: 'block', html: typeof html === 'string' ? html : html.outerHTML, keep }); return api; },
      table(spec) { ops.push({ t: 'table', spec }); return api; },
      async show() {
        pv = h(`<div class="gky-pv" role="dialog" aria-modal="true" aria-label="${esc(title)}の印刷"><header><h2>${esc(title)}<span class="msg" style="margin-left:10px"></span></h2>
          <div class="btnrow"><label class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:4px">用紙 <select data-act="size" aria-label="用紙">${Object.keys(PAPERS).map(k => `<option value="${k}"${k === paper ? ' selected' : ''}>${k}</option>`).join('')}</select></label>${IN_VIEWER ? '' : '<button class="btn primary" data-act="print">印刷する</button>'}<button class="btn${IN_VIEWER ? ' primary' : ''}" data-act="pdf">PDFで保存</button><button class="btn" data-act="close">閉じる</button></div></header>
          <div class="stage"><div class="scaler"></div></div></div>`);
        scaler = $('.scaler', pv);
        // ページの高さを測りながら分けるので、はじめから画面に入れておく（並べ終わるまで見えないように）
        pv.style.visibility = 'hidden';
        document.body.appendChild(pv);
        try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* なくても続ける */ }
        const stage = $('.stage', pv);
        const fit = () => { const W = mmpx(dims().w); scaler.style.transform = ''; const s = Math.min(1, (stage.clientWidth - 32) / W); scaler.style.transform = `scale(${s})`; scaler.style.width = W + 'px'; scaler.style.height = s < 1 ? (scaler.scrollHeight * s) + 'px' : ''; };
        const draw = () => { scaler.style.transform = ''; scaler.style.height = ''; render(); $('.msg', pv).textContent = `${paper}・${pages.length}ページ`; fit(); };
        draw();
        pv.style.visibility = '';
        window.addEventListener('resize', fit);
        const close = () => { window.removeEventListener('resize', fit); document.removeEventListener('keydown', onKey); pv.remove(); };

      print() {

      pdfMenu() {
        if (IN_VIEWER) return api.pdf();
        sheet({ title: 'PDFで保存', content: `<div class="gky-pdfopt"><p style="margin:0">おすすめは、<b>印刷の画面で、送り先（プリンター）を「PDFに保存」</b>にする方法です。文字を選んだりさがしたりでき、ファイルも小さくなります。</p>
          <p class="muted" style="margin:0;font-size:12.5px">iPhone・iPad：印刷の画面で、右上の共有ボタン →「ファイルに保存」。<br>うまくいかないときは「画像のPDFを作る」を使ってください（見た目は同じですが、文字は選べません）。</p></div>`,
          actions: [{ label: '画像のPDFを作る', onClick: () => { api.pdf(); } }, { label: '印刷の画面を開く', primary: true, onClick: () => { api.print(); } }] });

      async pdf() {
        const btn = pv && $('[data-act="pdf"]', pv);

        } catch (e) {
          toast(IN_VIEWER ? 'PDFを作れませんでした。少し待ってからもう一度押してください' : 'PDFを作れませんでした。ネットにつながっているか確かめてください（「印刷する」からPDFに保存することもできます）');

  }

  /* 印刷用の文字（BIZ UDPゴシック）を先に読んでおく。ページの分け方が読み込みの前後で変わらないように */
  try { if (document.fonts && document.fonts.load) ['400', '700'].forEach(w => document.fonts.load(w + ' 10pt "BIZ UDPGothic"').catch(() => {})); } catch (e) { /* なくても動く */ }

  /* ---------- 見るだけのリンクとQRコード ---------- */
  /* 中身（JSON）を、アドレスに入れられる短い文字にする（圧縮できる端末では圧縮。Z…＝圧縮、J…＝そのまま） */
  const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  async function packShare(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) { try { const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); return 'Z' + b64u(z); } catch (e) { /* 圧縮できなければそのまま */ } }
    return 'J' + b64u(bytes);
  }
  async function unpackShare(code) {
    code = String(code || '').trim();
    let bytes = unb64u(code.slice(1));
    if (code[0] === 'Z') { if (!window.DecompressionStream) throw new Error('この端末ではこのリンクを開けません'); bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }

  }
  /* 見るだけのリンク（このツールのページのアドレス ＋ #v=中身） */
  const shareUrl = async (slug, obj) => pageUrl(slug) + '#v=' + await packShare(obj);
  /* 開いたアドレスが見るだけのリンクなら、中身を返す（ちがえば null） */
  async function readShare() { const m = location.hash.match(/^#v=([A-Za-z0-9_-]+)$/); if (!m) return null; return unpackShare(m[1]); }
  function qrSVG(text, size = 180) {
    const q = qrcode(0, text.length > 900 ? 'L' : 'M'); q.addData(unescape(encodeURIComponent(text))); q.make();
    const n = q.getModuleCount(), m = 4;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + m * 2} ${n + m * 2}" shape-rendering="crispEdges" width="${size}" height="${size}" role="img" aria-label="QRコード"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  /* リンクを配る画面：リンク（コピー・送る）と、入りきればQRコード */
  /* keep：開いた端末に入るリンク（部員用の設定・合奏ノートの提出など）のとき true */
  function shareSheet({ title = '見るだけのリンク', url, note = '', keep = false }) {
    let qr = '';

      actions: [...(navigator.share ? [{ label: '送る', keep: true, onClick: () => { navigator.share({ title, url }).catch(() => {}); return false; } }] : []), { label: '閉じる' }, { label: 'リンクをコピー', primary: true, keep: true, onClick: () => { copyText(url, 'リンクをコピーしました'); return false; } }] });
  }
  /* 見るだけのページ：上のタブとふだんの画面をかくし、受け取った中身だけを出す。中身を入れる要素を返す */
  function viewer({ title, sub = '', note = '' }) {

    main.prepend(box);
    return $('#gkyViewBody', box);
  }

  /* ---------- このツールについて ---------- */
  function about({ name, what, version, changelog = [], feedback = '' }) {
    const fb = feedback || FEEDBACK_URL;
    const log = changelog.map(c => `<li><b class="mono">v${esc(c.v)}</b> <span class="muted mono">${esc(c.d)}</span><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></li>`).join('');
    const sh = sheet({ title: name + 'について', content: `<p style="margin:0 0 10px">${what}</p>
      <ul style="margin:0 0 12px;padding-left:1.2em;font-size:13px">

        <li>ブラウザの履歴やサイトのデータを消すと、保存した内容も消えます。ときどき楽屋の「バックアップ」でファイルに保存してください。</li>
        <li>同じ場所（例：bamiriunei-arch.github.io）に置いたツールどうしは、楽屋に入れた部員・曲・楽器のデータを共有します。</li>

      <details data-keep-words><summary style="cursor:pointer;font-size:13px">更新の記録</summary><ul style="font-size:12.5px;padding-left:1.2em">${log}</ul></details>` });
