<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="演奏会・コンクールの日付から、会場予約・チラシ・プログラム・運搬などの準備の締め切りを逆算して並べる">
<meta name="theme-color" content="#ECEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本番逆算">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191C'/%3E%3Crect x='6' y='13' width='20' height='7' rx='1' fill='%2344539E' transform='rotate(-10 16 16)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>本番逆算スケジュール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* ==== 楽屋シリーズ 共通部品（見た目） ここから ==== */
/* 全ツールで同じ内容です。変えるときは全ツールそろえて変えてください。
   レイアウト：舞台床のような落ち着いた灰緑の作業面に、ツールごとの色のバミリテープを1色だけ使う */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface-2:#F4F6F4; --surface-3:#E6EAE7;
  --ink:#1B211F; --muted:#5C6662; --line:#D4D9D6; --line-strong:#B5BDB8;
  --ok:#2B7A4B; --ok-soft:#E2F3E8; --warn:#9A5B00; --warn-soft:#FFF1D0; --bad:#B3261E; --bad-soft:#FBE3E0;
  --focus:#2F6FD0; --shadow:0 1px 2px rgba(18,24,22,.07),0 8px 22px rgba(18,24,22,.09);
  --tape:#D73A44; --tape-ink:#FFFFFF;
  --tape-soft:color-mix(in srgb,var(--tape) 13%,var(--surface));
  --tape-line:color-mix(in srgb,var(--tape) 45%,var(--line));
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-rule:#9A9A9A; --paper-mute:#5E5E5E; --paper-head:#EFEFEF; --paper-mark:#FFE58A;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-doc:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
    --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
    --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
    --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
  --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
  --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
  --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
a{color:inherit}
h1,h2,h3,h4{text-wrap:balance; margin:0}
.mono,.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---- 骨組み ---- */
.gky-app{min-height:100%; display:flex; flex-direction:column}
.gky-top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  padding-block:10px; padding-inline:16px; background:var(--surface); border-bottom:1px solid var(--line)}
.gky-brand{display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none}
.gky-tape{flex:none; display:inline-block; width:26px; height:10px; background:var(--tape); transform:rotate(-8deg); border-radius:1px;
  clip-path:polygon(2px 0,100% 0,calc(100% - 2px) 50%,100% 100%,0 100%,2px 50%,0 0)}
.gky-brand b{font-size:19px; font-weight:700; letter-spacing:.06em; white-space:nowrap}
.gky-brand small{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gky-top-actions{margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
@media (max-width:600px){ .gky-top-actions{width:100%; margin-left:0} .gky-top-actions>select{flex:1 1 150px; min-width:0} }
.gky-home{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 8px; white-space:nowrap}
.gky-home:hover{color:var(--ink); border-color:var(--line-strong)}
.gky-home i{display:inline-block; width:12px; height:5px; background:var(--muted); transform:rotate(-8deg)}
.gky-tabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--top-h,57px)); z-index:20; display:flex; gap:2px; padding-inline:12px; background:var(--surface); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.gky-tabs::-webkit-scrollbar{display:none}
.gky-tabs button{position:relative; border:0; background:transparent; padding:11px 12px 10px; cursor:pointer; white-space:nowrap; color:var(--muted); font-weight:500; font-size:14px}
.gky-tabs button[aria-selected="true"]{color:var(--ink); font-weight:700}
.gky-tabs button[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; background:var(--tape); border-radius:2px 2px 0 0}
.gky-tabs .count{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; margin-left:5px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:11px; font-weight:700; font-family:var(--f-mono)}
.gky-tabs .count:empty{display:none}
.gky-tabs .count.ok{background:var(--ok-soft); color:var(--ok)}
.gky-main{flex:1; width:100%; max-width:1180px; margin:0 auto; padding-block:16px 64px; padding-inline:16px}
.gky-main.wide{max-width:none}
.gky-cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
@media (max-width:860px){.gky-cols{grid-template-columns:minmax(0,1fr)}}

/* ---- 部品 ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; padding:0 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; white-space:nowrap; text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--tape); border-color:var(--tape); color:var(--tape-ink); font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2); border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.sm{min-height:28px; padding:0 9px; font-size:12px}
.btn.lg{min-height:44px; padding:0 16px; font-size:15px}
.btn:disabled{opacity:.45; cursor:default}
.btn svg,.ibtn svg{width:16px; height:16px; flex:none}
.ibtn{width:32px; height:32px; display:inline-grid; place-items:center; border-radius:6px; cursor:pointer; border:1px solid transparent; background:transparent; color:var(--muted); padding:0}
.ibtn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
.ibtn.del:hover{color:var(--bad)}
.btnrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
input[type="text"],input[type="search"],input[type="number"],input[type="date"],input[type="time"],input[type="url"],input[type="tel"],select,textarea{
  border:1px solid var(--line-strong); border-radius:6px; background:var(--surface); padding:6px 9px; min-height:34px; width:100%; min-width:0}
select{width:auto; max-width:100%}
textarea{resize:vertical; line-height:1.65; min-height:64px}
input[type="number"]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}
input.bad,select.bad{border-color:var(--bad); background:var(--bad-soft)}
label.chk{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:13px}
label.chk input{width:16px; height:16px; accent-color:var(--tape); flex:none}
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld>span{font-size:12px; color:var(--muted); font-weight:500}
.fld .hint{font-size:11.5px; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px 12px}
.grid .wide{grid-column:1/-1}

.sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 16px; margin-bottom:14px; min-width:0}
.sec>h2,.sec>h3{font-size:15px; font-weight:700; margin:0 0 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec>h2 small,.sec>h3 small{font-weight:400; color:var(--muted); font-size:12px}
.sec .note{font-size:12px; color:var(--muted); margin:8px 0 0}
.lead{font-size:13px; color:var(--muted); margin:0 0 12px; max-width:68ch}
.intro{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; margin-bottom:14px; border-radius:var(--r); background:var(--surface); border:1px dashed var(--line-strong); font-size:13px}
.intro p{margin:0; flex:1; min-width:0}
.sample-flag{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:12px; font-weight:700; white-space:nowrap}

/* テープ形のラベル */
.tape{--tc:var(--tape); --ti:var(--tape-ink); display:inline-flex; align-items:center; height:22px; padding:0 10px; flex:none;
  background:var(--tc); color:var(--ti); font-size:12px; font-weight:700; letter-spacing:.06em; line-height:1; white-space:nowrap;
  clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 22%,calc(100% - 2px) 45%,100% 70%,calc(100% - 3px) 100%,3px 100%,0 78%,2px 52%,0 26%)}
.chip{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px; font-size:12px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.chip.tp{background:var(--tape-soft); color:var(--ink); border-color:var(--tape-line)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* 集計の小さな札 */
.sums{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.sum{display:inline-flex; align-items:baseline; gap:6px; padding:6px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:12px; color:var(--muted)}
.sum b{font-family:var(--f-mono); font-size:15px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.sum.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); background:var(--warn-soft)} .sum.warn b{color:var(--warn)}
.sum.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line)); background:var(--bad-soft)} .sum.bad b{color:var(--bad)}
.sum.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); background:var(--ok-soft)} .sum.ok b{color:var(--ok)}

/* 表 */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.tbl{border-collapse:collapse; width:100%; font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle}
.tbl thead th{position:sticky; top:0; z-index:1; background:var(--surface-2); font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--tape-soft)}
.tbl input,.tbl select{min-height:30px; padding:3px 6px}

/* 一覧 */
.list{display:flex; flex-direction:column; gap:8px}
.item{display:flex; align-items:center; gap:10px; padding:9px 10px 9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); min-width:0}
.item.on{border-color:var(--tape); box-shadow:0 0 0 1px var(--tape)}
.item .main{flex:1; min-width:0}
.item .t1{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .t2{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
button.item{width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit}
button.item:hover{border-color:var(--line-strong)}
.empty{padding:28px 16px; text-align:center; color:var(--muted); font-size:13px; border:1px dashed var(--line-strong); border-radius:var(--r); background:var(--surface)}
.empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px}

/* 確認の一覧 */
.issues{display:flex; flex-direction:column; gap:6px}
.issue{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:13px}
.issue .dot{margin-top:7px}
.issue.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.issue.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.issue .main{flex:1; min-width:0}
.issue .sub{font-size:12px; color:var(--muted)}

/* シート（重ねて出す画面） */
.gky-veil{position:fixed; inset:0; z-index:80; background:rgba(10,14,12,.45); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.gky-veil{align-items:center}}
.gky-sheet{width:min(640px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--line)}
.gky-sheet.wide{width:min(980px,100%)}
.gky-sheet>header{display:flex; align-items:center; gap:10px; padding:12px 12px 10px 16px; border-bottom:1px solid var(--line)}
.gky-sheet>header h2{flex:1; font-size:16px}
.gky-sheet>.body{padding:14px 16px; overflow:auto; min-height:0}
.gky-sheet>footer{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding:10px 16px 14px; border-top:1px solid var(--line)}
.gky-sheet>footer .left{margin-right:auto}

.gky-toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); z-index:100; max-width:min(560px,calc(100% - 32px));
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s}
.gky-toast.on{opacity:1; transform:translateX(-50%); pointer-events:auto}
.gky-toast button{border:0; background:transparent; color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0}
@media (prefers-reduced-motion:reduce){.gky-toast{transition:none}}

/* 印刷・PDFのプレビュー */
.gky-pv{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; background:var(--surface-3)}
.gky-pv>header{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding-block:10px; padding-inline:16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--line)}
.gky-pv>header h2{font-size:15px; flex:1; min-width:10em}
.gky-pv .stage{flex:1; overflow:auto; padding:18px 16px 60px}
.gky-pv .scaler{transform-origin:top left; display:flex; flex-direction:column; gap:18px}
.gky-pv .msg{font-size:12px; color:var(--muted)}

/* 紙（印刷物）はテーマに関係なく白い紙に黒い字 */
.gky-page{position:relative; width:794px; height:1123px; background:var(--paper); color:var(--paper-ink); box-shadow:0 2px 10px rgba(0,0,0,.18);
  font-family:var(--f-doc); font-size:10pt; line-height:1.5; display:flex; flex-direction:column; padding:42px 44px 30px; overflow:hidden}
.gky-page.landscape{width:1123px; height:794px}
.gky-page .pg-head{display:flex; align-items:flex-end; gap:12px; border-bottom:1.5px solid var(--paper-line); padding-bottom:6px; margin-bottom:10px}
.gky-page .pg-title{font-size:15pt; font-weight:700; letter-spacing:.04em}
.gky-page .pg-sub{font-size:9.5pt; color:var(--paper-mute); flex:1; text-align:right}
.gky-page .pg-body{flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:8px}
.gky-page .pg-foot{display:flex; justify-content:space-between; font-size:8pt; color:var(--paper-mute); margin-top:8px}
.gky-page h3{font-size:11.5pt; margin:4px 0 0; padding-left:7px; border-left:3px solid var(--paper-line)}
.gky-page h4{font-size:10pt; margin:2px 0 0}
.gky-page p{margin:0}
.gky-page .muted{color:var(--paper-mute)}
.gky-page table{border-collapse:collapse; width:100%; font-size:9pt; table-layout:fixed}
.gky-page th,.gky-page td{border:0.75px solid var(--paper-line); padding:3px 5px; vertical-align:top; overflow-wrap:anywhere}
.gky-page th{background:var(--paper-head); font-weight:700; text-align:left}
.gky-page td.num,.gky-page th.num{text-align:right; font-variant-numeric:tabular-nums}
.gky-page td.c,.gky-page th.c{text-align:center}
.gky-page .mark{background:var(--paper-mark)}
.gky-page .box{border:0.75px solid var(--paper-line); padding:6px 8px}
#gky-print-root{display:none}
@media print{
  body.gky-printing>*:not(#gky-print-root){display:none!important}
  body.gky-printing{background:#fff!important}
  body.gky-printing #gky-print-root{display:block}
  #gky-print-root .gky-page{box-shadow:none; margin:0; break-after:page; page-break-after:always}
  #gky-print-root .gky-page:last-child{break-after:auto; page-break-after:auto}
}
/* ==== 楽屋シリーズ 共通部品（見た目） ここまで ==== */

/* ==== 本番逆算スケジュールだけの見た目 ==== */
/* レイアウト：上に本番までの時間の帯（今日と締め切りの点）、下に月ごとのやること */
:root{ --tape:#44539E; --tape-ink:#FFFFFF; }
.hero{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 20px; margin-bottom:12px}
.hero .days{font-family:var(--f-mono); font-size:44px; font-weight:600; line-height:1}
.hero .days small{font-size:15px; font-family:var(--f-ui); font-weight:700; margin-left:4px}
.hero .what{font-size:15px; font-weight:700}
.hero .when{font-size:13px; color:var(--muted)}
.tl{position:relative; height:54px; margin:6px 6px 22px; border-bottom:2px solid var(--line-strong)}
.tl .dot{position:absolute; bottom:-6px; width:10px; height:10px; border-radius:50%; transform:translateX(-50%); background:var(--line-strong); border:2px solid var(--surface)}
.tl .dot.done{background:var(--ok)} .tl .dot.late{background:var(--bad)} .tl .dot.soon{background:var(--warn)}
.tl .today{position:absolute; bottom:-10px; top:6px; width:2px; background:var(--tape)}
.tl .today::after{content:"今日"; position:absolute; top:-6px; left:4px; font-size:11px; color:var(--tape); font-weight:700; white-space:nowrap}
.tl .show{position:absolute; right:-6px; bottom:-12px; width:16px; height:16px; background:var(--tape); transform:rotate(45deg)}
.tl .m{position:absolute; bottom:-22px; font-size:10.5px; color:var(--muted); transform:translateX(-50%); font-family:var(--f-mono)}
.month{margin-bottom:16px}
.month>h3{font-size:13px; color:var(--muted); margin:0 0 6px; display:flex; align-items:center; gap:8px}
.task{display:grid; grid-template-columns:auto 7.4em minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:6px}
.task.done{opacity:.55}
.task.done .nm{text-decoration:line-through}
.task.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.task .cb{width:22px; height:22px; accent-color:var(--tape)}
.task .dd{font-family:var(--f-mono); font-size:12.5px}
.task .dd b{display:block; font-size:13px}
.task .nm{font-weight:700}
.task .sub{font-size:12px; color:var(--muted)}
.task .rel{font-size:11.5px; font-family:var(--f-mono)}
.task .rel.late{color:var(--bad); font-weight:700} .task .rel.soon{color:var(--warn); font-weight:700}
@media (max-width:560px){ .task{grid-template-columns:auto minmax(0,1fr) auto} .task .dd{grid-column:2; grid-row:1} .task .main{grid-column:2; grid-row:2} .task .side{grid-column:3; grid-row:1/3} }
.tools a{font-size:12px}
</style>
</head>
<body>
<div class="gky-app">
  <header class="gky-top">
    <a class="gky-brand" href="#" id="brand" title="本番逆算スケジュールについて"><span class="gky-tape"></span><b>本番逆算</b><small>準備の締め切り</small></a>
    <div class="gky-top-actions">
      <select id="pSel" aria-label="本番を選ぶ"></select>
      <button class="btn sm" id="btnPlan">本番の設定</button>
      <button class="ibtn" id="btnUndo" title="元に戻す（Ctrl+Z）" aria-label="元に戻す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5L2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 010 8h-3"/></svg></button>
      <button class="ibtn" id="btnRedo" title="やり直す（Ctrl+Shift+Z）" aria-label="やり直す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5h-7a4 4 0 000 8h3"/></svg></button>
      <a class="gky-home" id="homeLink" href="#" target="_blank" rel="noopener"><i></i>楽屋</a>
    </div>
  </header>
  <nav class="gky-tabs" id="tabs" role="tablist">
    <button data-tab="list">やること<span class="count" id="cntLate"></span></button>
    <button data-tab="edit">ならべ直す</button>
    <button data-tab="out">書き出し</button>
  </nav>
  <main class="gky-main">
    <div id="sampleBar"></div>

    <section data-panel="list" hidden>
      <div class="hero" id="hero"></div>
      <div class="tl" id="tl"></div>
      <div class="sums" id="sums"></div>
      <div class="btnrow" style="margin-bottom:12px"><label class="chk"><input type="checkbox" id="hideDone"> すんだものをかくす</label><label class="chk"><input type="checkbox" id="weekday"> 土日・祝日の締め切りは前の平日に</label><button class="btn sm" id="addTask">＋ やることを足す</button></div>
      <div id="months"></div>
    </section>

    <section data-panel="edit" hidden>
      <p class="lead">本番の何日前に済ませるかで並んでいます。日数を変えると、本番の日付を変えたときもいっしょに動きます。日付を直接決めたいときは「決まった日」に入れてください。</p>
      <div class="tbl-wrap"><table class="tbl" id="edTable"></table></div>
      <div class="btnrow" style="margin-top:10px"><button class="btn" id="addTask2">＋ やることを足す</button><button class="btn" id="saveTpl">このならびを自分のひな形にする</button></div>
    </section>

    <section data-panel="out" hidden>
      <div class="gky-cols">
        <div class="sec">
          <h2>配る・コピー</h2>
          <div class="btnrow"><button class="btn primary" id="cpWeek">今週と来週のやることをコピー</button><button class="btn" id="cpAll">全部をコピー</button></div>
          <div class="list" style="margin-top:10px"><button class="item" id="prList"><div class="main"><div class="t1">スケジュールを印刷・PDF</div><div class="t2">月ごとのやること・締め切り・担当・チェック欄</div></div></button></div>
        </div>
        <div class="sec">
          <h2>カレンダー・ファイル</h2>
          <div class="btnrow"><button class="btn" id="icsOut">カレンダーに入れる（.ics）</button><button class="btn" id="csvOut">CSVで保存</button><button class="btn" id="jsonOut">この本番をファイルに保存</button><button class="btn" id="jsonIn">ファイルから読み込む</button></div>
          <p class="note" id="icsNote">.ics のファイルを開くと、GoogleカレンダーやiPhoneのカレンダーに、締め切りを終日の予定として入れられます。</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* ==== 楽屋シリーズ 共通部品（しくみ） ここから ==== */
/* 全ツールで同じ内容です。変えるときは全ツールそろえて変え、GKY.VERSION を上げてください。
   ・楽屋データ（部員・曲・楽器）の読み書き      GKY.org / GKY.saveOrg
   ・ファイルの保存と読み込み                    GKY.saveFile / GKY.openFile
   ・CSV（Excelで開ける形）                      GKY.csv / GKY.parseCSV
   ・パートの名前のそろえ方                      GKY.PARTS / GKY.partOf / GKY.baseOf
   ・ほかのツールのファイルの見分け              GKY.identify / GKY.stagemane / GKY.bamiri
   ・印刷とPDF                                   GKY.doc
   ・小さな画面部品                              GKY.toast / GKY.sheet / GKY.arm               */
const GKY = (() => {
  const VERSION = '1';
  /* Claudeの画面の中で開いているか（そのときはファイル保存の方法と印刷のしかたが変わる） */
  const IN_VIEWER = !!(window.claude && typeof window.claude.use === 'function');
  const TEST = /[?&]test\b/.test(location.search);

  /* ---------- 小物 ---------- */
  const $ = (q, el = document) => el.querySelector(q);
  const $$ = (q, el = document) => Array.from(el.querySelectorAll(q));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = (p = 'x') => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = s => String(s ?? '').normalize('NFKC').trim();
  /* 曲名などを見比べるための形（空白・記号・大文字小文字の違いをなくす） */
  const key = s => norm(s).toLowerCase().replace(/[\s・･「」『』（）()［］\[\]〈〉《》“”"'’‘、。,.:：;；!！?？~〜ー－―‐\-_/／]+/g, '');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  /* 少し待ってからまとめて実行する。ページを閉じる・ほかのアプリに切りかえるときは、待っている分をすぐ実行する（保存のもれを防ぐ） */
  const pendings = new Set();
  const debounce = (fn, ms = 400) => {
    let t = 0, args = [];
    const f = (...a) => { args = a; clearTimeout(t); pendings.add(f); t = setTimeout(() => { pendings.delete(f); fn(...args); }, ms); };
    f.flush = () => { if (!pendings.has(f)) return; clearTimeout(t); pendings.delete(f); fn(...args); };
    return f;
  };
  const flushAll = () => [...pendings].forEach(f => f.flush());
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  /* ---------- 時間と日付 ---------- */
  const pad = n => String(n).padStart(2, '0');
  /* 秒 → 8:43 */
  const clock = s => { if (s == null || !isFinite(s)) return '—'; s = Math.round(s); const neg = s < 0; s = Math.abs(s); const m = Math.floor(s / 60), r = s % 60; return (neg ? '−' : '') + (m >= 60 ? Math.floor(m / 60) + ':' + pad(m % 60) : m) + ':' + pad(r); };
  /* 秒 → 8'43" （吹奏楽の資料でよく使う書き方） */
  const dur = s => { if (s == null || !isFinite(s)) return ''; s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m + "'" + pad(r) + '"'; };
  /* 8:43 / 8'43" / 8分43秒 / 523 → 秒。読めないときは null */
  function parseDur(v) {
    const t = norm(v).replace(/\s/g, '');
    if (!t) return null;
    let m;
    if ((m = t.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return +m[1] * 3600 + +m[2] * 60 + +m[3];
    if ((m = t.match(/^(\d+)[:'′分](\d{1,2})(?:["″秒]|'')?$/))) return +m[1] * 60 + +m[2];
    if ((m = t.match(/^(\d+)[分'′]$/))) return +m[1] * 60;
    if ((m = t.match(/^(\d+(?:\.\d+)?)秒?$/))) return Math.round(+m[1]);
    return null;
  }
  const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const jpDate = (s, withWeek = true) => { const d = typeof s === 'string' ? parseYmd(s) : s; if (!d) return ''; return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' + (withWeek ? '（' + WD[d.getDay()] + '）' : ''); };
  const mdDate = (s) => { const d = typeof s === 'string' ? parseYmd(s) : s; if (!d) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; };
  const addDays = (s, n) => { const d = parseYmd(s); if (!d) return ''; d.setDate(d.getDate() + n); return ymd(d); };
  const daysBetween = (a, b) => { const x = parseYmd(a), y = parseYmd(b); if (!x || !y) return null; return Math.round((y - x) / 86400000); };
  /* 4月はじまりの年度 */
  const fiscalYear = (d = new Date()) => d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  const stamp = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); };

  /* ---------- ブラウザへの保存（この端末の中だけ） ---------- */
  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 使えない環境 */ } },
    keys() { try { return Object.keys(localStorage); } catch (e) { return []; } },
    raw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    setRaw(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  /* ---------- パート ---------- */
  /* バミリの奏者ラベルと同じ書き方にそろえています */
  const SECTIONS = { ww: '木管', br: '金管', str: '弦', perc: '打楽器', key: '鍵盤・ハープ', etc: 'その他' };
  const PARTS = [
    ['Pic', 'ピッコロ', 'ww'], ['Fl', 'フルート', 'ww'], ['Ob', 'オーボエ', 'ww'], ['E.H.', 'イングリッシュホルン', 'ww'], ['Fg', 'ファゴット', 'ww'],
    ['E♭Cl', 'E♭クラリネット', 'ww'], ['Cl', 'クラリネット', 'ww'], ['A.Cl', 'アルトクラリネット', 'ww'], ['B.Cl', 'バスクラリネット', 'ww'],
    ['S.Sax', 'ソプラノサックス', 'ww'], ['A.Sax', 'アルトサックス', 'ww'], ['T.Sax', 'テナーサックス', 'ww'], ['B.Sax', 'バリトンサックス', 'ww'],
    ['Tp', 'トランペット', 'br'], ['Cor', 'コルネット', 'br'], ['Hn', 'ホルン', 'br'], ['Tb', 'トロンボーン', 'br'], ['B.Tb', 'バストロンボーン', 'br'],
    ['Euph', 'ユーフォニアム', 'br'], ['Tuba', 'テューバ', 'br'],
    ['St.B', '弦バス', 'str'], ['Perc', '打楽器', 'perc'], ['Pf', 'ピアノ', 'key'], ['Hp', 'ハープ', 'key'],
  ];
  /* 打楽器の中の楽器（コウバンなどの「受け持ち」で使う） */
  const PERC = [
    ['Timp', 'ティンパニ'], ['S.D.', 'スネアドラム'], ['B.D.', 'バスドラム'], ['Cym', 'クラッシュシンバル'], ['Sus.Cym', 'サスペンデッドシンバル'],
    ['Tam-t', 'タムタム'], ['Drs', 'ドラムセット'], ['Mar', 'マリンバ'], ['Xylo', 'シロフォン'], ['Vib', 'ヴィブラフォン'], ['Glk', 'グロッケン'],
    ['Chime', 'チャイム'], ['Tamb', 'タンバリン'], ['Tri', 'トライアングル'], ['W.B.', 'ウッドブロック'], ['Toms', 'タムタム（太鼓）'],
    ['Cong', 'コンガ'], ['Bongo', 'ボンゴ'], ['Timb', 'ティンバレス'], ['Perc', '打楽器（小物）'],
  ];
  const PART_CODES = new Set(PARTS.map(p => p[0]));
  const PERC_CODES = new Set(PERC.map(p => p[0]));
  /* よく使う呼び方 → 記号 */
  const ALIAS = {
    'ぴっころ': 'Pic', 'ピッコロ': 'Pic', 'picc': 'Pic', 'pic': 'Pic', 'ピッコ': 'Pic',
    'ふるーと': 'Fl', 'フルート': 'Fl', 'fl': 'Fl', 'flute': 'Fl',
    'おーぼえ': 'Ob', 'オーボエ': 'Ob', 'ob': 'Ob', 'eh': 'E.H.', 'e.h.': 'E.H.', 'イングリッシュホルン': 'E.H.', 'コールアングレ': 'E.H.',
    'ふぁごっと': 'Fg', 'ファゴット': 'Fg', 'バスーン': 'Fg', 'fg': 'Fg', 'bsn': 'Fg',
    'クラ': 'Cl', 'クラリネット': 'Cl', 'くら': 'Cl', 'cl': 'Cl', 'b♭cl': 'Cl', 'bbcl': 'Cl', 'エスクラ': 'E♭Cl', 'e♭cl': 'E♭Cl', 'ebcl': 'E♭Cl',
    'アルトクラ': 'A.Cl', 'アルトクラリネット': 'A.Cl', 'a.cl': 'A.Cl', 'acl': 'A.Cl',
    'バスクラ': 'B.Cl', 'バスクラリネット': 'B.Cl', 'b.cl': 'B.Cl', 'bcl': 'B.Cl',
    'ソプラノサックス': 'S.Sax', 'ソプラノ': 'S.Sax', 'ss': 'S.Sax', 's.sax': 'S.Sax', 'ssax': 'S.Sax',
    'アルトサックス': 'A.Sax', 'アルト': 'A.Sax', 'as': 'A.Sax', 'a.sax': 'A.Sax', 'asax': 'A.Sax',
    'テナーサックス': 'T.Sax', 'テナー': 'T.Sax', 'ts': 'T.Sax', 't.sax': 'T.Sax', 'tsax': 'T.Sax',
    'バリトンサックス': 'B.Sax', 'バリトン': 'B.Sax', 'バリサク': 'B.Sax', 'bs': 'B.Sax', 'b.sax': 'B.Sax', 'bsax': 'B.Sax',
    'トランペット': 'Tp', 'ラッパ': 'Tp', 'tp': 'Tp', 'trp': 'Tp', 'tpt': 'Tp', 'コルネット': 'Cor', 'cor': 'Cor', 'crt': 'Cor',
    'ホルン': 'Hn', 'hn': 'Hn', 'hr': 'Hn', 'horn': 'Hn',
    'トロンボーン': 'Tb', 'ボーン': 'Tb', 'tb': 'Tb', 'trb': 'Tb', 'バストロンボーン': 'B.Tb', 'バストロ': 'B.Tb', 'b.tb': 'B.Tb', 'btb': 'B.Tb',
    'ユーフォニアム': 'Euph', 'ユーフォ': 'Euph', 'euph': 'Euph', 'eup': 'Euph', 'eu': 'Euph', 'ユーフォニウム': 'Euph',
    'テューバ': 'Tuba', 'チューバ': 'Tuba', 'tuba': 'Tuba', 'tu': 'Tuba',
    '弦バス': 'St.B', 'げんばす': 'St.B', 'コントラバス': 'St.B', 'st.b': 'St.B', 'stb': 'St.B', 'cb': 'St.B', 'ベース': 'St.B',
    '打楽器': 'Perc', 'パーカッション': 'Perc', 'perc': 'Perc', 'per': 'Perc', 'だがっき': 'Perc',
    'ピアノ': 'Pf', 'pf': 'Pf', 'pno': 'Pf', 'ハープ': 'Hp', 'hp': 'Hp', 'harp': 'Hp',
    'ティンパニ': 'Timp', 'timp': 'Timp', 'tim': 'Timp', 'スネア': 'S.D.', 'スネアドラム': 'S.D.', '小太鼓': 'S.D.', 'sd': 'S.D.', 's.d.': 'S.D.', 'sn': 'S.D.',
    'バスドラム': 'B.D.', 'バスドラ': 'B.D.', '大太鼓': 'B.D.', 'bd': 'B.D.', 'b.d.': 'B.D.', 'シンバル': 'Cym', 'cym': 'Cym', 'cymb': 'Cym',
    'サスペンデッドシンバル': 'Sus.Cym', 'サスシン': 'Sus.Cym', 'sus.cym': 'Sus.Cym', 'タムタム': 'Tam-t', 'ドラ': 'Tam-t', 'ドラムセット': 'Drs', 'ドラム': 'Drs', 'drs': 'Drs', 'dr': 'Drs',
    'マリンバ': 'Mar', 'mar': 'Mar', 'mrb': 'Mar', 'シロフォン': 'Xylo', '木琴': 'Xylo', 'xylo': 'Xylo', 'xyl': 'Xylo',
    'ヴィブラフォン': 'Vib', 'ビブラフォン': 'Vib', '鉄琴': 'Glk', 'vib': 'Vib', 'グロッケン': 'Glk', 'glk': 'Glk', 'glock': 'Glk',
    'チャイム': 'Chime', 'chime': 'Chime', 'chimes': 'Chime', 'タンバリン': 'Tamb', 'tamb': 'Tamb', 'トライアングル': 'Tri', 'tri': 'Tri',
    'ウッドブロック': 'W.B.', 'wb': 'W.B.', 'w.b.': 'W.B.', 'コンガ': 'Cong', 'ボンゴ': 'Bongo', 'ティンバレス': 'Timb',
  };
  /* 入力された名前を記号にそろえる（わからなければそのまま） */
  function partOf(v) {
    const t = norm(v);
    if (!t) return '';
    if (PART_CODES.has(t) || PERC_CODES.has(t)) return t;
    const k = t.toLowerCase().replace(/\s/g, '');
    if (ALIAS[k]) return ALIAS[k];
    if (ALIAS[t]) return ALIAS[t];
    for (const p of PARTS) if (p[0].toLowerCase() === k || p[1] === t) return p[0];
    for (const p of PERC) if (p[0].toLowerCase() === k || p[1] === t) return p[0];
    return t;
  }
  /* 「Cl1」「1st Cl」「Tp 2」→ 楽器の記号（Cl, Tp）。打楽器の中の楽器はそのまま */
  function baseOf(label) {
    let t = norm(label).replace(/\s+/g, ' ');
    t = t.replace(/^(?:\d+(?:st|nd|rd|th)|[1-9]番?)\s*/i, '').replace(/\s*(?:\d+(?:st|nd|rd|th)?|[ⅠⅡⅢⅣ]|[1-9]番)$/i, '').trim();
    return partOf(t) || t;
  }
  /* その受け持ちに入れる楽器の仲間（打楽器はまとめて Perc） */
  const familyOf = label => { const b = baseOf(label); return PERC_CODES.has(b) ? 'Perc' : b; };
  const partName = code => { const p = PARTS.find(x => x[0] === code) || PERC.find(x => x[0] === code); return p ? p[1] : code; };
  const sectionOf = code => { const f = familyOf(code); const p = PARTS.find(x => x[0] === f); return p ? p[2] : 'etc'; };
  const partOrder = code => { const f = familyOf(code); const i = PARTS.findIndex(x => x[0] === f); const j = PERC.findIndex(x => x[0] === baseOf(code)); return (i < 0 ? 900 : i * 10) + (j < 0 ? 0 : j / 100); };
  const GRADES = ['小4', '小5', '小6', '中1', '中2', '中3', '高1', '高2', '高3', '大学', '一般'];
  /* その学年が「あと何年でいなくなるか」（中3・高3は今年度で終わり＝0）。わからなければ null */
  function yearsLeft(grade) {
    const g = norm(grade);
    let m;
    if ((m = g.match(/^小([1-6])$/))) return 6 - +m[1] + 3; // 中学まで続けると考える
    if ((m = g.match(/^中([1-3])$/))) return 3 - +m[1];
    if ((m = g.match(/^高([1-3])$/))) return 3 - +m[1];
    return null;
  }

  /* ---------- ファイルの保存 ---------- */
  const safeName = n => String(n || 'file').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 120);

  /* ---------- 印刷とPDF ---------- */

  const H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  function doc({ title = '', sub = '', orient = 'portrait', foot = '', file = '' } = {}) {

    const over = () => { const last = body.lastElementChild; if (!last) return false; const br = body.getBoundingClientRect(), lr = last.getBoundingClientRect(); return lr.bottom > br.bottom - 4 * (br.height / body.clientHeight || 1); };

  const a = dues[0], b = dues[dues.length - 1], span = Math.max(1, GKY.daysBetween(a, b));
  const X = d => (GKY.daysBetween(a, d) / span * 100).toFixed(2) + '%';
  let months = ''; { const d0 = GKY.parseYmd(a); d0.setDate(1); d0.setMonth(d0.getMonth() + 1); while (GKY.ymd(d0) <= b) { months += `<span class="m" style="left:${X(GKY.ymd(d0))}">${d0.getMonth() + 1}月</span>`; d0.setMonth(d0.getMonth() + 1); } }
  $('#tl').innerHTML = p.tasks.map(t => `<span class="dot ${stateOf(p, t)}" style="left:${X(dueOf(p, t))}" title="${esc(t.name)}（${esc(dueOf(p, t))}）"></span>`).join('') + months + `<span class="today" style="left:${X(today)}"></span>`;
  const st = s => p.tasks.filter(t => stateOf(p, t) === s).length;
  const doneN = st('done');
  $('#sums').innerHTML = `<span class="sum ${st('late') ? 'bad' : 'ok'}">締め切りをすぎた <b>${st('late')}</b></span><span class="sum ${st('soon') ? 'warn' : ''}">1週間以内 <b>${st('soon')}</b></span><span class="sum">これから <b>${st('later')}</b></span><span class="sum ok">すんだ <b>${doneN} / ${p.tasks.length}</b></span>`;
  const hide = $('#hideDone').checked;
  const xs = p.tasks.slice().sort((x, y) => dueOf(p, x).localeCompare(dueOf(p, y)) || x.off - y.off).filter(t => !hide || !t.done);
  const groups = []; xs.forEach(t => { const m = dueOf(p, t).slice(0, 7); let g = groups.find(x => x.m === m); if (!g) groups.push(g = { m, xs: [] }); g.xs.push(t); });
  $('#months').innerHTML = groups.length ? groups.map(g => `<div class="month"><h3><span class="tape">${+g.m.slice(5)}月</span>${g.m.slice(0, 4)}年</h3>${g.xs.map(t => { const d = dueOf(p, t), s = stateOf(p, t), r = relDays(d); return `<div class="task ${s}" data-id="${esc(t.id)}"><input type="checkbox" class="cb" ${t.done ? 'checked' : ''} aria-label="すんだ"><div class="dd"><b>${esc(GKY.mdDate(d))}</b><span class="rel ${s}">${t.done ? 'すんだ' : r < 0 ? -r + '日すぎ' : r === 0 ? '今日' : 'あと' + r + '日'}</span></div><div class="main" style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="sub">${esc(t.cat)}${t.off ? '　本番の' + Math.abs(t.off) + '日' + (t.off < 0 ? '前' : '後') : ''}${t.due ? '（決まった日）' : ''}${t.who ? '　担当 ' + esc(t.who) : ''}${t.note ? '　' + esc(t.note) : ''}</div>${t.link ? `<div class="sub tools">${toolLink(t.link)}</div>` : ''}</div><div class="side"><button class="ibtn" data-edit aria-label="直す">✎</button></div></div>`; }).join('')}</div>`).join('') : '<div class="empty"><b>やることはありません</b></div>';
  $$('#months .task').forEach(r => { const id = r.dataset.id; $('.cb', r).onchange = e => edit(pp => { pp.tasks.find(t => t.id === id).done = e.target.checked; }); $('[data-edit]', r).onclick = () => taskSheet(id); });
}
$('#hideDone').checked = GKY.store.get('gyakusan.hideDone', true) !== false;
$('#hideDone').onchange = e => { GKY.store.set('gyakusan.hideDone', e.target.checked); renderList(); };
$('#weekday').onchange = e => edit(p => { p.weekday = e.target.checked; });
function taskSheet(id) {
  const p = P(), t = id ? p.tasks.find(x => x.id === id) : newTask({ off: -14 });
  const cats = [...new Set(Object.values(TEMPLATES).flatMap(x => x.tasks.map(y => y.cat)).concat(p.tasks.map(x => x.cat)))];
  sheet({ title: id ? 'やることを直す' : 'やることを足す', content: `<div class="grid">
    <label class="fld wide"><span>やること</span><input type="text" id="tN" value="${esc(t.name)}"></label>
    <label class="fld"><span>本番の何日前（後はマイナスなし）</span><input type="number" id="tOff" value="${-t.off}" step="1"></label>
    <label class="fld"><span>決まった日（あれば）</span><input type="date" id="tDue" value="${esc(t.due)}"></label>
    <label class="fld"><span>担当</span><input type="text" id="tWho" value="${esc(t.who)}"></label>
    <label class="fld"><span>分類</span><input type="text" id="tCat" value="${esc(t.cat)}" list="cats"></label>
    <label class="fld"><span>使うツール</span><select id="tLink"><option value="">なし</option>${Object.entries(TOOLS).map(([k, v]) => `<option value="${k}"${t.link === k ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="fld wide"><span>メモ</span><input type="text" id="tNote" value="${esc(t.note)}"></label></div><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <p class="note">「何日前」に 30 と入れると本番の30日前、−7 と入れると本番の7日後です。</p>`,
    actions: [...(id ? [{ label: '消す', danger: true, left: true, onClick: () => { edit(pp => { pp.tasks = pp.tasks.filter(x => x.id !== id); }); toast('消しました', '元に戻す', undo); } }] : []), { label: 'やめる' }, { label: id ? '決める' : '足す', primary: true, onClick: body => {
      const name = norm($('#tN', body).value); if (!name) { $('#tN', body).classList.add('bad'); return false; }
      const v = { name, off: -Math.round(+$('#tOff', body).value || 0), due: $('#tDue', body).value, who: norm($('#tWho', body).value), cat: norm($('#tCat', body).value) || '全体', link: $('#tLink', body).value, note: norm($('#tNote', body).value) };
      edit(pp => { if (id) Object.assign(pp.tasks.find(x => x.id === id), v); else pp.tasks.push(newTask(v)); });
    } }] });
}
$('#addTask').onclick = () => taskSheet(null);
$('#addTask2').onclick = () => taskSheet(null);

/* --- ならべ直す --- */
function renderEdit() {
  const p = P();
  const xs = p.tasks.slice().sort((a, b) => a.off - b.off);
  $('#edTable').innerHTML = `<thead><tr><th>やること</th><th class="num">何日前</th><th>締め切り</th><th>決まった日</th><th>担当</th><th>分類</th><th></th></tr></thead><tbody>${xs.map(t => `<tr data-id="${esc(t.id)}"><td><input type="text" data-k="name" value="${esc(t.name)}" style="min-width:14em"></td><td class="num"><input type="number" data-k="off" value="${-t.off}" style="width:5em" aria-label="何日前"></td><td class="mono">${esc(GKY.mdDate(dueOf(p, t)))}</td><td><input type="date" data-k="due" value="${esc(t.due)}" aria-label="決まった日"></td><td><input type="text" data-k="who" value="${esc(t.who)}" style="min-width:6em"></td><td><input type="text" data-k="cat" value="${esc(t.cat)}" style="width:6em"></td><td><button class="ibtn del" data-del aria-label="消す">×</button></td></tr>`).join('')}</tbody>`;
  $$('#edTable tr[data-id]').forEach(tr => { const id = tr.dataset.id; $$('[data-k]', tr).forEach(i => i.onchange = () => edit(pp => { const t = pp.tasks.find(x => x.id === id), k = i.dataset.k; t[k] = k === 'off' ? -Math.round(+i.value || 0) : i.value.trim(); }, ['off', 'due'].includes(i.dataset.k))); $('[data-del]', tr).onclick = () => { edit(pp => { pp.tasks = pp.tasks.filter(x => x.id !== id); }); toast('消しました', '元に戻す', undo); }; });
}
$('#saveTpl').onclick = () => {
  const p = P();
  sheet({ title: '自分のひな形にする', content: `<label class="fld"><span>ひな形の名前</span><input type="text" id="tplN" value="${esc((TEMPLATES[p.kind] || {}).name || p.title)}（自分用）"></label><p class="note">やることと「何日前」が残ります（決まった日・担当・すんだ印は残りません）。来年の本番を作るときに選べます。</p>`,
    actions: [{ label: 'やめる' }, { label: '保存する', primary: true, onClick: body => { const name = norm($('#tplN', body).value) || '自分のひな形'; S.mine.push({ id: uid('t'), name, tasks: p.tasks.map(t => ({ name: t.name, off: t.due ? GKY.daysBetween(p.date, t.due) : t.off, cat: t.cat, link: t.link, note: t.note })) }); persist(); toast(`「${name}」を保存しました`); } }] });
};

/* --- 書き出し --- */
function renderOut() { $('#icsNote').textContent = GKY.IN_VIEWER ? 'Claudeの画面の中ではカレンダーのファイル（.ics）を保存できません。公開ページ（GitHub Pages）で開くと保存できます。CSVは保存できます。' : '.ics のファイルを開くと、GoogleカレンダーやiPhoneのカレンダーに、締め切りを終日の予定として入れられます。'; $('#icsOut').disabled = GKY.IN_VIEWER; }
const lineOf = (p, t) => `${GKY.mdDate(dueOf(p, t))} ${t.done ? '✓' : '□'} ${t.name}${t.who ? '（' + t.who + '）' : ''}`;
$('#cpWeek').onclick = () => { const p = P(), today = GKY.ymd(), end = GKY.addDays(today, 13); const xs = p.tasks.filter(t => !t.done && dueOf(p, t) <= end).sort((a, b) => dueOf(p, a).localeCompare(dueOf(p, b))); if (!xs.length) { toast('今週と来週のやることはありません'); return; } GKY.copyText([`【${p.title}】${GKY.mdDate(today)}〜${GKY.mdDate(end)}のやること（本番まで あと${GKY.daysBetween(today, p.date)}日）`, ...xs.map(t => lineOf(p, t) + (dueOf(p, t) < today ? ' ※すぎています' : ''))].join('\n'), '今週と来週のやることをコピーしました'); };
$('#cpAll').onclick = () => { const p = P(); GKY.copyText([`【${p.title}】${GKY.jpDate(p.date)}`, ...p.tasks.slice().sort((a, b) => dueOf(p, a).localeCompare(dueOf(p, b))).map(t => lineOf(p, t))].join('\n')); };
$('#prList').onclick = () => {
  const p = P();
  const d = GKY.doc({ title: '本番までのスケジュール', sub: `${p.title}　${GKY.jpDate(p.date)}`, foot: GKY.org().org.name, file: 'スケジュール_' + p.title });
  d.table({ cols: [{ h: '締め切り', w: '15%' }, { h: 'やること', w: '43%' }, { h: '担当', w: '16%' }, { h: '分類', w: '10%' }, { h: 'すんだ', w: '8%', cls: 'c' }, { h: '何日前', w: '8%', cls: 'num' }],
    rows: p.tasks.slice().sort((a, b) => dueOf(p, a).localeCompare(dueOf(p, b))).map(t => ({ cls: t.off === 0 ? 'mark' : '', cells: [esc(GKY.mdDate(dueOf(p, t))), esc(t.name) + (t.note ? `<br><span class="muted" style="font-size:8pt">${esc(t.note)}</span>` : ''), esc(t.who), esc(t.cat), t.done ? '✓' : '□', t.off ? String(-t.off) : '本番'] })) });
  d.show();
};
function ics(p) {
  const z = s => String(s).replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const ev = p.tasks.map(t => { const d = dueOf(p, t).replace(/-/g, ''), e = GKY.addDays(dueOf(p, t), 1).replace(/-/g, ''); return ['BEGIN:VEVENT', `UID:${t.id}@gyakusan`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${e}`, `SUMMARY:${z((t.off === 0 ? '' : '【締切】') + t.name)}`, `DESCRIPTION:${z(`${p.title}（${GKY.jpDate(p.date)}）${t.who ? '\n担当：' + t.who : ''}${t.note ? '\n' + t.note : ''}`)}`, 'END:VEVENT'].join('\r\n'); });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//gakuya//gyakusan//JA', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${z(p.title)}`, ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
$('#icsOut').onclick = () => { const p = P(); GKY.saveFile(`${p.title}.ics`, ics(p), 'text/calendar'); };
$('#csvOut').onclick = () => { const p = P(); GKY.saveFile(`スケジュール_${p.title}.csv`, GKY.csv([['締め切り', 'やること', '何日前', '決まった日', '担当', '分類', 'すんだ', 'メモ'], ...p.tasks.slice().sort((a, b) => dueOf(p, a).localeCompare(dueOf(p, b))).map(t => [dueOf(p, t), t.name, -t.off, t.due, t.who, t.cat, t.done ? '✓' : '', t.note])]), 'text/csv'); };
$('#jsonOut').onclick = () => { const p = P(); GKY.saveJSON(`本番逆算_${p.title}_${GKY.stamp()}.json`, { app: 'gyakusan', format: 1, exportedAt: new Date().toISOString(), plan: p, mine: S.mine }); };
$('#jsonIn').onclick = async () => { const f = await GKY.openJSON(); if (!f) return; if (f.kind !== 'gyakusan' || !f.data.plan) { toast('本番逆算スケジュールで保存したファイルを選んでください'); return; } const p = normalizePlan(f.data.plan); if (S.plans[p.id]) p.id = uid('p'); S.plans[p.id] = p; S.order.unshift(p.id); S.current = p.id; (f.data.mine || []).forEach(m => { if (!S.mine.some(x => x.name === m.name)) S.mine.push(m); }); past = []; future = []; persist(); renderAll(); toast(`「${p.title}」を読み込みました`); };

/* --- 本番の設定 --- */
function newPlanFlow() {
  const opts = Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join('') + S.mine.map(m => `<option value="mine:${esc(m.id)}">${esc(m.name)}</option>`).join('');
  sheet({ title: '新しい本番', content: `<div class="grid"><label class="fld wide"><span>本番の名前</span><input type="text" id="nT" placeholder="例：第13回 定期演奏会"></label><label class="fld"><span>本番の日</span><input type="date" id="nD" value="${GKY.addDays(GKY.ymd(), 120)}"></label><label class="fld"><span>ひな形</span><select id="nK">${opts}</select></label></div>`,
    actions: [{ label: 'やめる' }, { label: '作る', primary: true, onClick: body => { const k = $('#nK', body).value, mine = k.startsWith('mine:') ? S.mine.find(m => m.id === k.slice(5)) : null; const p = newPlan({ title: norm($('#nT', body).value) || '新しい本番', date: $('#nD', body).value || GKY.ymd(), kind: mine ? 'mine' : k }); p.tasks = fromTemplate(k, mine); S.plans[p.id] = p; S.order.unshift(p.id); S.current = p.id; past = []; future = []; persist(); renderAll(); showTab('list'); toast(`「${p.title}」を作りました。締め切りの日数は、施設や大会のきまりに合わせて直してください`, null, null, 6000); } }] });
}
$('#btnPlan').onclick = () => {
  const p = P();
  const sh = sheet({ title: '本番の設定', content: `<div class="grid"><label class="fld wide"><span>本番の名前</span><input type="text" id="sT" value="${esc(p.title)}"></label><label class="fld"><span>本番の日</span><input type="date" id="sD" value="${esc(p.date)}"></label></div><p class="note">本番の日を変えると、「決まった日」のないやることは、いっしょに動きます。</p><div class="btnrow" style="margin-top:12px"><button class="btn" id="sNew">新しい本番を作る</button><button class="btn" id="sDup">この本番を複製（来年用）</button><button class="btn danger" id="sDel">この本番を消す</button></div>`,
    actions: [{ label: 'やめる' }, { label: '決める', primary: true, onClick: body => edit(pp => { pp.title = norm($('#sT', body).value) || '無題'; pp.date = $('#sD', body).value || pp.date; pp.sample = false; }) }] });
  $('#sNew', sh.body).onclick = () => { sh.close(); newPlanFlow(); };
  $('#sDup', sh.body).onclick = () => { const d = GKY.parseYmd(p.date); d.setFullYear(d.getFullYear() + 1); const n = normalizePlan(Object.assign(clone(p), { id: uid('p'), title: p.title + '（来年）', date: GKY.ymd(d), sample: false })); n.tasks.forEach(t => { t.id = uid('k'); t.done = false; t.due = ''; }); S.plans[n.id] = n; S.order.unshift(n.id); S.current = n.id; past = []; future = []; persist(); sh.close(); renderAll(); toast('1年後の日付で複製しました'); };
  GKY.arm($('#sDel', sh.body), () => { const gone = clone(p), pos = S.order.indexOf(p.id); delete S.plans[p.id]; S.order = S.order.filter(x => x !== p.id); if (!S.order.length) { const n = newPlan(); n.tasks = fromTemplate('concert'); S.plans[n.id] = n; S.order.push(n.id); } S.current = S.order[Math.min(pos, S.order.length - 1)]; past = []; future = []; persist(); sh.close(); renderAll(); toast(`「${gone.title}」を消しました`, '元に戻す', () => { S.plans[gone.id] = gone; S.order.splice(pos, 0, gone.id); S.current = gone.id; persist(); renderAll(); }); }, 'もう一度押すと消します');
};
$('#pSel').onchange = e => { S.current = e.target.value; past = []; future = []; persist(); renderAll(); };

/* ---------- はじまり ---------- */
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#brand').onclick = e => { e.preventDefault(); GKY.about({ name: '本番逆算スケジュール', what: '演奏会・コンクールの日付から、準備の締め切りを逆算して並べるツールです。ひな形の日数はよくある目安なので、施設や大会のきまりに合わせて直してください。', version: APP_VERSION + '（' + APP_DATE + '）', changelog: CHANGELOG, feedback: FEEDBACK_URL }); };
$('#homeLink').href = GKY.linkTo('gakuya');
document.addEventListener('keydown', e => { if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; e.preventDefault(); if (e.shiftKey) redo(); else undo(); });
GKY.fitTop(); GKY.offline();
showTab('list');
renderAll();
if (GKY.TEST) window.__app = { ready: true, get S() { return S; }, P, holidays, dueOf, ics, normalizePlan, renderAll };
})();
</script>
</body>
</html>
