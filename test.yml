name: 自動テスト
# GitHub に上げるたびに、全ツールの自動テストを動かす（Actions のタブで結果が見られます）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# 続けて上げたときは、前の分を止めて新しい分だけ動かす
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # 全ツールを順に調べる（1つでも失敗したら赤い ×）
      - run: node test-all.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: '*/playwright-report'
          retention-days: 7
