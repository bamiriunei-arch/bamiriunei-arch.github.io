<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="吹奏楽・オーケストラ・バンドの舞台配置図をスマホやPCで作って画像にできる無料ツール。楽屋シリーズ">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="楽屋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191C'/%3E%3Crect x='6' y='13' width='20' height='7' rx='1' fill='%23E3B23C' transform='rotate(-10 16 16)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../gakuya/apple-touch-icon.png">
<title>バミリ配置図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ==== 楽屋シリーズ 共通部品（見た目） ここから ==== */
/* 全ツールで同じ内容です。楽屋（gakuya/index.html）で直してから、リポジトリのいちばん上で node sync-common.js を動かすと全ツールにそろえて写せます。
   レイアウト：舞台床のような落ち着いた灰緑の作業面に、ツールごとの色のバミリテープを1色だけ使う */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface-2:#F4F6F4; --surface-3:#E6EAE7;
  --ink:#1B211F; --muted:#5C6662; --line:#D4D9D6; --line-strong:#B5BDB8;
  --ok:#2B7A4B; --ok-soft:#E2F3E8; --warn:#9A5B00; --warn-soft:#FFF1D0; --bad:#B3261E; --bad-soft:#FBE3E0;
  --focus:#2F6FD0; --shadow:0 1px 2px rgba(18,24,22,.07),0 8px 22px rgba(18,24,22,.09);
  --tape:#D73A44; --tape-ink:#FFFFFF;
  --tape-soft:color-mix(in srgb,var(--tape) 13%,var(--surface));
  --tape-line:color-mix(in srgb,var(--tape) 45%,var(--line));
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-rule:#9A9A9A; --paper-mute:#5E5E5E; --paper-head:#EFEFEF; --paper-mark:#FFE58A;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-doc:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
    --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
    --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
    --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --surface-2:#22262A; --surface-3:#2B3035;
  --ink:#E7EBE9; --muted:#9AA39F; --line:#2E3337; --line-strong:#454C51;
  --ok:#6CCB93; --ok-soft:#173225; --warn:#F0B649; --warn-soft:#352812; --bad:#F2867E; --bad-soft:#3B1D1A;
  --focus:#78A6F0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
a{color:inherit}
h1,h2,h3,h4{text-wrap:balance; margin:0}
.mono,.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---- 骨組み ---- */
.gky-app{min-height:100%; display:flex; flex-direction:column}
.gky-top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  padding-block:10px; padding-inline:16px; background:var(--surface); border-bottom:1px solid var(--line)}
.gky-brand{display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none}
.gky-tape{flex:none; display:inline-block; width:26px; height:10px; background:var(--tape); transform:rotate(-8deg); border-radius:1px;
  clip-path:polygon(2px 0,100% 0,calc(100% - 2px) 50%,100% 100%,0 100%,2px 50%,0 0)}
.gky-brand b{font-size:19px; font-weight:700; letter-spacing:.06em; white-space:nowrap}
.gky-brand small{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gky-top-actions{margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
@media (max-width:600px){ .gky-top-actions{width:100%; margin-left:0} .gky-top-actions>select{flex:1 1 150px; min-width:0} }
.gky-home{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 8px; white-space:nowrap}
.gky-home:hover{color:var(--ink); border-color:var(--line-strong)}
.gky-home i{display:inline-block; width:12px; height:5px; background:var(--muted); transform:rotate(-8deg)}
.gky-tabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--top-h,57px)); z-index:20; display:flex; gap:2px; padding-inline:12px; background:var(--surface); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.gky-tabs::-webkit-scrollbar{display:none}
.gky-tabs button{position:relative; border:0; background:transparent; padding:11px 12px 10px; cursor:pointer; white-space:nowrap; color:var(--muted); font-weight:500; font-size:14px}
.gky-tabs button[aria-selected="true"]{color:var(--ink); font-weight:700}
.gky-tabs button[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; background:var(--tape); border-radius:2px 2px 0 0}
.gky-tabs .count{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; margin-left:5px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:11px; font-weight:700; font-family:var(--f-mono)}
.gky-tabs .count:empty{display:none}
.gky-tabs .count.ok{background:var(--ok-soft); color:var(--ok)}
.gky-main{flex:1; width:100%; max-width:1180px; margin:0 auto; padding-block:16px 64px; padding-inline:16px}
.gky-main.wide{max-width:none}
.gky-cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
@media (max-width:860px){.gky-cols{grid-template-columns:minmax(0,1fr)}}

/* ---- 部品 ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; padding:0 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; white-space:nowrap; text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--tape); border-color:var(--tape); color:var(--tape-ink); font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2); border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.sm{min-height:28px; padding:0 9px; font-size:12px}
.btn.lg{min-height:44px; padding:0 16px; font-size:15px}
.btn:disabled{opacity:.45; cursor:default}
.btn svg,.ibtn svg{width:16px; height:16px; flex:none}
.ibtn{width:32px; height:32px; display:inline-grid; place-items:center; border-radius:6px; cursor:pointer; border:1px solid transparent; background:transparent; color:var(--muted); padding:0}
.ibtn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
.ibtn.del:hover{color:var(--bad)}
.btnrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
input[type="text"],input[type="search"],input[type="number"],input[type="date"],input[type="time"],input[type="url"],input[type="tel"],select,textarea{
  border:1px solid var(--line-strong); border-radius:6px; background:var(--surface); padding:6px 9px; min-height:34px; width:100%; min-width:0}
select{width:auto; max-width:100%}
textarea{resize:vertical; line-height:1.65; min-height:64px}
input[type="number"]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}
input.bad,select.bad{border-color:var(--bad); background:var(--bad-soft)}
label.chk{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:13px}
label.chk input{width:16px; height:16px; accent-color:var(--tape); flex:none}
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld>span{font-size:12px; color:var(--muted); font-weight:500}
.fld .hint{font-size:11.5px; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px 12px}
.grid .wide{grid-column:1/-1}

.sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 16px; margin-bottom:14px; min-width:0}
.sec>h2,.sec>h3{font-size:15px; font-weight:700; margin:0 0 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec>h2 small,.sec>h3 small{font-weight:400; color:var(--muted); font-size:12px}
.sec .note{font-size:12px; color:var(--muted); margin:8px 0 0}
.lead{font-size:13px; color:var(--muted); margin:0 0 12px; max-width:68ch}
.intro{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; margin-bottom:14px; border-radius:var(--r); background:var(--surface); border:1px dashed var(--line-strong); font-size:13px}
.intro p{margin:0; flex:1; min-width:0}
.sample-flag{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:12px; font-weight:700; white-space:nowrap}

/* テープ形のラベル */
.tape{--tc:var(--tape); --ti:var(--tape-ink); display:inline-flex; align-items:center; height:22px; padding:0 10px; flex:none;
  background:var(--tc); color:var(--ti); font-size:12px; font-weight:700; letter-spacing:.06em; line-height:1; white-space:nowrap;
  clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 22%,calc(100% - 2px) 45%,100% 70%,calc(100% - 3px) 100%,3px 100%,0 78%,2px 52%,0 26%)}
.chip{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px; font-size:12px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.chip.tp{background:var(--tape-soft); color:var(--ink); border-color:var(--tape-line)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* 集計の小さな札 */
.sums{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.sum{display:inline-flex; align-items:baseline; gap:6px; padding:6px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:12px; color:var(--muted)}
.sum b{font-family:var(--f-mono); font-size:15px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.sum.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); background:var(--warn-soft)} .sum.warn b{color:var(--warn)}
.sum.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line)); background:var(--bad-soft)} .sum.bad b{color:var(--bad)}
.sum.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); background:var(--ok-soft)} .sum.ok b{color:var(--ok)}

/* 表 */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.tbl{border-collapse:collapse; width:100%; font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle}
.tbl thead th{position:sticky; top:0; z-index:1; background:var(--surface-2); font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--tape-soft)}
.tbl input,.tbl select{min-height:30px; padding:3px 6px}
/* スマホ：表の列が細くなりすぎて1文字ずつ折り返さないように（入りきらないときは、表の中だけ横に動く） */
@media (max-width:600px){ .tbl td{min-width:3.6em} .tbl td.num,.tbl td:empty{min-width:0} .tbl td.mono{white-space:nowrap} }

/* 一覧 */
.list{display:flex; flex-direction:column; gap:8px}
.item{display:flex; align-items:center; gap:10px; padding:9px 10px 9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); min-width:0}
.item.on{border-color:var(--tape); box-shadow:0 0 0 1px var(--tape)}
.item .main{flex:1; min-width:0}
.item .t1{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .t2{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
button.item{width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit}
button.item:hover{border-color:var(--line-strong)}
.empty{padding:28px 16px; text-align:center; color:var(--muted); font-size:13px; border:1px dashed var(--line-strong); border-radius:var(--r); background:var(--surface)}
.empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px}

/* 確認の一覧 */
.issues{display:flex; flex-direction:column; gap:6px}
.issue{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:13px}
.issue .dot{margin-top:7px}
.issue.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.issue.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.issue .main{flex:1; min-width:0}
.issue .sub{font-size:12px; color:var(--muted)}

/* シート（重ねて出す画面） */
.gky-veil{position:fixed; inset:0; z-index:80; background:rgba(10,14,12,.45); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.gky-veil{align-items:center}}
.gky-sheet{width:min(640px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--line)}
.gky-sheet.wide{width:min(980px,100%)}
.gky-sheet>header{display:flex; align-items:center; gap:10px; padding:12px 12px 10px 16px; border-bottom:1px solid var(--line)}
.gky-sheet>header h2{flex:1; font-size:16px}
.gky-sheet>.body{padding:14px 16px; overflow:auto; min-height:0}
.gky-sheet>footer{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding:10px 16px 14px; border-top:1px solid var(--line)}
.gky-sheet>footer .left{margin-right:auto}

.gky-toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); z-index:100; max-width:min(560px,calc(100% - 32px));
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s}
.gky-toast.on{opacity:1; transform:translateX(-50%); pointer-events:auto}
.gky-toast button{border:0; background:transparent; color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0}
@media (prefers-reduced-motion:reduce){.gky-toast{transition:none}}

/* 印刷・PDFのプレビュー */
.gky-pv{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; background:var(--surface-3)}
.gky-pv>header{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding-block:10px; padding-inline:16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--line)}
.gky-pv>header h2{font-size:15px; flex:1; min-width:10em}
.gky-pv .stage{flex:1; overflow:auto; padding:18px 16px 60px}
.gky-pv .scaler{transform-origin:top left; display:flex; flex-direction:column; gap:18px}
.gky-pv .scaler>.gky-page{flex:none}   /* 縮めて見せるときに、紙の高さがつぶれないように */
.gky-pv .msg{font-size:12px; color:var(--muted)}

/* 紙（印刷物）はテーマに関係なく白い紙に黒い字 */
.gky-page{position:relative; width:794px; height:1123px; background:var(--paper); color:var(--paper-ink); box-shadow:0 2px 10px rgba(0,0,0,.18);
  font-family:var(--f-doc); font-size:10pt; line-height:1.5; display:flex; flex-direction:column; padding:42px 44px 30px; overflow:hidden}
.gky-page.landscape{width:1123px; height:794px}
.gky-page .pg-head{flex:none; display:flex; align-items:flex-end; gap:12px; border-bottom:1.5px solid var(--paper-line); padding-bottom:6px; margin-bottom:10px}
.gky-page .pg-title{font-size:15pt; font-weight:700; letter-spacing:.04em}
.gky-page .pg-sub{font-size:9.5pt; color:var(--paper-mute); flex:1; text-align:right}
.gky-page .pg-body{flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:8px}
.gky-page .pg-foot{display:flex; justify-content:space-between; gap:12px; font-size:8pt; line-height:1.5; min-height:1.5em; color:var(--paper-mute); margin-top:8px; flex:none}
.gky-page h3{font-size:11.5pt; margin:4px 0 0; padding-left:7px; border-left:3px solid var(--paper-line)}
.gky-page h4{font-size:10pt; margin:2px 0 0}
.gky-page p{margin:0}
.gky-page .muted{color:var(--paper-mute)}
.gky-page table{border-collapse:collapse; width:100%; font-size:9pt; table-layout:fixed}
.gky-page th,.gky-page td{border:0.75px solid var(--paper-line); padding:3px 5px; vertical-align:top; overflow-wrap:anywhere}
.gky-page th{background:var(--paper-head); font-weight:700; text-align:left}
.gky-page td.num,.gky-page th.num{text-align:right; font-variant-numeric:tabular-nums}
.gky-page td.c,.gky-page th.c{text-align:center}
.gky-page .mark{background:var(--paper-mark)}
.gky-page .box{border:0.75px solid var(--paper-line); padding:6px 8px}
#gky-print-root{display:none}
@media print{
  body.gky-printing>*:not(#gky-print-root){display:none!important}
  body.gky-printing{background:#fff!important}
  body.gky-printing #gky-print-root{display:block}
  #gky-print-root .gky-page{box-shadow:none; margin:0; break-after:page; page-break-after:always}
  #gky-print-root .gky-page:last-child{break-after:auto; page-break-after:auto}
}
/* ---- 上の帯：ご意見・楽屋へのリンク ---- */
.gky-fb{display:inline-flex; align-items:center; font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap}
.gky-fb:hover{color:var(--ink); border-color:var(--line-strong)}
/* タブが画面の端で切れるとき、続きがあることを影で見せる */
.gky-tabs.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.gky-tabs.more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent)}
.gky-tabs.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent); mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent)}

/* ---- 文字を大きく（この端末の全部のツール） ---- */
:root[data-size="lg"] .gky-app,:root[data-size="lg"] .gky-veil,:root[data-size="lg"] .gky-toast,:root[data-size="lg"] .gky-pv>header{zoom:1.18}

/* ---- 表を、スマホでは1行ずつの札にする（table に cards をつける。td の data-l が見出し） ---- */
@media (max-width:640px){
  table.tbl.cards thead{display:none}
  table.tbl.cards,table.tbl.cards tbody,table.tbl.cards tfoot{display:block; width:100%}
  table.tbl.cards tr{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 10px; padding:10px 12px; border-bottom:1px solid var(--line)}
  table.tbl.cards tbody tr:last-child{border-bottom:0}
  table.tbl.cards td{display:block; border:0; padding:0; min-width:0}
  table.tbl.cards td[data-l]::before{content:attr(data-l); display:block; font-size:11px; color:var(--muted); margin-bottom:1px}
  table.tbl.cards td.wide{grid-column:1/-1}
  table.tbl.cards td.end{grid-column:1/-1; display:flex; justify-content:flex-end; gap:6px}
}

/* ---- 読み込む前に確かめる表 ---- */
.gky-pvt td,.gky-pvt th{vertical-align:top}
.gky-pvt tr.skip td{opacity:.5}
.gky-pvt .unk{display:inline-flex; align-items:center; height:20px; padding:0 7px; margin:1px 3px 1px 0; border-radius:4px; background:var(--bad-soft); color:var(--bad); font-size:11.5px; font-weight:700}
.gky-pvt .guess{display:inline-flex; align-items:center; height:20px; padding:0 7px; margin:1px 3px 1px 0; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:11.5px; font-weight:700}
.gky-pvt input[type=text]{min-width:7em}
.gky-pvt select{max-width:9em}

/* ---- 共有（見るだけのリンク・QRコード） ---- */
.gky-share{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.gky-share .qr svg{width:180px; height:180px; display:block; background:#fff; border-radius:8px; padding:6px; border:1px solid var(--line)}
.gky-share .url{flex:1 1 240px; min-width:0}
.gky-share textarea{font-family:var(--f-mono); font-size:11.5px; min-height:90px; word-break:break-all}
.gky-viewer{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 14px; margin-bottom:14px; border-radius:var(--r); background:var(--tape-soft); border:1px solid var(--tape-line); font-size:13px}
.gky-viewer b{font-size:14px}
.gky-viewer .sp{flex:1}

/* ---- ほかのタブとぶつかったとき・容量の目盛り ---- */
.gky-meter{height:10px; border-radius:5px; background:var(--surface-3); overflow:hidden; margin:6px 0}
.gky-meter i{display:block; height:100%; background:var(--ok); border-radius:5px}
.gky-meter.warn i{background:var(--warn)} .gky-meter.bad i{background:var(--bad)}

/* ---- 印刷のプレビューの上の帯（用紙） ---- */
.gky-pv>header select{min-height:32px; padding:2px 8px}
.gky-pdfopt{display:flex; flex-direction:column; gap:8px}

/* 代表者・顧問用／部員用：data-staff は代表者・顧問用の端末だけ、data-member は部員用の端末だけに出す */
:root[data-role="member"] [data-staff]{display:none!important}
:root:not([data-role="member"]) [data-member]{display:none!important}
.gky-gate{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px; background:color-mix(in srgb,var(--bg) 94%,transparent)}
.gky-gate .in{max-width:460px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:var(--shadow)}
.gky-gate h2{font-size:17px; margin:10px 0 6px; line-height:1.45}
.gky-gate p{margin:0 0 10px; font-size:13.5px}
/* 楽屋の本番の欄と札 */
.gky-cf>span small{font-weight:400; margin-left:4px}
a.gky-cchip{text-decoration:none; color:var(--ink); background:var(--tape-soft); border-color:var(--tape-line)}
a.gky-cchip:hover{border-color:var(--tape)}
/* 足す前に確かめる表：チェックした行をまとめてそろえる */
.gky-bulk{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 8px; padding:8px 10px; border-radius:var(--r); background:var(--surface-2); font-size:12.5px}
.gky-bulk select{width:auto; min-height:32px; padding:3px 6px; font-size:12.5px}

/* ==== 楽屋シリーズ 共通部品の見た目を元に戻す ここまで ==== */
/* ---------- バミリだけの見た目 ---------- */
:root{
  --bg:#EDEFEC; --panel:#FFFFFF; --ink:#1B211F; --muted:#5C6662; --line:#D4D9D6;
  --chip:#F3F5F3; --chip-h:#E6EAE7; --accent:#E3B23C; --accent-ink:#1B1A14; --danger:#C2412F;
  --stagebg:#16191C;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#111315; --panel:#1A1D20; --ink:#E7EBE9; --muted:#9AA39F; --line:#2D3236;
    --chip:#22262A; --chip-h:#2C3136; --danger:#E0664F; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#111315; --panel:#1A1D20; --ink:#E7EBE9; --muted:#9AA39F; --line:#2D3236;
  --chip:#22262A; --chip-h:#2C3136; --danger:#E0664F; }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:14px}
.shell{height:100%; display:flex; flex-direction:column; padding-inline:16px; padding-block:12px; box-sizing:border-box; gap:10px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:8px}
.brand b{font-size:20px; letter-spacing:.04em}
.brand .tape{display:inline-block; width:22px; height:8px; background:var(--accent); transform:rotate(-8deg); border-radius:1px}
.brand small{color:var(--muted); font-size:12px}
.titleIn{flex:1 1 220px; min-width:0; font:inherit; font-weight:700; font-size:15px; background:transparent; color:var(--ink); border:1px solid transparent; border-radius:6px; padding:6px 8px}
.titleIn:hover,.titleIn:focus{border-color:var(--line); background:var(--panel); outline:none}
.hbtns{display:flex; gap:6px; flex-wrap:wrap}
button{font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer}
button:hover,.btnLink:hover{background:var(--chip-h)}
.btnLink{display:inline-flex; align-items:center; font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 10px; text-decoration:none}
.btnLink:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button:disabled{opacity:.4; cursor:default}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--danger)}

.app{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:12px}
.stageCol{position:relative; min-height:0; display:flex; flex-direction:column; background:var(--stagebg); border-radius:10px; overflow:hidden}
.vp{flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch}
#svg{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none}
#svg .it{cursor:grab; touch-action:none}
#svg [data-handle]{cursor:alias; touch-action:none}
.ctl{position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none}
.ctl > *{pointer-events:auto}
.ctl button,.selbar button{background:rgba(30,34,38,.88); color:#E7EBE9; border-color:#3a4046; padding:5px 9px; font-size:13px}
.ctl button:hover,.selbar button:hover{background:rgba(52,58,64,.95)}
.ctl button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.zoomv{font-family:var(--mono); color:#C9CFD3; font-size:12px; align-self:center; min-width:40px; text-align:center}
.spacer{flex:1}
.selbar{position:absolute; left:8px; right:8px; bottom:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.selbar .tag{background:var(--accent); color:var(--accent-ink); font-weight:700; border-radius:6px; padding:5px 10px; font-size:13px; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.selbar button.danger{color:#F19A87}

aside{min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tabs{display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--line)}
.tabs button{border:0; border-radius:0; background:transparent; padding:10px 2px; color:var(--muted); font-weight:500; border-bottom:2px solid transparent; font-size:13px; white-space:nowrap}
.ctl select{background:rgba(30,34,38,.88); color:#E7EBE9; border:1px solid #3a4046; border-radius:6px; font:inherit; font-size:13px; padding:5px 6px; max-width:150px}
.layers{display:flex; flex-direction:column; gap:6px}
.lyr{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 6px 6px 8px; cursor:pointer}
.lyr.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--panel))}
.lyr.off{opacity:.55}
.lyr input.nm{font:inherit; font-weight:700; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:5px; padding:4px 6px; min-width:0; width:100%; box-sizing:border-box}
.lyr input.nm:focus{border-color:var(--line); background:var(--chip); outline:none}
.lyr .meta{font-size:11px; color:var(--muted); padding-left:6px}
.lyr .btns{display:flex; gap:3px}
.ib{padding:4px 6px; line-height:0; background:transparent; border-color:transparent}
.ib svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--chip-h); border-color:var(--line)}
.ib.warn[aria-pressed="true"]{color:var(--danger)}
.radio{width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); box-sizing:border-box}
.lyr.on .radio{border-color:var(--accent); background:radial-gradient(var(--accent) 45%, transparent 50%)}
.badge{font-size:11px; background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:1px 6px; font-weight:700}
.target{display:flex; align-items:center; gap:8px; font-size:13px; background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.target b{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bgThumb{width:100%; max-height:120px; object-fit:contain; background:var(--chip); border:1px solid var(--line); border-radius:6px}
input[type=range]{width:100%; accent-color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
.pane{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:16px}
.grp h3{margin:0 0 8px; font-size:11px; letter-spacing:.12em; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.dot{width:9px; height:9px; border-radius:2px; display:inline-block; border:1px solid rgba(0,0,0,.25)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{padding:5px 9px; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.hint{color:var(--muted); font-size:12px; line-height:1.6; margin:0}
.field{display:grid; grid-template-columns:88px 1fr; align-items:center; gap:8px}
.field label{color:var(--muted); font-size:12px}
.field input,.field select,textarea{font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; width:100%; box-sizing:border-box}
.num{font-family:var(--mono)}
.row{display:flex; gap:6px; flex-wrap:wrap}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.counts{display:flex; flex-wrap:wrap; gap:4px}
.counts span{font-size:12px; background:var(--chip); border:1px solid var(--line); border-radius:4px; padding:2px 6px}
.counts span b{font-family:var(--mono); margin-left:4px}
.total{font-size:13px}
.total b{font-family:var(--mono); font-size:18px}
.saves{display:flex; flex-direction:column; gap:6px}
.save{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:8px}
.save div{flex:1; min-width:0}
.save strong{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.save small{color:var(--muted); font-family:var(--mono); font-size:11px}
textarea{font-family:var(--mono); font-size:11px; height:90px; resize:vertical}
.check{display:flex; align-items:center; gap:8px}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#1B211F; color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30}
.toast.on{opacity:1}

.ov{position:fixed; inset:0; background:rgba(10,12,14,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
.ov .card{background:var(--panel); color:var(--ink); border-radius:12px; max-width:960px; width:100%; max-height:100%; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; box-sizing:border-box}
.ov img{width:100%; height:auto; border:1px solid var(--line); border-radius:6px; background:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{border:0; border-radius:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}

@media (max-width:820px){
  html,body{height:auto}
  .shell{height:auto}
  .app{display:flex; flex-direction:column}
  .stageCol{height:62vh; flex:none}
  aside{min-height:420px}
  .pane{overflow:visible}
}
.sheetOv{align-items:flex-end}
.sheetOv .card{max-width:560px; max-height:80vh; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dirgrid{display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,52px); gap:6px; justify-content:center}
.dirgrid button{font-size:22px; padding:0}
.dirgrid .mid{font-size:12px; font-weight:700; background:var(--accent); color:var(--accent-ink); border-color:transparent}
.sheetHead{display:flex; align-items:center; gap:8px}
.sheetHead strong{flex:1; font-size:16px}
.warnNote{margin:0; font-size:13px; line-height:1.6; padding:8px 10px; border-radius:8px; background:color-mix(in srgb, var(--danger) 12%, var(--panel)); color:var(--ink); border:1px solid color-mix(in srgb, var(--danger) 40%, var(--line))}
.guide{max-width:560px}
.guide .step{font-family:var(--mono); font-size:12px; color:var(--muted)}
.guide h2{margin:0; font-size:20px; text-wrap:balance}
.guide ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px; line-height:1.65}
.guide .dots{display:flex; gap:6px}
.guide .dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.guide .dots i.on{background:var(--accent)}
.fbLink{color:var(--ink); font-weight:700}
.survey{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:360px; left:auto; background:var(--panel); color:var(--ink); border:1px solid var(--accent); border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:15; display:flex; flex-direction:column; gap:10px}
.survey p{margin:0; font-size:13px; line-height:1.6}
.primaryLink{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
@media (max-width:520px){.survey{left:16px; right:16px; max-width:none}}
.about{border-top:1px solid var(--line); padding-top:12px}
.about h3{margin:0 0 6px; font-size:12px; letter-spacing:.1em; color:var(--muted)}
.about ul{font-size:12.5px; color:var(--muted); gap:4px}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

  /* ひらがな → カタカナ（「ぱーかす」も「パーカス」として読むため） */
  const kata = s => String(s ?? '').replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  /* 曲名などを見比べるための形（空白・記号・大文字小文字の違いをなくす） */
  const key = s => norm(s).toLowerCase().replace(/[\s・･「」『』（）()［］\[\]〈〉《》“”"'’‘、。,.:：;；!！?？~〜ー－―‐\-_/／]+/g, '');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  /* 少し待ってからまとめて実行する。ページを閉じる・ほかのアプリに切りかえるときは、待っている分をすぐ実行する（保存のもれを防ぐ） */
  const pendings = new Set();
  const debounce = (fn, ms = 400) => {
    let t = 0, args = [];
    const f = (...a) => { args = a; clearTimeout(t); pendings.add(f); t = setTimeout(() => { pendings.delete(f); fn(...args); }, ms); };
    f.flush = () => { if (!pendings.has(f)) return; clearTimeout(t); pendings.delete(f); fn(...args); };

  };
  const flushAll = () => [...pendings].forEach(f => f.flush());

  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });

  /* ---------- 時間と日付 ---------- */
  const pad = n => String(n).padStart(2, '0');
  /* 秒 → 8:43 */
  const clock = s => { if (s == null || !isFinite(s)) return '—'; s = Math.round(s); const neg = s < 0; s = Math.abs(s); const m = Math.floor(s / 60), r = s % 60; return (neg ? '−' : '') + (m >= 60 ? Math.floor(m / 60) + ':' + pad(m % 60) : m) + ':' + pad(r); };
  /* 秒 → 8'43" （吹奏楽の資料でよく使う書き方） */
  const dur = s => { if (s == null || !isFinite(s)) return ''; s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m + "'" + pad(r) + '"'; };
  /* 8:43 / 8'43" / 8分43秒 / 523 → 秒。読めないときは null */
  function parseDur(v) {
    const t = norm(v).replace(/\s/g, '');
    if (!t) return null;
    let m;
    if ((m = t.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return +m[1] * 3600 + +m[2] * 60 + +m[3];
    if ((m = t.match(/^(\d+)[:'′分](\d{1,2})(?:["″秒]|'')?$/))) return +m[1] * 60 + +m[2];
    if ((m = t.match(/^(\d+)[分'′]$/))) return +m[1] * 60;
    if ((m = t.match(/^(\d+(?:\.\d+)?)秒?$/))) return Math.round(+m[1]);
    return null;
  }
  const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const jpDate = (s, withWeek = true) => { const d = typeof s === 'string' ? parseYmd(s) : s; if (!d) return ''; return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' + (withWeek ? '（' + WD[d.getDay()] + '）' : ''); };
  const mdDate = (s) => { const d = typeof s === 'string' ? parseYmd(s) : s; if (!d) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; };
  const addDays = (s, n) => { const d = parseYmd(s); if (!d) return ''; d.setDate(d.getDate() + n); return ymd(d); };
  const daysBetween = (a, b) => { const x = parseYmd(a), y = parseYmd(b); if (!x || !y) return null; return Math.round((y - x) / 86400000); };
  /* 4月はじまりの年度 */
  const fiscalYear = (d = new Date()) => d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  const stamp = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); };

  /* ---------- ブラウザへの保存（この端末の中だけ） ---------- */
  /* 1つの場所（例：bamiriunei-arch.github.io）で保存できる量の、おおよその上限（文字の数）。ブラウザによって少しちがいます */
  const LIMIT = 5000000;
  const guards = {};
  let usageAt = 0, usageWarned = false;
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  function setRaw(k, raw) {
    const g = guards[k];
    if (g) {
      // ほかのタブとぶつかって、どちらにするか聞いているあいだは、最後の内容だけ覚えておく
      if (g.conflict) { g.pending = raw; return true; }
      const now = lsGet(k);
      if (now !== g.last && now !== raw) { conflict(k, raw); return true; }
    }
    try { localStorage.setItem(k, raw); } catch (e) { return false; }
    if (g) g.last = raw;
    touch(k);
    watchUsage();
    return true;
  }
  /* キーごとの、最後に保存した時刻（gakuya.mtime。消したときはマイナス）。同期ファイルで、どちらの端末の内容が新しいかを決めるのに使う
     表示の好み・見るだけのリンクの記録・しまってある団体・ログインの記録は数えない */
  const MT_KEY = 'gakuya.mtime';
  const noMtime = k => !/^[a-z]+\./.test(k) || k === MT_KEY || k === 'gakuya.ui' || k === 'gakuya.profiles' || /^gakuya\.(profile|view)\./.test(k) || /\.(ui|live|probe|auth|survey)$/.test(k) || /\.view\./.test(k);
  function touch(k, t = Date.now()) {
    if (noMtime(k)) return;
    try { const m = JSON.parse(localStorage.getItem(MT_KEY) || '{}') || {}; m[k] = t; localStorage.setItem(MT_KEY, JSON.stringify(m)); } catch (e) { /* 数えなくても動く */ }
  }
  const store = {
    get(k, d = null) { const v = lsGet(k); if (v == null) return d; try { return JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { return setRaw(k, JSON.stringify(v)); },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 使えない環境 */ } if (guards[k]) guards[k].last = null; touch(k, -Date.now()); },
    keys() { try { return Object.keys(localStorage); } catch (e) { return []; } },
    raw: lsGet,
    setRaw,
    touch,
    mtimes() { try { return JSON.parse(localStorage.getItem(MT_KEY) || '{}') || {}; } catch (e) { return {}; } },
    noMtime,
  };
  /* 保存している量（文字の数）。by はキーの頭（gakuya・kouban など）ごと */
  function usage() {
    let used = 0; const by = {};
    store.keys().forEach(k => { const n = k.length + (lsGet(k) || '').length; used += n; const p = k.split('.')[0]; by[p] = (by[p] || 0) + n; });
    return { used, limit: LIMIT, ratio: used / LIMIT, by };
  }
  function watchUsage() {
    if (usageWarned || Date.now() - usageAt < 20000) return;

    usageWarned = true;
    setTimeout(() => toast(`この端末で保存できる量の${Math.round(u.ratio * 100)}%ほどを使っています。楽屋の「バックアップ」で使っている量を確かめ、ファイルに保存しておいてください`, null, null, 9000), 500);
  }
  /* 同じツールを2つのタブで開いたとき：
     ・ほかのタブで保存されたら、こちらで直している途中でなければ、新しい内容を読み直す（reload）
     ・こちらで直している途中に、ほかのタブが先に保存していたら、どちらを残すか聞く（黙って上書きしない） */
  function guard(k, reload) {
    const g = guards[k] = { last: lsGet(k), reload, conflict: false, pending: null };
    const adopt = () => {
      const now = lsGet(k);
      if (now === g.last || g.conflict || pendings.size) return;
      g.last = now; reload();
      toast('ほかのタブ（またはほかの画面）で変わったので、新しい内容にしました');

      actions: [
        { label: 'ほかのタブの内容にする', onClick: () => { g.conflict = false; g.pending = null; g.last = lsGet(k); if (g.reload) g.reload(); toast('ほかのタブの内容にしました'); } },
        { label: 'ここの内容で上書きする', primary: true, onClick: () => { const r = g.pending; g.conflict = false; g.pending = null; g.last = lsGet(k); if (r != null && !setRaw(k, r)) toast('保存できませんでした（容量がいっぱいかもしれません）'); else toast('ここの内容で保存しました'); } },
      ],

  }

  /* どの楽器か決めきれない呼び方（読み込む前の確かめで「これでよいか」を聞く） */
  const GUESS = new Set(['サックス', 'sax', 'サクソフォン', 'サキソフォン', 'ベース', 'キーボード', 'キーボ']);
  /* 入力された名前を記号にそろえる（わからなければそのまま） */
  function partOf(v) {
    const t = norm(v);
    if (!t) return '';
    if (PART_CODES.has(t) || PERC_CODES.has(t)) return t;
    const k = t.toLowerCase().replace(/\s/g, ''), kk = kata(k);

  const familyOf = label => { const b = baseOf(label); return PERC_CODES.has(b) ? 'Perc' : b; };
  const partName = code => { const p = PARTS.find(x => x[0] === code) || PERC.find(x => x[0] === code); return p ? p[1] : code; };
  const sectionOf = code => { const f = familyOf(code); const p = PARTS.find(x => x[0] === f); return p ? p[2] : 'etc'; };
  const partOrder = code => { const f = familyOf(code); const i = PARTS.findIndex(x => x[0] === f); const j = PERC.findIndex(x => x[0] === baseOf(code)); return (i < 0 ? 900 : i * 10) + (j < 0 ? 0 : j / 100); };
  /* 名簿の「楽器」の言葉 → { part（いつもの楽器）, subs（持ち替え）, guess（決めきれない呼び方）}。楽器と読めなければ null

  function readPart(token) {

  /* ---------- 団体の種類・学年・進級・呼び方 ---------- */
  const ORG_TYPES = { chu: '中学校', koko: '高校', chuko: '中高一貫', daigaku: '大学', ippan: '一般の団体', chiiki: '地域クラブ' };
  const GRADES = ['小4', '小5', '小6', '中1', '中2', '中3', '高1', '高2', '高3', '大学', '一般'];
  const GRADE_SETS = {

    daigaku: ['大1', '大2', '大3', '大4', '院1', '院2'], chiiki: GRADES, ippan: [],
  };
  /* 学年の並べ方（学年の早い順） */
  const GRADE_ORDER = ['小1', '小2', '小3', '小4', '小5', '小6', '中1', '中2', '中3', '高1', '高2', '高3', '大1', '大2', '大3', '大4', '大5', '大6', '院1', '院2', '院3', '博1', '博2', '博3', '大学', '一般'];
  const gradeRank = g => { const i = GRADE_ORDER.indexOf(norm(g)); return i < 0 ? -1 : i; };
  /* 部員の状態。在籍・エキストラ・賛助の人は、パート割りの候補に入る（active） */
  /* 仮引退：ふだんの練習には出ないが、本番によっては出る人（コンクールのあとの3年生など）。パート割りの候補には、ツールで選んだときだけ入れる */
  const STATUS = { active: '在籍', semi: '仮引退', leave: '休部', retired: '引退', extra: 'エキストラ', support: '賛助・OB/OG', gone: '卒業・退部' };
  const PLAYS = new Set(['active', 'extra', 'support']);
  /* 楽屋の団体の種類（まだ決めていなければ ''） */
  let typeCache = [undefined, ''];
  const orgType = () => { const raw = lsGet(ORG_KEY); if (raw !== typeCache[0]) { let t = ''; try { const o = JSON.parse(raw || '{}'); t = o && o.org && ORG_TYPES[o.org.type] ? o.org.type : ''; } catch (e) { t = ''; } typeCache = [raw, t]; } return typeCache[1]; };
  const gradesOf = (type = orgType()) => GRADE_SETS[type] || GRADES;
  const gradeLabel = g => { const m = String(g || '').match(/^大([1-6])$/); return m ? `${g}（${m[1]}回生）` : g; };
  /* 呼び方：学校は「部員」「顧問」、一般・地域クラブは「団員」 */
  function words(type = orgType()) {
    const adult = type === 'ippan' || type === 'chiiki';
    return { member: adult ? '団員' : '部員', staff: type === 'ippan' ? '団長' : type === 'chiiki' ? '代表' : type === 'daigaku' ? '幹部' : '顧問',
      leave: adult ? '休団' : '休部', gone: adult ? '退団' : '卒業・退部', club: adult ? '団' : '部' };
  }
  const statusName = (st, type = orgType()) => st === 'leave' ? words(type).leave : st === 'gone' ? words(type).gone : (STATUS[st] || st);
  const isSchool = (type = orgType()) => ['chu', 'koko', 'chuko'].includes(type);
  /* 次の年度の学年（いなくなるときは ''）。cont：中3から高1に続ける（中高一貫・地域クラブ） */
  function nextGradeOf(g, type = orgType(), { cont = type === 'chuko' } = {}) {
    const t = norm(g); let m;
    if ((m = t.match(/^小([1-6])$/))) return +m[1] < 6 ? '小' + (+m[1] + 1) : '中1';
    if ((m = t.match(/^中([1-3])$/))) return +m[1] < 3 ? '中' + (+m[1] + 1) : (cont ? '高1' : '');
    if ((m = t.match(/^高([1-3])$/))) return +m[1] < 3 ? '高' + (+m[1] + 1) : '';
    if ((m = t.match(/^大([1-6])$/))) return +m[1] === 4 || +m[1] === 6 ? '' : '大' + (+m[1] + 1);
    if ((m = t.match(/^院([1-3])$/))) return +m[1] < 2 ? '院' + (+m[1] + 1) : '';
    if ((m = t.match(/^博([1-3])$/))) return +m[1] < 3 ? '博' + (+m[1] + 1) : '';
    return t;
  }
  const nextGrade = g => nextGradeOf(g, '', { cont: false });
  /* その学年が「あと何年でいなくなるか」（中3・高3は今年度で終わり＝0）。わからなければ null */
  function yearsLeft(grade) {
    const g = norm(grade);
    let m;
    if ((m = g.match(/^小([1-6])$/))) return 6 - +m[1] + 3; // 中学まで続けると考える
    if ((m = g.match(/^中([1-3])$/))) return 3 - +m[1];
    if ((m = g.match(/^高([1-3])$/))) return 3 - +m[1];
    if ((m = g.match(/^大([1-4])$/))) return 4 - +m[1];
    return null;
  }
  /* 学年の書き方をそろえる：「1年生」「2回生」「大3」「院1」「中学2年」など → { grade, sure }。学年と読めなければ null
     「2年」だけのときは、団体の種類で中学・高校・大学を決める（決められないときは sure:false） */
  function readGrade(token, type = orgType()) {
    const t = norm(token).replace(/\s/g, '');
    if (!t) return null;
    let m;
    const ok = g => ({ grade: g, sure: true });
    if ((m = t.match(/^(小|中|高)(?:学校?)?([1-6])(?:年生?)?$/)) || (m = t.match(/^(小学|中学|高校)([1-6])年生?$/))) { const k = m[1][0], n = +m[2]; return (k === '小' || n <= 3) ? ok(k + n) : null; }
    if ((m = t.match(/^大(?:学)?([1-6])(?:年生?|回生?)?$/)) || (m = t.match(/^([1-6])回生?$/))) return ok('大' + m[1]);
    if ((m = t.match(/^(?:院|M|修士)([1-3])(?:年生?|回生?)?$/i))) return ok('院' + m[1]);
    if ((m = t.match(/^(?:D|博士)([1-3])(?:年生?)?$/i))) return ok('博' + m[1]);
    if ((m = t.match(/^([1-6])年(?:生)?$/))) {
      const n = +m[1];
      if (type === 'chu' && n <= 3) return ok('中' + n);
      if (type === 'koko' && n <= 3) return ok('高' + n);
      if (type === 'daigaku') return ok('大' + n);
      return { grade: '', sure: false, n };
    }
    if (/^(一般|社会人)$/.test(t)) return { grade: type === 'ippan' || type === 'daigaku' ? '' : '一般', sure: true };
    if (/^大学生?$/.test(t)) return type === 'daigaku' ? { grade: '', sure: false } : ok('大学');
    if (GRADE_ORDER.includes(t)) return ok(t);
    return null;
  }
  const STATUS_WORDS = [[/^(在籍|現役)$/, 'active'], [/^(仮引退|半引退)$/, 'semi'], [/^(休部|休団|休み中)$/, 'leave'], [/^引退$/, 'retired'], [/^(トラ|エキストラ|助っ人|ヘルプ)$/i, 'extra'],
    [/^(賛助|OB|OG|OB\/?OG|OG\/?OB|ＯＢ|ＯＧ)$/i, 'support'], [/^(卒業|退部|退団|退会)$/, 'gone']];
  const readStatus = token => { const t = norm(token); for (const [re, st] of STATUS_WORDS) if (re.test(t)) return st; return null; };
  const ROLE_WORDS = ['部長', '副部長', '団長', '副団長', '代表', '副代表', '主将', '学指揮', '学生指揮者', '指揮者', '幹部', 'パートリーダー', 'パーリー', 'PL', 'セクションリーダー',
    'コンマス', 'コンミス', 'ライブラリアン', '楽譜係', '楽器係', '会計', '渉外', '広報', '記録', 'マネージャー', 'マネ', '係長', 'インスペクター', 'トレーナー'];
  const ROLE_HINTS = { chu: ['部長', '副部長', 'パートリーダー', '楽器係', '楽譜係', '会計'], koko: ['部長', '副部長', '学生指揮者', 'パートリーダー', 'セクションリーダー', '楽器係', '楽譜係', '会計'],
    chuko: ['部長', '副部長', '学生指揮者', 'パートリーダー', '楽器係', '楽譜係'], daigaku: ['部長', '副部長', '学指揮', '幹部', 'パートリーダー', 'ライブラリアン', '楽器係', '会計', '渉外', '広報'],
    ippan: ['団長', '副団長', '指揮者', 'インスペクター', 'パートリーダー', 'ライブラリアン', '楽器係', '会計', '渉外', '広報'], chiiki: ['代表', '副代表', '指揮者', 'パートリーダー', '楽器係', '会計'] };
  const roleHints = (type = orgType()) => ROLE_HINTS[type] || ROLE_HINTS.koko;
  const readRole = token => { const t = norm(token); return ROLE_WORDS.find(r => r.toLowerCase() === t.toLowerCase()) ? (t === 'パーリー' || t.toUpperCase() === 'PL' ? 'パートリーダー' : t === 'マネ' ? 'マネージャー' : t) : null; };
  const readJoined = token => { const t = norm(token); const m = t.match(/^(?:入団|入部|入会)?((?:19|20)\d\d)年?(?:度)?(?:入団|入部|入会)?$/); return m && /入|^(19|20)\d\d年?度?$/.test(t) ? +m[1] : null; };
  /* 漢字の名前（3文字以上）のあとのカタカナだけの言葉は、名前ではなく「読めなかった言葉」として扱う（例：「田中一郎 カホン」） */
  const looksNotName = (first, second) => /[一-鿿]/.test(first) && [...first].length >= 3 && /^[゠-ヿー・]+$/.test(second);
  /* 1行に1人の書き方（「山田 花子 中2 クラリネット」など）を読む。読めなかった言葉は unknown に入れて、名前にはつけない */
  function parseMemberLine(line, type = orgType()) {
    const toks = norm(line).split(/[\s,，、\t]+/).filter(Boolean);
    const r = { name: '', kana: '', grade: '', part: '', subs: [], status: 'active', roles: [], joined: null, note: '', unknown: [], guess: [], askGrade: false };
    const nameT = []; let seen = false;
    toks.forEach(x => {
      let v;
      if (!r.grade && !r.askGrade && (v = readGrade(x, type))) { r.grade = v.grade; if (!v.sure) { r.askGrade = true; r.guess.push(x); } seen = true; return; }
      if ((v = readPart(x))) { if (!r.part) { r.part = v.part; r.subs.push(...v.subs); } else r.subs.push(v.part, ...v.subs); if (v.guess) r.guess.push(x); seen = true; return; }
      if ((v = readStatus(x))) { r.status = v; r.stSet = true; seen = true; return; }
      if ((v = readRole(x))) { if (!r.roles.includes(v)) r.roles.push(v); seen = true; return; }
      if ((v = readJoined(x))) { r.joined = v; seen = true; return; }
      if (!seen && nameT.length < 2 && !(nameT.length === 1 && looksNotName(nameT[0], x))) { nameT.push(x); return; }
      r.unknown.push(x);
    });
    r.name = nameT.join(' ');
    r.subs = [...new Set(r.subs.filter(s => s && s !== r.part))];

  }
  /* CSV・Excelの行 → 部員の読み取り結果（parseMemberLine と同じ形）。1行目が見出しなら、見出しの名前で列を見つける */
  function membersFromRows(rows, type = orgType()) {
    rows = (rows || []).filter(r => r && r.some(x => norm(x)));
    if (!rows.length) return [];
    const head = rows[0].map(norm);
    const hasHead = head.some(x => /名前|氏名|なまえ|^name$/i.test(x));
    if (!hasHead && rows.every(r => r.filter(x => norm(x)).length <= 1)) return rows.map(r => parseMemberLine(r.find(x => norm(x)) || '', type)).filter(r => r.name || r.unknown.length);
    const ci = re => head.findIndex(x => re.test(x));
    const c = hasHead ? { name: ci(/名前|氏名|なまえ|^name$/i), kana: ci(/よみ|読み|ふりがな|フリガナ|カナ/), grade: ci(/学年|回生/), part: head.findIndex(x => /パート|楽器/.test(x) && !/持ち替え|サブ|係/.test(x)), subs: ci(/持ち替え|サブ/),
      status: ci(/状態|在籍/), roles: ci(/^役職|^係$|^役$|担当係/), joined: ci(/入団|入部|入会/), note: ci(/メモ|備考/) } : { name: 0, kana: -1, grade: 1, part: 2, subs: 3, status: -1, roles: -1, joined: -1, note: -1 };
    if (c.subs === c.part) c.subs = -1;
    return rows.slice(hasHead ? 1 : 0).map(row => {
      const g = k => c[k] >= 0 ? norm(row[c[k]]) : '';
      const r = { name: g('name').replace(/\s+/g, ' '), kana: g('kana'), grade: '', part: '', subs: [], status: 'active', roles: [], joined: null, note: g('note'), unknown: [], guess: [], askGrade: false };
      let gr = g('grade');
      if (/^[1-6]$/.test(gr)) gr += '年';   // 「2」だけのときは「2年」として読む
      if (gr) { const v = readGrade(gr, type); if (v) { r.grade = v.grade; if (!v.sure) { r.askGrade = true; r.guess.push(gr); } } else { const st = readStatus(gr); if (st) r.status = st; else r.unknown.push('学年「' + gr + '」'); } }
      const pt = g('part');
      if (pt) { const v = readPart(pt); if (v) { r.part = v.part; r.subs.push(...v.subs); if (v.guess) r.guess.push(pt); } else r.unknown.push('楽器「' + pt + '」'); }
      g('subs').split(/[、,・\/／\s]+/).filter(Boolean).forEach(x => { const v = readPart(x); if (v) r.subs.push(v.part, ...v.subs); else r.unknown.push('持ち替え「' + x + '」'); });
      const st = g('status');
      if (st) { r.stSet = true; if (/^(○|〇|◯|はい|yes|true|1|在籍)$/i.test(st)) r.status = 'active'; else if (/^(×|✕|いいえ|no|false|0|-)$/i.test(st)) r.status = 'gone'; else { const v = readStatus(st); if (v) r.status = v; else { r.stSet = false; r.unknown.push('状態「' + st + '」'); } } }
      g('roles').split(/[、,・\/／\s]+/).filter(Boolean).forEach(x => r.roles.push(readRole(x) || x));
      const jn = g('joined'); if (jn) { const y = +(jn.match(/(19|20)\d\d/) || [0])[0]; if (y) r.joined = y; else r.unknown.push('入団「' + jn + '」'); }

  }
  /* 足す前に確かめる画面。recs は parseMemberLine・membersFromRows の結果。
     読めなかった言葉・決めきれない呼び方・同じ名前の人を知らせ、学年・楽器・状態をその場で直せる。onAdd(部員の配列) で足す */
  function previewMembers(recs, { existing = [], type = orgType(), title = '足す前に確かめる', onAdd, source = '' } = {}) {
    const have = new Set(existing.map(m => norm(m.name).replace(/\s+/g, '')));

    const sOpts = cur => Object.keys(STATUS).map(k => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(statusName(k, type))}</option>`).join('');
    const issues = r => [
      ...r.unknown.map(x => `<span class="unk" title="楽器・学年などとして読めなかった言葉">${esc(x)}</span>`),
      ...r.guess.map(x => `<span class="guess" title="決めきれない書き方なので、合っているか確かめてください">${esc(x)}${r.askGrade && x === r.guess[0] && !r.grade ? '：学年を選んでください' : '：これでよいか確かめて'}</span>`),
      r.dup ? `<span class="guess">同じ名前の人がもういます</span>` : '', r.twice ? `<span class="guess">この中に同じ名前が2回あります</span>` : '', !r.name ? '<span class="unk">名前がありません</span>' : '',
    ].join('');
    const nBad = rows.filter(r => r.unknown.length || r.guess.length || !r.name).length, nDup = rows.filter(r => r.dup || r.twice).length;
    const askType = !type && rows.some(r => r.askGrade);
    const sh = sheet({ title, wide: true, content: `<p class="lead" style="margin-bottom:8px">${source ? esc(source) + 'から' : ''}${rows.length}行を読みました。<b>まだ足していません。</b>名前・学年・楽器が正しいか確かめて、直してから「足す」を押してください。${nBad ? `<br><span style="color:var(--bad)">気になる所が${nBad}行あります（赤は読めなかった言葉で、名前にはつけていません）。</span>` : ''}${nDup ? `<br>同じ名前の${nDup}人は、チェックを外しています（足すときはチェックを入れてください）。` : ''}${askType ? '<br>楽屋の「団体・年度」で団体の種類（中学校・高校など）を選ぶと、「1年」「2年」も読めるようになります。' : ''}</p>
      <div class="gky-bulk" role="group" aria-label="チェックした行をまとめてそろえる"><span class="muted">チェックした行を</span>${type === 'ippan' ? '' : `<select data-b="grade" aria-label="学年をそろえる"><option value="">学年はそのまま</option>${grades.map(g => `<option value="${esc(g)}">${esc(gradeLabel(g))}にする</option>`).join('')}</select>`}<select data-b="part" aria-label="楽器をそろえる"><option value="">楽器はそのまま</option>${PARTS.map(p => `<option value="${esc(p[0])}">${esc(p[1])}にする</option>`).join('')}</select><select data-b="status" aria-label="状態をそろえる"><option value="">状態はそのまま</option>${Object.keys(STATUS).map(k => `<option value="${k}">${esc(statusName(k, type))}にする</option>`).join('')}</select><button type="button" class="btn sm" data-b="go">そろえる</button></div>
      <div class="tbl-wrap" style="max-height:min(52vh,500px);overflow:auto"><table class="tbl gky-pvt cards"><thead><tr><th>足す</th><th>名前</th><th>${type === 'ippan' ? '入団した年' : '学年'}</th><th>いつもの楽器</th><th>持ち替え</th><th>役職</th><th>状態</th><th>気になる所</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr data-i="${i}" class="${r.on ? '' : 'skip'}"><td data-l="足す"><input type="checkbox" data-k="on" ${r.on ? 'checked' : ''} aria-label="足す" style="width:18px;height:18px;accent-color:var(--tape)"></td>
        <td data-l="名前"><input type="text" data-k="name" value="${esc(r.name)}" aria-label="名前"></td>
        <td data-l="${type === 'ippan' ? '入団した年' : '学年'}">${type === 'ippan' ? `<input type="number" data-k="joined" value="${r.joined || ''}" min="1950" max="2100" style="width:6em" aria-label="入団した年">` : `<select data-k="grade" aria-label="学年">${gOpts(r.grade)}</select>`}</td>
        <td data-l="いつもの楽器"><select data-k="part" aria-label="いつもの楽器">${pOpts(r.part)}</select></td>

      actions: [{ label: 'やめる' }, { label: '足す', primary: true, onClick: body => {
        const out = [];

    $$('tr[data-i] [data-k="on"]', sh.body).forEach(cb => cb.onchange = () => { cb.closest('tr').classList.toggle('skip', !cb.checked); });
    $('[data-b="go"]', sh.body).onclick = () => {
      const pick = k => { const el = $(`[data-b="${k}"]`, sh.body); return el ? el.value : ''; };
      const g = pick('grade'), p = pick('part'), st = pick('status');
      if (!g && !p && !st) { toast('そろえる学年・楽器・状態を選んでください'); return; }
      let n = 0;
      $$('tr[data-i]', sh.body).forEach(tr => {
        if (!$('[data-k="on"]', tr).checked) return; n++;
        const set = (k, v) => { const el = $(`[data-k="${k}"]`, tr); if (el && v) el.value = v; };
        set('grade', g); set('part', p); set('status', st);

  /* ---------- 楽屋の本番（演奏会・コンクール・行事） ----------

  /* ---------- ファイルの保存 ---------- */

  const ARTIFACT_URLS = {

    tempomap: 'https://claude.ai/artifact/D2DUbaya4JnAAzS8vsz5y4', shikomi: 'https://claude.ai/artifact/YBMKzc5FAZ8B34M1wYUJfB', gakki: 'https://claude.ai/artifact/TuGJ5xpuFiEpVd2KvMjL9D',
    gakkigime: 'https://claude.ai/artifact/8tfAUVsrJtAaa3R7vySdoT', hannyu: 'https://claude.ai/artifact/3fyJu1o9RddSKB9eM7QpQD', gassou: 'https://claude.ai/artifact/C1MVhJa5BJVGh3w3uDav7G',
    gyakusan: 'https://claude.ai/artifact/5LtSnDWu6cr6KMkYzkigmc', stagemane: 'https://claude.ai/artifact/4YA7JtN5SSCkT3TUS1Sfkm',
  };
  const PAGES_BASE = 'https://bamiriunei-arch.github.io/';
  const ON_PAGES = () => /\.github\.io$/.test(location.hostname) || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  function linkTo(slug) {
    if (IN_VIEWER) return ARTIFACT_URLS[slug] || PAGES_BASE + slug + '/';
    if (ON_PAGES()) return '../' + slug + '/';
    return PAGES_BASE + slug + '/';
  }
  /* 同じツールは同じタブで開く（押すたびに新しいタブが増えて、2つのタブで上書きし合わないように） */
  const targetOf = slug => 'gky-' + slug;
  /* ホーム画面に追加した「楽屋」のアプリの中（standalone）では、同じ場所のツールは同じ画面で開く
     （新しいタブにすると、iPhone ではアプリの外の Safari の小さな画面が開いてしまうため） */
  const STANDALONE = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
  if (STANDALONE) document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[target]'); if (!a || !a.href) return; try { if (new URL(a.href, location.href).origin === location.origin) a.removeAttribute('target'); } catch (er) { /* そのまま */ } }, true);
  /* いま開いているツール（フォルダの名前）。楽屋の「つづきから」に使う */
  const SLUG = (location.pathname.match(/\/([a-z]+)\/(?:index\.html)?$/) || [])[1] || '';
  /* このツールの公開ページのアドレス（見るだけのリンクやQRに使う） */
  const pageUrl = slug => (!IN_VIEWER && ON_PAGES()) ? location.origin + location.pathname : PAGES_BASE + slug + '/';

  /* ---------- 印刷とPDF ---------- */
  /* 使い方：
       const d = GKY.doc({ title:'香盤表', sub:'定期演奏会', orient:'landscape', foot:'団体名', file:'香盤表' });
       d.block('<h3>…</h3><p>…</p>');            ページに入りきらなければ次のページへ
       d.block('<h3>見出し</h3>', { keep:true });  次の中身と同じページに置く（見出しだけ前のページに残らない）
       d.table({ cols:[{h:'名前', w:'20%'}], rows:[['山田']] });   行がはみ出たら見出しをつけて次のページへ
       d.page();                                  ここでページを変える
       d.show();                                  プレビューを開く（用紙 A4・B4・A3 を選べる。印刷・PDF保存のボタンつき）
     中身は覚えておき、用紙を変えたときは並べ直します。
     用紙によって中身を変えたいとき（大きい紙なら1ページに曲を多く、など）は build を渡す：
       GKY.doc({ title:'香盤表', build:(d, paper) => { … d.table(…) … } }).show();   paper は 'A4' | 'B4' | 'A3' */
  const H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  const loadScript = src => new Promise((res, rej) => { if (document.querySelector('script[src="' + src + '"]')) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(new Error('load')); }; document.head.appendChild(s); });
  /* 用紙（mm）。B4 は日本でふつうに使う JIS の B4 */
  const PAPERS = { A4: [210, 297], B4: [257, 364], A3: [297, 420] };
  const mmpx = mm => Math.round(mm / 25.4 * 96);
  function doc({ title = '', sub = '', orient = 'portrait', foot = '', file = '', size = '', build = null, head = true } = {}) {
    const ops = [];
    const pkey = 'paper.' + (title || 'doc');
    let paper = PAPERS[size] ? size : pref(pkey, 'A4');
    if (!PAPERS[paper]) paper = 'A4';
    let pv = null, scaler = null, pages = [];
    const dims = () => { const [a, b] = PAPERS[paper]; return orient === 'landscape' ? { w: b, h: a } : { w: a, h: b }; };
    /* 中身をページに並べる（はみ出たら次のページへ） */
    function render() {
      const { w, h: hh } = dims(), W = mmpx(w), H = mmpx(hh);
      if (build) { ops.length = 0; build(api, paper); }
      scaler.innerHTML = ''; pages = [];
      let body = null;
      const newPage = () => {
        const p = h(`<div class="gky-page${orient === 'landscape' ? ' landscape' : ''}" style="width:${W}px;height:${H}px">${head ? `<div class="pg-head"><div class="pg-title">${esc(title)}</div><div class="pg-sub">${esc(sub)}</div></div>` : ''}<div class="pg-body"></div><div class="pg-foot"><span>${esc(foot)}</span><span class="pg-no">&nbsp;</span></div></div>`);
        body = $('.pg-body', p); scaler.appendChild(p); pages.push(p); return p;
      };
      // 最後の中身の下の端が、ページの書ける所の下の端（少しゆとりを残す）を越えたら「はみ出し」
      const over = () => { const last = body.lastElementChild; if (!last) return false; const br = body.getBoundingClientRect(), lr = last.getBoundingClientRect(); return lr.bottom > br.bottom - 4 * (br.height / body.clientHeight || 1); };
      /* el を次のページへ移す。すぐ前に「次といっしょに」の見出しがあれば、それもいっしょに */
      const carry = el => { const prev = el.previousElementSibling; const keep = prev && prev.dataset.keep && prev.previousElementSibling ? prev : null; el.remove(); if (keep) keep.remove(); newPage(); if (keep) body.appendChild(keep); body.appendChild(el); };
      newPage();
      ops.forEach(op => {
        if (op.t === 'page') { if (body.childElementCount) newPage(); return; }
        if (op.t === 'block') {
          const el = h('<div>' + op.html + '</div>');
          if (op.keep) el.dataset.keep = '1';
          body.appendChild(el);
          if (over() && body.childElementCount > 1) carry(el);
          return;
        }
        const { cols, rows, cls = '', caption = '' } = op.spec;
        const colg = '<colgroup>' + cols.map(c => `<col${c.w ? ` style="width:${c.w}"` : ''}>`).join('') + '</colgroup>';
        const head = '<thead><tr>' + cols.map(c => `<th class="${c.cls || ''}">${c.h}</th>`).join('') + '</tr></thead>';
        const mk = () => { const wrap = h(`<div>${caption ? `<h4>${caption}</h4>` : ''}<table class="${cls}">${colg}${head}<tbody></tbody></table></div>`); body.appendChild(wrap); return $('tbody', wrap); };
        let tb = mk();
        // 見出しの行と最初の1行が入らなければ、表ごと次のページへ
        const probe = document.createElement('tr'); probe.innerHTML = '<td>&nbsp;</td>'; tb.appendChild(probe);
        if (over() && body.childElementCount > 1) carry(tb.closest('div'));
        probe.remove();
        rows.forEach(r => {
          const tr = document.createElement('tr');
          if (r && r.cls) tr.className = r.cls;
          const cells = Array.isArray(r) ? r : r.cells;
          tr.innerHTML = cells.map((c, i) => `<td class="${(cols[i] && cols[i].cls) || ''}"${c && c.span ? ` colspan="${c.span}"` : ''}>${c && typeof c === 'object' ? c.html : (c ?? '')}</td>`).join('');
          tb.appendChild(tr);
          if (over() && tb.children.length > 1) { tr.remove(); newPage(); tb = mk(); tb.appendChild(tr); }
        });
      });
      if (pages.length > 1 && !body.childElementCount) { pages.pop().remove(); }
      // ページ番号は最後に書く（下の欄は高さが決まっているので、書いても本文の高さは変わらない）
      pages.forEach((p, i) => { $('.pg-no', p).textContent = pages.length > 1 ? (i + 1) + ' / ' + pages.length : ' '; });
    }
    const api = {
      page() { ops.push({ t: 'page' }); return api; },
      block(html, { keep = false } = {}) { ops.push({ t: 'block', html: typeof html === 'string' ? html : html.outerHTML, keep }); return api; },
      table(spec) { ops.push({ t: 'table', spec }); return api; },
      async show() {
        pv = h(`<div class="gky-pv" role="dialog" aria-modal="true" aria-label="${esc(title)}の印刷"><header><h2>${esc(title)}<span class="msg" style="margin-left:10px"></span></h2>
          <div class="btnrow"><label class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:4px">用紙 <select data-act="size" aria-label="用紙">${Object.keys(PAPERS).map(k => `<option value="${k}"${k === paper ? ' selected' : ''}>${k}</option>`).join('')}</select></label>${IN_VIEWER ? '' : '<button class="btn primary" data-act="print">印刷する</button>'}<button class="btn${IN_VIEWER ? ' primary' : ''}" data-act="pdf">PDFで保存</button><button class="btn" data-act="close">閉じる</button></div></header>
          <div class="stage"><div class="scaler"></div></div></div>`);
        scaler = $('.scaler', pv);
        // ページの高さを測りながら分けるので、はじめから画面に入れておく（並べ終わるまで見えないように）
        pv.style.visibility = 'hidden';
        document.body.appendChild(pv);
        try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* なくても続ける */ }
        const stage = $('.stage', pv);
        const fit = () => { const W = mmpx(dims().w); scaler.style.transform = ''; const s = Math.min(1, (stage.clientWidth - 32) / W); scaler.style.transform = `scale(${s})`; scaler.style.width = W + 'px'; scaler.style.height = s < 1 ? (scaler.scrollHeight * s) + 'px' : ''; };
        const draw = () => { scaler.style.transform = ''; scaler.style.height = ''; render(); $('.msg', pv).textContent = `${paper}・${pages.length}ページ`; fit(); };
        draw();
        pv.style.visibility = '';
        window.addEventListener('resize', fit);
        const close = () => { window.removeEventListener('resize', fit); document.removeEventListener('keydown', onKey); pv.remove(); };
        const onKey = e => { if (e.key === 'Escape' && !$('.gky-veil')) close(); };
        document.addEventListener('keydown', onKey);
        $('[data-act="close"]', pv).onclick = close;
        $('[data-act="size"]', pv).onchange = e => { paper = e.target.value; setPref(pkey, paper); draw(); };
        const pb = $('[data-act="print"]', pv);
        if (pb) pb.onclick = () => api.print();
        $('[data-act="pdf"]', pv).onclick = () => api.pdfMenu();
        return api;
      },
      print() {
        let root = $('#gky-print-root');
        if (!root) { root = document.createElement('div'); root.id = 'gky-print-root'; document.body.appendChild(root); }
        root.innerHTML = '';
        pages.forEach(p => root.appendChild(p.cloneNode(true)));
        let st = $('#gky-page-style');
        if (!st) { st = document.createElement('style'); st.id = 'gky-page-style'; document.head.appendChild(st); }
        const { w, h: hh } = dims();
        st.textContent = `@page{size:${w}mm ${hh}mm;margin:0}`;
        document.body.classList.add('gky-printing');
        const done = () => { document.body.classList.remove('gky-printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
        window.addEventListener('afterprint', done);
        setTimeout(() => { window.print(); setTimeout(done, 1500); }, 60);
      },
      /* PDF：いちばんよいのは印刷の画面の「PDFに保存」（文字を選べる・さがせる・小さい）。できないときは画像のPDF */
      pdfMenu() {
        if (IN_VIEWER) return api.pdf();
        sheet({ title: 'PDFで保存', content: `<div class="gky-pdfopt"><p style="margin:0">おすすめは、<b>印刷の画面で、送り先（プリンター）を「PDFに保存」</b>にする方法です。文字を選んだりさがしたりでき、ファイルも小さくなります。</p>
          <p class="muted" style="margin:0;font-size:12.5px">iPhone・iPad：印刷の画面で、右上の共有ボタン →「ファイルに保存」。<br>うまくいかないときは「画像のPDFを作る」を使ってください（見た目は同じですが、文字は選べません）。</p></div>`,
          actions: [{ label: '画像のPDFを作る', onClick: () => { api.pdf(); } }, { label: '印刷の画面を開く', primary: true, onClick: () => { api.print(); } }] });
      },
      async pdf() {
        const btn = pv && $('[data-act="pdf"]', pv);
        const old = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = 'PDFを作っています…'; }
        try {
          await loadScript(H2C); await loadScript(JSPDF);
          const { jsPDF } = window.jspdf;
          const { w, h: hh } = dims();
          const pdf = new jsPDF({ unit: 'mm', format: [w, hh], orientation: orient, compress: true });
          const holder = h('<div style="position:fixed;left:-30000px;top:0;"></div>');
          document.body.appendChild(holder);
          for (let i = 0; i < pages.length; i++) {
            const c = pages[i].cloneNode(true); c.style.boxShadow = 'none'; holder.appendChild(c);
            const canvas = await window.html2canvas(c, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
            c.remove();
            if (i) pdf.addPage([w, hh], orient);
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, w, hh, undefined, 'FAST');
          }
          holder.remove();
          await saveFile(safeName(file || title) + '.pdf', pdf.output('blob'), 'application/pdf');
        } catch (e) {
          toast(IN_VIEWER ? 'PDFを作れませんでした。少し待ってからもう一度押してください' : 'PDFを作れませんでした。ネットにつながっているか確かめてください（「印刷する」からPDFに保存することもできます）');
        } finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
      },
      get pages() { return pages; },
      get paper() { return paper; },
    };
    return api;
  }

  /* 印刷用の文字（BIZ UDPゴシック）を先に読んでおく。ページの分け方が読み込みの前後で変わらないように */
  try { if (document.fonts && document.fonts.load) ['400', '700'].forEach(w => document.fonts.load(w + ' 10pt "BIZ UDPGothic"').catch(() => {})); } catch (e) { /* なくても動く */ }

  /* ---------- 見るだけのリンクとQRコード ---------- */
  /* 中身（JSON）を、アドレスに入れられる短い文字にする（圧縮できる端末では圧縮。Z…＝圧縮、J…＝そのまま） */
  const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  async function packShare(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) { try { const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); return 'Z' + b64u(z); } catch (e) { /* 圧縮できなければそのまま */ } }
    return 'J' + b64u(bytes);
  }
  async function unpackShare(code) {
    code = String(code || '').trim();
    let bytes = unb64u(code.slice(1));
    if (code[0] === 'Z') { if (!window.DecompressionStream) throw new Error('この端末ではこのリンクを開けません'); bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
    else if (code[0] !== 'J') throw new Error('リンクを読めません');
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  /* 見るだけのリンク（このツールのページのアドレス ＋ #v=中身） */
  const shareUrl = async (slug, obj) => pageUrl(slug) + '#v=' + await packShare(obj);
  /* 開いたアドレスが見るだけのリンクなら、中身を返す（ちがえば null） */
  async function readShare() { const m = location.hash.match(/^#v=([A-Za-z0-9_-]+)$/); if (!m) return null; return unpackShare(m[1]); }
  function qrSVG(text, size = 180) {
    const q = qrcode(0, text.length > 900 ? 'L' : 'M'); q.addData(unescape(encodeURIComponent(text))); q.make();
    const n = q.getModuleCount(), m = 4;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + m * 2} ${n + m * 2}" shape-rendering="crispEdges" width="${size}" height="${size}" role="img" aria-label="QRコード"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  /* リンクを配る画面：リンク（コピー・送る）と、入りきればQRコード */
  /* keep：開いた端末に入るリンク（部員用の設定・合奏ノートの提出など）のとき true */
  function shareSheet({ title = '見るだけのリンク', url, note = '', keep = false }) {
    let qr = '';
    if (url.length <= 2300) { try { qr = qrSVG(url, 180); } catch (e) { qr = ''; } }
    return sheet({ title, content: `${note ? `<p class="lead">${note}</p>` : ''}<div class="gky-share">${qr ? `<div class="qr">${qr}</div>` : ''}<div class="url"><textarea readonly aria-label="リンク">${esc(url)}</textarea><p class="note">${qr ? 'QRコードをスマホのカメラで読むと開けます。' : '中身が多いので、QRコードには入りきりません。リンクをコピーして、LINEなどで送ってください。'}${keep ? '開いた端末で「入れる」を押すと、その端末に入ります。' : '受け取った人の端末には保存されません（見るだけ）。'}</p></div></div>`,
      actions: [...(navigator.share ? [{ label: '送る', keep: true, onClick: () => { navigator.share({ title, url }).catch(() => {}); return false; } }] : []), { label: '閉じる' }, { label: 'リンクをコピー', primary: true, keep: true, onClick: () => { copyText(url, 'リンクをコピーしました'); return false; } }] });
  }
  /* 見るだけのページ：上のタブとふだんの画面をかくし、受け取った中身だけを出す。中身を入れる要素を返す */
  function viewer({ title, sub = '', note = '' }) {
    const nav = $('.gky-tabs'); if (nav) nav.hidden = true;
    const acts = $('.gky-top-actions'); if (acts) acts.hidden = true;
    const main = $('.gky-main');
    [...main.children].forEach(c => { c.hidden = true; });
    const box = h(`<div id="gkyView"><div class="gky-viewer"><span class="tape">見るだけ</span><div><b>${esc(title)}</b>${sub ? `<div class="muted">${esc(sub)}</div>` : ''}</div><span class="sp"></span><a class="btn sm" href="${esc(location.pathname)}">ふだんの画面へ</a></div><div id="gkyViewBody"></div><p class="note">${esc(note || 'このページは、送られてきた内容を見るだけです。この端末には保存しません。')}</p></div>`);
    main.prepend(box);
    return $('#gkyViewBody', box);
  }

  /* ---------- このツールについて ---------- */
  function about({ name, what, version, changelog = [], feedback = '' }) {
    const fb = feedback || FEEDBACK_URL;
    const log = changelog.map(c => `<li><b class="mono">v${esc(c.v)}</b> <span class="muted mono">${esc(c.d)}</span><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></li>`).join('');
    const sh = sheet({ title: name + 'について', content: `<p style="margin:0 0 10px">${what}</p>
      <ul style="margin:0 0 12px;padding-left:1.2em;font-size:13px">
        <li>入力した内容は、この端末のブラウザの中だけに保存されます。どこのサーバーにも送られません。AIも使っていません。</li>
        <li>ブラウザの履歴やサイトのデータを消すと、保存した内容も消えます。ときどき楽屋の「バックアップ」でファイルに保存してください。</li>
        <li>同じ場所（例：bamiriunei-arch.github.io）に置いたツールどうしは、楽屋に入れた部員・曲・楽器のデータを共有します。</li>
      </ul>
      <label class="chk" style="margin:0 0 12px"><input type="checkbox" id="gkyBig" ${pref('big', false) ? 'checked' : ''}> 文字を大きくする（この端末の全部のツール）</label>
      <p class="muted" style="font-size:12px;margin:0 0 6px">版 <span class="mono">${esc(version)}</span>（共通部品 v${VERSION}）　<a href="${esc(fb)}" target="_blank" rel="noopener">ご意見・ご要望</a>　<a href="${esc(linkTo('gakuya'))}" target="${targetOf('gakuya')}" rel="noopener">楽屋（ツールの一覧）</a></p>
      <details data-keep-words><summary style="cursor:pointer;font-size:13px">更新の記録</summary><ul style="font-size:12.5px;padding-left:1.2em">${log}</ul></details>` });
    $('#gkyBig', sh.body).onchange = e => setPref('big', e.target.checked);
    return sh;
  }

  /* ---------- バックアップのお知らせ（ツールの画面でも） ----------
     このツールにデータがあって、最後のバックアップから日がたっているとき（学校は7日、ほかは30日）、1日に1回だけ知らせる。
     学校のChromebook・iPadは、サインアウトでデータが消える設定のこともあるため */
  function backupNag() {
    try {
      const s = store.get(SLUG + '.v1'); if (!s || s.sample) return;
      const today = ymd(); if (pref('bkNagDay', '') === today) return;
      const last = +pref('lastBackup', 0), days = last ? Math.floor((Date.now() - last) / 86400000) : null, lim = isSchool() ? 7 : 30;
      if (days != null && days < lim) return;
      setPref('bkNagDay', today);
